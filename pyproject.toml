[project]
name = "steel_onslaught"
version = "0.1.0"
description = "Steampunk tactical mech battle — event-bus-native, replayable, contract-driven contest framework"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "ulid-py>=1.1",
    "websockets>=12.0",  # used by Task 31's WebSocket bridge to the frontend
    # OmniNode ONEX primitives — resolved from published packages so fresh
    # clones and hosted CI do not depend on a developer's workspace layout.
    # Core provides the event/envelope/reducer/intent models; SPI provides the
    # protocol contracts. Infra is intentionally excluded from this engine.
    "omnibase-core>=0.46.2",
    "omnibase-spi>=0.22.0",
    # httpx is the LLM client transport (transitive via omnibase-core, but
    # declared explicitly for the LLM pilot/tuner effect node).
    "httpx>=0.27",
    # Pillow renders the deterministic per-tick arena PNG for the V-IMG
    # vision-pilot arm (2026-07-24). Pinned range: newer Pillow versions can
    # change default PNG compression behavior, which would break the
    # byte-identity determinism guarantee this renderer depends on.
    "pillow>=10.4,<11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",  # for the WebSocket bridge tests in Task 31
    "mypy>=1.10",
    "ruff>=0.5",
    "playwright>=1.45",      # used only by Task 34's Proof of Life web assertion
]

[project.scripts]
so = "steel_onslaught.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steel_onslaught"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast in-memory tests",
    "integration: cross-module tests with real SQLite",
    "slow: tests over 1s",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/", "tests/"]
