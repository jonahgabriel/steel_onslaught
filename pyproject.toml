[project]
name = "steel_onslaught"
version = "0.1.0"
description = "Steampunk tactical mech battle — event-bus-native, replayable, contract-driven contest framework"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "ulid-py>=1.1",
    "websockets>=12.0",  # used by Task 31's WebSocket bridge to the frontend
    # OmniNode ONEX primitives — resolved from published packages so fresh
    # clones and hosted CI do not depend on a developer's workspace layout.
    # Core provides the event/envelope/reducer/intent models; SPI provides the
    # protocol contracts. Infra is intentionally excluded from this engine.
    "omnibase-core>=0.46.2",  # short-term git pin -- see [tool.uv.sources] below (OMN-15162, operator ruling 2026-07-26)
    "omnibase-spi>=0.22.0",
    # httpx is the LLM client transport (transitive via omnibase-core, but
    # declared explicitly for the LLM pilot/tuner effect node).
    "httpx>=0.27",
    # Pillow renders the deterministic per-tick arena PNG for the V-IMG
    # vision-pilot arm (2026-07-24). Pinned range: newer Pillow versions can
    # change default PNG compression behavior, which would break the
    # byte-identity determinism guarantee this renderer depends on.
    "pillow>=12.3.0,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",  # for the WebSocket bridge tests in Task 31
    "mypy>=1.10",
    "ruff>=0.5",
    "playwright>=1.45",      # used only by Task 34's Proof of Life web assertion
    # OMN-15522: transitive via omnibase-core already, but declared
    # explicitly (same convention as httpx above) for the
    # _PROGRAMMING_RESPONSE_CONTRACT fixture-bridge test, which validates
    # the wire JSON Schema against the real programming-response parser.
    "jsonschema>=4.17",
]
# OMN-15170: an explicit opt-in extra, deliberately NOT part of `dev` and NOT
# installed by CI (ci.yml runs `uv sync --extra dev` only) -- a raw-Kafka
# client is exactly the "Infra is intentionally excluded from this engine"
# dependency this repo's own module docstrings (client_delegation.py,
# kafka_forwarder.py) document as out of scope for steel's runtime. This
# extra exists ONLY so tests/live/ (never imported/collected by CI's default
# `-m "not live"` selection) can drive a real producer/consumer
# against the stability-test lane when a human explicitly opts in locally
# (`uv sync --extra live`).
live = [
    "confluent-kafka>=2.3",
]

[project.scripts]
so = "steel_onslaught.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steel_onslaught"]

# Short-term git pin per operator ruling 2026-07-26 (OMN-15162): the
# omnibase-core PyPI release train has not yet shipped OMN-15161's
# fleet-generic dispatch-report-contract port (core PR #1510, squash
# 3f2998b3337e4050b4758e0dd2a0fe1061ce0d98 -- the tip of origin/dev at pin
# time), so steel pins the git dev squash commit instead of waiting for a
# release. Revert this source override back to plain PyPI-registry
# resolution (">=0.46.2"-style range in [project.dependencies]) at the next
# omnibase-core release that includes this squash. Never pin a branch head
# (reference_never_pin_a_feature_branch_head) -- only a squash commit sha.
[tool.uv.sources]
omnibase-core = { git = "https://github.com/OmniNode-ai/omnibase_core", rev = "3f2998b3337e4050b4758e0dd2a0fe1061ce0d98" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# OMN-15493 -- DO NOT "tidy" --strict-markers into an `addopts` entry here.
# CI passes it on the command line (.github/workflows/ci.yml) because on the
# pinned pytest 9.0.3 the addopts form silently does not take effect:
#
#   addopts = ["--strict-markers"] -> `@pytest.mark.liv` merely warns
#                                     (PytestUnknownMarkWarning), test collected
#   pytest --strict-markers        -> collection ERROR, "'liv' not found in
#                                     `markers` configuration option"
#
# Measured 2026-07-30 on pytest 9.0.3 (the version uv.lock pins, so CI behaves
# the same). Both forms report `config.option.strict_markers is True` at
# pytest_configure time, so the option really is parsed out of addopts and the
# divergence is somewhere later; the command-line form is the one demonstrated
# to fail collection, and that is why it is the one CI uses. The behavioural
# difference -- not the config text -- is what
# tests/test_ci_marker_selection.py asserts.
markers = [
    "unit: fast in-memory tests",
    "integration: cross-module tests with real SQLite",
    "slow: tests over 1s",
    # OMN-15170: real external infra (stability-test Kafka + the .200 MLX
    # server) -- the ONE category CI excludes, via `-m "not live"`, and
    # additionally gated by a `confluent_kafka` import guard + an explicit
    # opt-in env var so it cannot run accidentally even if CI's `-m` filter
    # ever changes. See tests/live/test_omn15170_live_driver.py. OMN-15493:
    # this marker is now load-bearing in both directions -- omitting it no
    # longer skips a test, and misspelling it is caught by --strict-markers.
    "live: real external infra (Kafka + live LLM), explicit opt-in only",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/", "tests/"]
