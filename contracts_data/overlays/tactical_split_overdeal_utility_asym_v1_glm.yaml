# U-GATE + O-GATE combined battery overlay bound to Zhipu GLM over the z.ai
# CODING plan (a FOURTH independent lineage — Zhipu — alongside the Qwen,
# DeepSeek, and Google/Gemma arms).
#
# This is the GLM twin of ``tactical_split_overdeal_utility_asym_v1_gemma.yaml``:
# a mechanical merge of that overlay's utility-surfacing arena/split-decks/rule-
# pack/cadence with GLM-over-z.ai provider deltas.  It is the intersection of:
#   - the ASYM objective arena ``foundry_60_asym_v1`` (asymmetric cover corridors
#     + 3 objective cells + vp_threshold 15), so a match can end on VP as well as
#     elimination; AND
#   - the THIRD split-deck pile (each seat dealt an extra ``utility`` quota of
#     smoke/chaff/flares counterplay cards + the ``utility_handler_pack``);
#   - bound to Zhipu GLM (``glm-4.5``) served through the z.ai CODING plan over an
#     authenticated OpenAI-compatible endpoint.
#
# The empirical question it lets the O-GATE battery answer for the CROSS-
# ARCHITECTURE Zhipu arm: with utility counterplay in hand, does the red brawler
# survive the sniper's sightline lane long enough to contest VP on
# ``foundry_60_asym_v1`` when the pilot is a GLM model rather than a Qwen,
# DeepSeek, or Gemma model?  Over-deal stays the mechanism: the deal grows to 10
# (4 movement + 4 weapon + 2 utility) while the program stays 5, so utility
# competes for the SAME 5 registers as movement and attack.  No balance knob is
# touched (U-GATE requirement): the utility effect is expressed only through
# LOS/lock/targeting consults in the fold, never a damage/evasion/range number.
#
# GLM-over-z.ai provider deltas (vs the keyless local twins) — the cross-
# architecture Zhipu arm "differing ONLY in provider binding plus declared
# max_tokens/timeout/retry deltas and the thinking-off control":
# * provider binding: the AUTHENTICATED OpenAI-compatible z.ai CODING endpoint at
#   ``https://api.z.ai/api/coding/paas/v4/chat/completions``, model pinned EXACTLY
#   to ``glm-4.5`` (the lower-power / prior-gen tier — the Flash/Air tiers are not
#   available on this account, and requesting Air silently upgrades and
#   misattributes, so ``glm-4.5`` is the exact, honest pin).  Both seats
#   (glm_berserker red / glm_sniper blue), pilot registry
#   ``../pilots/fire_dense_glm``.
# * ``secret_ref: secret://llm/glm`` with ``secret_resolver.kind: injected``:
#   z.ai requires a Bearer key.  The opaque ``secret://`` reference is the ONLY
#   credential material in this file — the real key is NEVER written here.  It is
#   resolved at the CLI/battery edge from ``LLM_GLM_API_KEY`` (env or
#   ~/.omnibase/.env) and reaches only the Authorization header at request time.
# * ``thinking: {type: disabled}``: GLM is a hybrid reasoning model that, left
#   unconstrained, narrates its chain-of-thought into ``content`` and overflows
#   the register JSON (the same failure DeepSeek exhibited).  The probe proved
#   that with ``thinking`` disabled, ``glm-4.5`` returns clean JSON with
#   ``reasoning_tokens: 0`` and no CoT narration.  This is forwarded verbatim as
#   a top-level ``thinking`` object on the request body via the additive provider
#   ``thinking`` binding (``ModelSOThinkingBinding``); keyless and OpenRouter
#   overlays that omit it produce a byte-identical request body.
# * ``max_tokens: 4096``: with thinking disabled there is no CoT span to clear,
#   so 4096 is ample headroom for a five-register whole-round program under
#   ``response_format: {"type":"json_object"}`` (always sent by the SO
#   programming path via ``json_mode=True``).
# * ``timeout_seconds: 45``: a sequential completion over the z.ai coding pool
#   normally lands in ~4 s. The pool intermittently STALLS a request, and a long
#   120 s ceiling meant one stall blocked the whole match for two minutes before
#   aborting. 45 s makes a stall fail FAST so the retry below can absorb it while
#   still leaving generous margin for a genuinely slow upstream hop.
# * ``retry: {max_attempts: 4, initial_backoff_seconds: 1.0,
#   backoff_multiplier: 2.0}``: the z.ai CODING subscription is a flat-rate plan
#   (no per-token cost), so the retry is here to absorb intermittent transport
#   STALLS, not rate limits. A single attempt turned one pool stall into a whole-
#   match abort (reproduced 2/2 smoke runs). Four attempts with a 1 s → 2 s → 4 s
#   bounded backoff retry RETRYABLE transport failures (timeout / transient
#   request error) — a real HTTP error or a truncated/semantic failure is still
#   surfaced. Keyless local arms keep ``max_attempts: 1`` and stay byte-identical
#   single-shot; only this GLM arm opts into mid-match resilience.
#
# NOTE on reasoning_effort: the SO LLM client wire contract
# (``ModelSOOpenAIChatRequest``) has NO ``reasoning_effort`` field, so it cannot
# be carried in this overlay — thinking-off is expressed through the provider
# ``thinking`` binding instead, which is the mechanism GLM actually honors.
#
# Every utility/arena surface (arena, decks, over-deal hand quotas, register
# count, cadence, rule pack, utility pile + handler pack, personas) is
# byte-identical to the gemma/deepseek/qwen27 combined overlays so within-model
# contrasts stay comparable ACROSS models.  Neither existing overlay nor either
# arena contract is modified — ``foundry_60`` and ``foundry_60_asym_v1`` stay
# byte-frozen so historical replays remain valid.  Ledger paths are isolated
# under a NEW state directory so this combined glm battery does not collide with
# any other lane.
#
# The ``secret_resolver`` is ``injected`` (not ``none``): the sole provider
# carries a real ``secret_ref``, so composition requires a resolver capability.
# The O-GATE battery driver selects it and supplies an env-backed resolver:
#
#   scripts/run_ogate_objectives_battery.py \
#       --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_v1_glm.yaml \
#       --red-loadout contracts_data/loadouts/glm/berserker_scout.yaml \
#       --blue-loadout contracts_data/loadouts/glm/sniper_ironclad.yaml
#
# with LLM_GLM_API_KEY available in the environment or ~/.omnibase/.env.
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_glm/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_glm/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_glm/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_glm/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_glm/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_glm/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_glm
  arena_id: foundry_60_asym_v1
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.glm_berserker
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.glm_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  # Phase 2 — utility resolution handlers selected by this typed overlay
  # (design §6 Handlers row).  The full pack is named explicitly so the
  # runner's fail-closed ``select`` is driven by the overlay, not a hardcoded
  # default.  Narrowing this list (e.g. dropping ``utility.flares.v1``) would
  # make that kind fail closed at resolution time.
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: glm
      endpoint_url: https://api.z.ai/api/coding/paas/v4/chat/completions
      model: glm-4.5
      secret_ref:
        kind: opaque
        ref: secret://llm/glm
      timeout_seconds: 45.0
      max_tokens: 4096
      # GLM narrates chain-of-thought into content unless the thinking span is
      # explicitly disabled; forwarded verbatim as a top-level ``thinking``
      # object on the request body. Keyless/OpenRouter overlays omit this and
      # stay byte-identical.
      thinking:
        type: disabled
      retry:
        # The z.ai CODING pool occasionally stalls a normally ~4 s request past
        # the transport timeout. A single fail-loud attempt turned one such stall
        # into a whole-match abort (reproduced 2/2 smoke runs). With the shorter
        # 45 s timeout above, a stall now fails FAST and this bounded backoff
        # retries the RETRYABLE transport failure (timeout / transient request
        # error) instead of aborting. Schedule: 4 attempts, sleeping 1 s → 2 s →
        # 4 s between them (total backoff 7 s, well under the 300 s contract
        # bound). Keyless local arms stay pinned at max_attempts=1 and remain
        # byte-identical single-shot.
        max_attempts: 4
        initial_backoff_seconds: 1.0
        backoff_multiplier: 2.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.glm
      display_name: Zhipu GLM 4.5 (z.ai coding)
      provider_binding_id: glm
  personas_dir: ../pilots/personas
  secret_resolver:
    # Injected: the sole provider carries ``secret_ref: secret://llm/glm``, so
    # composition requires a resolver capability.  The battery driver supplies an
    # env-backed resolver that reads LLM_GLM_API_KEY at the edge; the key never
    # appears in this file, argv, or any log.
    kind: injected
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
