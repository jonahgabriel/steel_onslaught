# Composition arm (session 2026-07-24, SO-COMP-P5): stack every lever that
# moved BEHAVIOR/COGNITION but not OUTCOME on top of the one dose that has
# actually moved outcome (P4, dmg x8, 27.6%). NEW, additive overlay -- the P4
# overlay (``tactical_split_overdeal_utility_asym_pair_p4_dmg8_qwen.yaml``)
# and every other pair-sweep/R1/covered_advance overlay are all untouched.
#
# This overlay is the SAME U-GATE + O-GATE combined shape as the v1/P1-P4
# overlays (asym objective arena + the third split-deck utility pile,
# over-deal 10 / program 5, no balance knob touched here). It is
# byte-identical to the P4 overlay except for THREE additive rebindings,
# stacked on top of the P4 arena/loadout pairing, plus isolated ledger paths:
#
#   - arena: ``foundry_60_asym_v1`` -- UNCHANGED (same arena as P1-P4; this
#     is NOT the v2/broken-sightline arena the covered_advance and R1
#     batteries themselves ran on -- mortar_r30 was designed as the
#     approach-fix specifically for v1 and is HELD CONSTANT across
#     P1/P2/P3/P4/this arm, per operator instruction).
#   - blue loadout: ``loadout.llm.qwen35_sniper_ironclad_mortar_r30`` --
#     UNCHANGED, the shared approach-fix lever. Bound via ``--blue-loadout``
#     at launch, not referenced inside this overlay file.
#   - red loadout: ``loadout.llm.qwen35_berserker_dmg8`` -- UNCHANGED, the
#     P4 lethality-dose lever (machine_gun 8->64, shrapnel_thrower 12->96).
#     REUSED VERBATIM from P4 -- this arm does not re-create or modify it.
#     Bound via ``--red-loadout`` at launch, not referenced inside this
#     overlay file.
#   - red ``movement_deck_id``: ``deck.movement.v1`` -> ``deck.movement.v2``
#     (``contracts_data/decks/movement_v2.yaml``, PR #165) -- adds
#     ``card.movement.covered_advance`` to red's movement pool at 6/20
#     copies (~79.3% deal rate on a 4-card movement hand). Blue's
#     ``movement_deck_id`` stays ``deck.movement.v1`` -- UNCHANGED, matching
#     the precedent set by the covered_advance battery's own overlay
#     (``tactical_split_overdeal_utility_asym_v3_qwen.yaml``), which also
#     rebound only the red seat.
#   - both seats' card-programmer ``pilot_spec_id`` move from
#     ``pilot.llm.qwen35`` / ``pilot.llm.qwen35_sniper`` to the EXISTING,
#     UNMODIFIED R1 pilot specs ``pilot.llm.qwen35_berserker_spatial_r1`` /
#     ``pilot.llm.qwen35_sniper_spatial_r1``
#     (``contracts_data/pilots/fire_dense_qwen/llm_qwen35_{berserker,sniper}
#     _spatial_r1.yaml``, PR #167) -- ASCII grid + resolver-backed
#     consequence previews + in-range flags, representation ONLY
#     (``spatial_representation: grid``, not ``grid_scaffold`` --
#     R2's forced ``spatial_read`` field added nothing measurable over R1
#     and is deliberately NOT used here). Symmetric on both seats, matching
#     R1's own fairness design (not a one-sided advantage). No new pilot
#     spec files are created -- both ids already exist on ``main``.
#
# Seam note (verified against ``src/steel_onslaught/match/composition.py``
# before wiring this overlay): in card mode the CARD PROGRAMMER -- not the
# loadout's declared ``pilot_id`` field -- is the seat's decision-maker
# (``validate_seat_programmer_identity``, which checks only that the
# resolved programmer's ``persona`` equals the seat's declared
# ``archetype``, never the loadout's ``pilot_id``). The stricter
# ``loadout.pilot_id == assignment.pilot_spec_id`` check in
# ``composition.py`` lives on the separate roster/session-gated
# ``assemble_selected_match_live`` path (browser/interactive play), which
# the O-GATE battery driver (``assemble_match_live`` /
# ``run_ogate_objectives_battery.py``) does not use. This is exactly how
# the merged R1 battery itself paired ``loadout.llm.qwen35_berserker_v2``
# (``pilot_id: pilot.llm.qwen35``) with programmer
# ``pilot.llm.qwen35_berserker_spatial_r1`` (persona=berserker, matching
# archetype=berserker) -- so pairing the dmg8 loadout (same declared
# ``pilot_id: pilot.llm.qwen35``) with the spatial_r1 programmer is the
# identical, already-proven-legal seam.
#
# Neither the P4 overlay, the P1/P2/P3 overlays, the arena contract, the
# dmg8 loadout/weapons, the mortar_r30 loadout, ``deck.movement.v1``,
# ``deck.movement.v2``, nor either spatial_r1 pilot spec is modified --
# every one of those files stays byte-frozen so historical replays remain
# valid. Ledger paths are isolated under a NEW state directory so this
# arm's battery does not collide with any other lane.
#
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_composition_p4dmg8_covadv_r1_qwen.yaml \
#          --loadout-a contracts_data/loadouts/llm_qwen35_berserker_dmg8.yaml \
#          --loadout-b contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml --seed 5001
#
# and the O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file>
# --red-loadout contracts_data/loadouts/llm_qwen35_berserker_dmg8.yaml
# --blue-loadout contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml
# --state-root .onex_state/steel_onslaught/composition_p4dmg8_covadv_r1``
# (--expected-arena stays the driver default, foundry_60_asym_v1).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/composition_p4dmg8_covadv_r1/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/composition_p4dmg8_covadv_r1/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/composition_p4dmg8_covadv_r1/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/composition_p4dmg8_covadv_r1/lineage
  experiment_root: ../../.onex_state/steel_onslaught/composition_p4dmg8_covadv_r1/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/composition_p4dmg8_covadv_r1/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60_asym_v1
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v2
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35_berserker_spatial_r1
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper_spatial_r1
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
