# SO-RANGECAP arm (mortar_r15 x red-dmg-x16, session 2026-07-25) battery
# overlay. NEW, additive overlay -- the v1 combined overlay, the standalone
# arm-1 overlay, and the P1/P2/P3/P4/P5/P6/P7 pair-sweep overlays are all
# untouched.
#
# This overlay is the SAME U-GATE + O-GATE combined shape as the P1-P7
# overlays (design 2026-07-22 Sec5: asym objective arena + the third split-
# deck utility pile, over-deal 10 / program 5, no balance knob touched here
# in the overlay itself). This arm PAIRS two levers, exactly two, no more,
# and is byte-identical to the P6 overlay except for the blue loadout id,
# the pre-registration comment block, and the isolated ledger paths -- the
# ONLY experimental delta against P6 is blue's mortar range (r30 -> r15);
# red's dose is HELD at P6's dmg16, unchanged:
#   - arena: ``foundry_60_asym_v1`` -- UNCHANGED, otherwise-stock (this arm
#     does not touch the arena).
#   - blue loadout: ``loadout.llm.qwen35_sniper_ironclad_mortar_r15``
#     (``contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r15.yaml``)
#     -- the range-cap lever under test THIS arm: swaps ONLY
#     ``weapon.siege.artillery_mortar_r30`` ->
#     ``weapon.siege.artillery_mortar_r15`` (range 30 -> 15, halving the
#     r30 standoff distance; every other weapon field, and every other
#     loadout field, identical to the r30 loadout held constant across
#     P1-P7). Bound via ``--blue-loadout`` at launch, not referenced
#     inside this overlay file.
#   - red loadout: ``loadout.llm.qwen35_berserker_dmg16``
#     (``contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml``) --
#     UNCHANGED from P6, the arm this battery compares against. Bound via
#     ``--red-loadout`` at launch, not referenced inside this overlay
#     file.
#
# WHY x16, not x24: x24 (P7, dmg24) is the more deeply saturated dose
# point (hits-to-kill hard-floors at exactly 2, zero variance, per
# docs/evidence/2026-07-25-pair_p7_dmg24-battery.md Sec4) but its loadout
# and overlay files are NOT YET MERGED to origin/main as of this arm's
# branch point (verified 2026-07-25: origin/main HEAD 38dd334 has
# llm_qwen35_berserker_dmg16.yaml but no _dmg24 file). x16 (P6, dmg16) IS
# on origin/main and is independently established as past the point where
# red's kill speed overtakes blue's (P6 Sec4: red mean hits-to-kill 2.18 <
# blue's 2.62) -- the same "saturated" threshold this task names. Building
# this arm on the merged x16 baseline keeps the worktree additive-only off
# origin/main with no cross-branch dependency on an unmerged arm.
#
# SINGLE-AXIS MANIPULATION: exactly one property of the engagement
# geometry changes relative to the P6 baseline -- blue's mortar range
# (30 -> 15). Red's dose, the arena, the utility deck, and every other
# weapon/loadout field are byte-identical to P6. Any win-rate delta
# against P6 is attributable to blue's standoff range alone.
#
# PRE-REGISTERED, FALSIFIABLE hypothesis pair (written BEFORE this battery
# ran):
#
#   Baseline: P6 (mortar_r30 x dmg16, docs/evidence/2026-07-24-pair_p6_dmg16
#   -battery.md) scored 17/30 = 0.56667 decided-match red win rate.
#
#   H_RANGE (blue's range advantage IS a -- or the -- residual capping
#   mechanism P6/P7 flagged as unexplained): cutting blue's mortar
#   standoff range in half (30->15), at fixed dose, raises red's win rate
#   by at least as much as the single largest dose-driven marginal gain
#   observed anywhere in the P1-P7 program (+15.74pp, the x8->x11 step,
#   per docs/evidence/2026-07-25-pair_p7_dmg24-battery.md Sec8).
#
#   FORMAL CRITERION (the ONLY criterion this arm is scored against):
#   decided-match red win rate >= 22/30 (0.56667 + 0.1574 = 0.72407;
#   30 x 0.72407 = 21.72, so 22/30 = 0.73333 is the smallest integer win
#   count at or above the threshold -- 21/30 = 0.70000 falls short of it).
#   Win rate >= 22/30 supports H_RANGE. Win rate <= 21/30 supports
#   H_NULL (range is NOT the -- or not the sole -- residual capping
#   mechanism; the cap lies elsewhere, e.g. approach/exposure-time
#   dynamics net of range, or something this arm does not isolate) --
#   this is an equally real, publishable finding, not a failed run.
#
# No illustrative percentage band is given alongside the formal criterion
# (the lesson from P7 Sec "Verdict": an illustrative aside that is not
# re-derived from the formal criterion's own arithmetic can drift out of
# sync with it and make the verdict arguable after the fact). The 22/30
# threshold above IS the criterion, stated one way, arithmetic shown
# inline.
#
# This arm does NOT pre-favor either hypothesis -- report whichever is
# better supported, or report that n=30 cannot distinguish them (a fully
# acceptable answer, and the expected shape per this program's own record:
# no adjacent-arm comparison at n=30 has ever reached significance).
#
# Neither the v1 overlay, the arm-1 overlay, the P1-P7 overlays, the arena
# contract, nor any baseline loadout/weapon is modified --
# ``foundry_60_asym_v1``, ``llm_qwen35_berserker_dmg16.yaml``,
# ``qwen35/sniper_ironclad.yaml``, and ``qwen35/sniper_ironclad_mortar_r30
# .yaml`` all stay byte-frozen so historical replays remain valid. Ledger
# paths are isolated under a NEW state directory so this arm's battery does
# not collide with any other lane.
#
# Pre-declared method (matched to P1-P7, SAME seed-base as the P6 baseline
# this arm compares against, for a paired comparison): n=30, seed-base
# 5000 (seeds 5001-5030, identical seed-base to every prior pair-sweep arm
# in this family), model pin qwen35 (Qwen3.6-35B-A3B, same provider block
# as P1-P7, unchanged below), --fresh on first launch only.
#
# NOT YET LAUNCHED. Pre-registration only -- this overlay is committed
# before any battery runs against it, per house rule.
#
# The O-GATE battery driver would select it via (command grounded verbatim
# in the P7 overlay header's own launch command, contracts_data/overlays/
# tactical_split_overdeal_utility_asym_pair_p7_dmg24_qwen.yaml, with only
# --overlay / --blue-loadout / --state-root swapped):
# ``scripts/run_ogate_objectives_battery.py --overlay <this file>
# --red-loadout contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml
# --blue-loadout contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r15.yaml
# --n 30 --seed-base 5000 --fresh
# --state-root .onex_state/steel_onslaught/rangecap_r15_dmg16``
# (--expected-arena stays the driver default, foundry_60_asym_v1).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/rangecap_r15_dmg16/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/rangecap_r15_dmg16/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/rangecap_r15_dmg16/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/rangecap_r15_dmg16/lineage
  experiment_root: ../../.onex_state/steel_onslaught/rangecap_r15_dmg16/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/rangecap_r15_dmg16/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60_asym_v1
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
