# ARM V-IMG of the 2026-07-24 vision-representation experiment ("show don't
# tell"). Byte-identical to ``vision_foundry_60_asym_v2_gemini_text.yaml``
# (same model, same arena/loadouts/personas, same provider timeout/retry)
# except for the ONE added block below: ``llm.providers[0].image_attachment``.
# That binding makes ``LLMPilot.decide`` (pilot.py) render + attach a
# deterministic per-tick PNG (``render_observation_png``, llm/render.py)
# alongside the SAME text prompt V-TEXT sends, plus one neutral sentence
# noting the image is attached (no strategy). Both seats render symmetrically
# -- neither side gets an information advantage the other lacks.
#
# Platform non-negotiables this binding relies on:
#   - the render is a PURE deterministic function of match state (same state
#     -> byte-identical PNG; tests/llm/test_render_determinism.py);
#   - the sha256 is recorded in the ``LLM_COMPLETION_REQUESTED`` ledger event
#     (events/payloads.py::ModelSOLlmCompletionRequestedPayload.image_sha256);
#   - the PNG itself is persisted under ``render_output_dir`` below, keyed by
#     match_id/tick, so the ledger's sha256 is joinable to a durable artifact;
#   - replay validity is unaffected -- LLM completion telemetry (image or
#     text) was never part of the canonical fold
#     (src/steel_onslaught/replay/engine.py's own module docstring).
#
# Battery:
#   uv run python scripts/run_ogate_objectives_battery.py \
#       --overlay contracts_data/overlays/vision_foundry_60_asym_v2_gemini_img.yaml \
#       --red-loadout contracts_data/loadouts/vision_gemini/berserker_scout_v2.yaml \
#       --blue-loadout contracts_data/loadouts/vision_gemini/sniper_ironclad.yaml \
#       --expected-arena foundry_60_asym_v2 \
#       --n 30 --seed-base 5000 \
#       --state-root .onex_state/steel_onslaught/vl_img_battery
# with GEMINI_API_KEY available in the environment or ~/.omnibase/.env.
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_gemini_img/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_gemini_img/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_gemini_img/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_gemini_img/lineage
  experiment_root: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_gemini_img/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_gemini_img/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/vision_gemini
  arena_id: foundry_60_asym_v2
llm:
  providers:
    - kind: openai_compatible
      provider_id: gemini_vl
      endpoint_url: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      model: gemini-2.5-flash-lite
      secret_ref:
        kind: opaque
        ref: secret://llm/gemini
      timeout_seconds: 90.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
      # V-IMG arm: the ONLY field that differs from the V-TEXT twin overlay.
      # arena_size is config-declared to match foundry_60_asym_v2's own
      # ``size: 60`` (contracts_data/arenas/foundry_60_asym_v2.yaml) -- static
      # per this overlay, never resolved dynamically from the live arena spec
      # (see ModelSOLlmImageAttachmentBinding's docstring).
      image_attachment:
        enabled: true
        arena_size: 60
        render_output_dir: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_gemini_img/renders
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.gemini_vl_img
      display_name: Gemini 2.5 Flash-Lite (V-IMG arm)
      provider_binding_id: gemini_vl
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: injected
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
