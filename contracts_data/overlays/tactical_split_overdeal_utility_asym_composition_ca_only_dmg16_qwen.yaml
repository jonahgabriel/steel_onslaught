# Composition DECOMPOSITION arm SO-COMP-CA (session 2026-07-25): isolate
# ``covered_advance`` ALONE at the x16 dose, with NO spatial R1 present.
# NEW, additive overlay -- the P6 dose-alone overlay, the x8/x16 composition
# overlays, and every pair-sweep / R1 / covered_advance overlay are all
# untouched.
#
# WHY THIS ARM: the two composition arms (x8 and x16) stack BOTH levers at
# once -- red ``deck.movement.v2`` (adds ``card.movement.covered_advance``)
# AND both seats' spatial-R1 pilot specs. Two negative signals replicated
# UNCHANGED across both of them (see
# ``docs/evidence/2026-07-24-composition-p4dmg8-covadv-r1-battery.md`` and
# ``docs/evidence/2026-07-24-composition-p6dmg16-covadv-r1-battery.md``):
# out-of-range fire stayed near the pre-representation baseline instead of
# falling toward R1-alone's 0.4740, and match length roughly doubled the
# dose-alone baseline (median 40.0 vs P6's 23.0 at x16; 44.5 vs P4's 24 at
# x8). NOBODY HAS ISOLATED WHICH LEVER CAUSES THEM. This arm holds the dose
# fixed at x16 and turns on EXACTLY ONE of the two composition levers.
#
# THE ONE CHANGE vs the P6 dose-alone overlay
# (``tactical_split_overdeal_utility_asym_pair_p6_dmg16_qwen.yaml``), which
# this file is otherwise a byte-copy of apart from the isolated ledger
# paths:
#   - red ``movement_deck_id``: ``deck.movement.v1`` -> ``deck.movement.v2``
#     (``contracts_data/decks/movement_v2.yaml``, PR #165) -- adds
#     ``card.movement.covered_advance`` to red's movement pool at 6/20
#     copies (~79.3% deal rate on a 4-card movement hand). That is the
#     entire experimental delta.
#
# EXPLICITLY UNCHANGED (byte-frozen, this arm modifies zero existing files):
#   - arena: ``foundry_60_asym_v1`` -- same arena as every pair-sweep arm.
#   - red loadout: ``loadout.llm.qwen35_berserker_dmg16``
#     (``contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml``, PR #191)
#     -- the x16 lethality dose (machine_gun 8->128, shrapnel_thrower
#     12->192). Bound via ``--red-loadout`` at launch.
#   - blue loadout: ``loadout.llm.qwen35_sniper_ironclad_mortar_r30``
#     (``contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml``)
#     -- the shared approach-fix lever, held constant across P1-P7 and both
#     composition arms. Bound via ``--blue-loadout`` at launch.
#   - blue ``movement_deck_id``: ``deck.movement.v1`` -- covered_advance is
#     asymmetric (red only), exactly as in every prior covered_advance arm.
#   - BOTH seats' card-programmer ``pilot_spec_id``: ``pilot.llm.qwen35`` /
#     ``pilot.llm.qwen35_sniper`` -- the P6 specs, NOT the spatial_r1 specs.
#     The R1 lever is DELIBERATELY ABSENT here; it is the other
#     decomposition arm's lever. Consequence: this arm's prompts carry NO
#     in-range flags and NO ASCII grid at all.
#
# PRE-REGISTERED COMPARISON ANCHORS (both independently recomputed in their
# own merged evidence docs; this arm's floor and ceiling):
#   - FLOOR, P6 dose alone (zero composition levers),
#     ``docs/evidence/2026-07-24-pair_p6_dmg16-battery.md``: match length
#     min=15 / median=23.0 / mean=23.3 / max=40, n=30,
#     play_terminal_fraction=1.0.
#   - CEILING, x16 composition (BOTH levers stacked),
#     ``docs/evidence/2026-07-24-composition-p6dmg16-covadv-r1-battery.md``:
#     match length min=16 / median=40.0 / mean=47.23 (all 30) / 49.46
#     (elim-only) / max=134.
#
# PRE-REGISTERED FORMAL CRITERION -- exactly ONE, arithmetic shown, and NO
# accompanying illustrative band (a second, softer-sounding threshold
# alongside the formal one was the P7 defect and is not repeated here).
#
#   PRIMARY ENDPOINT: median match length in ``duration_ticks`` over the n
#   valid battery rows (n=30 unless a seed aborts, in which case the doc
#   states the realized n explicitly and uses it).
#
#   THRESHOLD: the arithmetic midpoint of the floor and the ceiling medians,
#     (23.0 + 40.0) / 2 = 63.0 / 2 = 31.5 ticks.
#
#   ISOLATED-CAUSE  (H_CA): median >= 31.5 ticks -- covered_advance alone,
#     with NO spatial R1 present, already drags match length materially
#     toward the composition's elongation.
#   NOT-THE-CAUSE   (H_NOT_CA): median < 31.5 ticks -- length stays near
#     P6's floor, and the composition's ~74-85% elongation therefore
#     requires spatial R1 or the two-lever combination.
#
# SECONDARY / DIAGNOSTIC, EXPLICITLY NOT GATING: red-seat out-of-range fire
# fraction, ``weapon_fire_rejected`` with ``reason='target_out_of_range'``
# over (``weapon_fired`` + ``weapon_fire_rejected``), red seat only. Because
# this arm carries no spatial R1, there are no in-range flags in the prompt
# at all, so a HIGH fraction (~0.75-0.85, near the inherited, unverified
# pre-representation baseline 85/107 = 0.7944) is the mechanically EXPECTED
# reading regardless of which verdict the primary endpoint returns -- it
# proves nothing either way. Only a SURPRISING reading -- materially below
# R1-alone's own 238/502 = 0.4740 -- would be a notable finding. No verdict
# is derived from this endpoint.
#
# TERTIARY / REPORTED CONTEXT, NOT GATING: decided-match red win rate
# against P6's 17/30 = 0.5667 (Wilson 95% CI [0.3920, 0.7262]), reported
# with point estimate + Wilson CI + two-proportion z-test. Adjacent-arm
# z-tests at n=30 have essentially never reached significance in this
# program; no claim is made off a point-estimate shift on this axis.
#
# Ledger paths are isolated under a NEW state directory so this arm's
# battery does not collide with any other lane. No new loadout, weapon,
# deck, card, or pilot-spec file is created -- the dmg16 loadout (PR #191),
# the mortar_r30 loadout (PR #159/#170), and ``deck.movement.v2`` (PR #165)
# are all already provenance-pinned in
# ``tests/contracts/test_pilot_registry.py``.
#
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_composition_ca_only_dmg16_qwen.yaml \
#          --loadout-a contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml \
#          --loadout-b contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml --seed 5001
#
# and the O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file>
# --red-loadout contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml
# --blue-loadout contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml
# --state-root .onex_state/steel_onslaught/composition_ca_only_dmg16``
# (--expected-arena stays the driver default, foundry_60_asym_v1).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/composition_ca_only_dmg16/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/composition_ca_only_dmg16/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/composition_ca_only_dmg16/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/composition_ca_only_dmg16/lineage
  experiment_root: ../../.onex_state/steel_onslaught/composition_ca_only_dmg16/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/composition_ca_only_dmg16/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60_asym_v1
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v2
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
