# U-GATE + O-GATE combined battery overlay bound to qwen27 (cross-model B).
#
# This is the qwen27 twin of ``tactical_split_overdeal_utility_asym_v1_qwen.yaml``:
# a mechanical merge of that overlay's utility-surfacing arena/split-decks/rule-
# pack/cadence with the qwen27 provider deltas already proven in
# ``tactical_split_overdeal_v1_qwen27.yaml``.  It is the intersection of:
#   - the ASYM objective arena ``foundry_60_asym_v1`` (asymmetric cover corridors
#     + 3 objective cells + vp_threshold 15), so a match can end on VP as well as
#     elimination; AND
#   - the THIRD split-deck pile (each seat dealt an extra ``utility`` quota of
#     smoke/chaff/flares counterplay cards + the ``utility_handler_pack``);
#   - bound to the keyless local Qwen3.6-27B-MTP (llama.cpp, port 8001).
#
# The empirical question it lets the O-GATE battery answer for the SECOND model
# (design §5 P1, cross-model B): with utility counterplay in hand, does the red
# brawler survive the sniper's sightline lane long enough to contest VP on
# ``foundry_60_asym_v1`` when the pilot is qwen27 rather than qwen35?  Over-deal
# stays the mechanism: the deal grows to 10 (4 movement + 4 weapon + 2 utility)
# while the program stays 5, so utility competes for the SAME 5 registers as
# movement and attack.  No balance knob is touched (U-GATE requirement): the
# utility effect is expressed only through LOS/lock/targeting consults in the
# fold, never a damage/evasion/range number.
#
# qwen27 provider deltas (vs the qwen35 combined overlay) — the cross-model B2
# "differing ONLY in provider binding plus declared max_tokens/timeout deltas":
# * provider binding: llama.cpp endpoint on port 8001, model
#   Qwen3.6-27B-MTP-IQ4_XS.gguf, both seats (qwen27_berserker red /
#   qwen27_sniper blue), pilot registry ``../pilots/fire_dense_qwen27``.
# * ``max_tokens: 4096`` (vs 2048): llama.cpp routes chain-of-thought to
#   ``reasoning_content`` and only fills ``content`` after reasoning completes;
#   at 2048 the reasoning budget can starve the answer and return an
#   empty-but-"successful" completion.
# * ``timeout_seconds: 120`` (vs 45): reasoning tokens are generated before any
#   content appears, so a 45 s timeout would truncate legitimate completions.
#
# Every utility/arena surface (arena, decks, over-deal hand quotas, register
# count, cadence, rule pack, utility pile + handler pack, personas) is
# byte-identical to the qwen35 combined overlay so within-model contrasts stay
# comparable across models.  Neither existing overlay nor either arena contract
# is modified — ``foundry_60`` and ``foundry_60_asym_v1`` stay byte-frozen so
# historical replays remain valid.  Ledger paths are isolated under a NEW state
# directory so this combined qwen27 battery does not collide with any other lane.
#
# The ``secret_resolver`` is ``none`` (not ``injected``): the sole provider is
# the keyless local qwen27 endpoint (``secret_ref: null``), so this overlay
# launches directly from the CLI without a resolver capability:
#
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_v1_qwen27.yaml \
#          --loadout-a contracts_data/loadouts/qwen27/berserker_scout.yaml \
#          --loadout-b contracts_data/loadouts/qwen27/sniper_ironclad.yaml --seed 5001
#
# and the O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file> \
#      --red-loadout contracts_data/loadouts/qwen27/berserker_scout.yaml \
#      --blue-loadout contracts_data/loadouts/qwen27/sniper_ironclad.yaml``.
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_qwen27/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_qwen27/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_qwen27/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_qwen27/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_qwen27/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_qwen27/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen27
  arena_id: foundry_60_asym_v1
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen27_berserker
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen27_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  # Phase 2 — utility resolution handlers selected by this typed overlay
  # (design §6 Handlers row).  The full pack is named explicitly so the
  # runner's fail-closed ``select`` is driven by the overlay, not a hardcoded
  # default.  Narrowing this list (e.g. dropping ``utility.flares.v1``) would
  # make that kind fail closed at resolution time.
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen27
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8001/v1/chat/completions
      model: Qwen3.6-27B-MTP-IQ4_XS.gguf
      secret_ref: null
      timeout_seconds: 120.0
      max_tokens: 4096
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen27
      display_name: Qwen3.6-27B-MTP (AI PC 4090)
      provider_binding_id: qwen27
  personas_dir: ../pilots/personas
  secret_resolver:
    # Keyless: the only provider carries ``secret_ref: null``, so no resolver
    # capability is required.  ``none`` lets ``so run --overlay`` and the O-GATE
    # battery driver launch this overlay directly (``injected`` would raise
    # "requires a resolver capability" on the keyless CLI path).
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
