# U-GATE + O-GATE combined battery overlay bound to deepseek-v4-flash (cross-FAMILY B).
#
# This is the deepseek twin of ``tactical_split_overdeal_utility_asym_v1_qwen27.yaml``:
# a mechanical merge of that overlay's utility-surfacing arena/split-decks/rule-
# pack/cadence with deepseek provider deltas.  It is the intersection of:
#   - the ASYM objective arena ``foundry_60_asym_v1`` (asymmetric cover corridors
#     + 3 objective cells + vp_threshold 15), so a match can end on VP as well as
#     elimination; AND
#   - the THIRD split-deck pile (each seat dealt an extra ``utility`` quota of
#     smoke/chaff/flares counterplay cards + the ``utility_handler_pack``);
#   - bound to the keyless remote DeepSeek-V4-Flash (M2 Ultra, port 8101).
#
# The empirical question it lets the O-GATE battery answer for the CROSS-FAMILY
# arm (a different model family than the Qwen twins): with utility counterplay in
# hand, does the red brawler survive the sniper's sightline lane long enough to
# contest VP on ``foundry_60_asym_v1`` when the pilot is deepseek rather than a
# Qwen model?  Over-deal stays the mechanism: the deal grows to 10 (4 movement +
# 4 weapon + 2 utility) while the program stays 5, so utility competes for the
# SAME 5 registers as movement and attack.  No balance knob is touched (U-GATE
# requirement): the utility effect is expressed only through LOS/lock/targeting
# consults in the fold, never a damage/evasion/range number.
#
# deepseek provider deltas (vs the qwen27 combined overlay) — the cross-family B
# "differing ONLY in provider binding plus declared max_tokens/timeout deltas":
# * provider binding: OpenAI-compatible endpoint on the .200 host (M2 Ultra) at
#   port 8101, model ``deepseek-v4-flash``, both seats (deepseek_berserker red /
#   deepseek_sniper blue), pilot registry ``../pilots/fire_dense_deepseek``.
# * ``max_tokens: 4096``: a live CONFIG PROBE (2026-07-23) showed deepseek-v4-flash
#   spends ~1650-1680 completion tokens of reasoning before it emits the register
#   JSON.  Under ``response_format: {"type":"json_object"}`` (which the SO
#   programming path ALWAYS sends via ``json_mode=True``) that reasoning is kept
#   OUT of ``content`` and the completion returns CLEAN, strictly-parseable JSON
#   (2/2 probe trials, ``finish_reason=stop``, accepted by the strict whole-text
#   parse with no extraction).  At ``max_tokens: 1024`` the completion truncates
#   (``finish_reason=length``) before closing the JSON, so the budget must clear
#   the reasoning span.  4096 gives ~2.4x headroom over the observed ~1680; the
#   provider stops at ``finish_reason=stop`` well under the cap, so the larger cap
#   costs no extra latency (latency tracks tokens actually generated).
# * ``timeout_seconds: 240``: at the measured ~18.5 tok/s a ~1680-token
#   completion took 71-131 s in the probe; 240 s leaves margin for a harder round
#   that reasons longer without truncating a legitimate completion.
#
# NOTE on reasoning_effort: the SO LLM client wire contract
# (``ModelSOOpenAIChatRequest``) has NO ``reasoning_effort`` field, so it cannot
# be carried in this overlay.  The probe confirmed this is the SAFE default: with
# ``reasoning_effort`` OMITTED (server default) + json_object mode the model
# returns clean JSON, whereas an explicit ``reasoning_effort: "low"`` made the
# model narrate chain-of-thought INTO ``content`` and truncate (0/1 probe).  The
# winning behavior is therefore "never send reasoning_effort" — which the SO
# client does by construction — plus the max_tokens/timeout deltas above.
#
# Every utility/arena surface (arena, decks, over-deal hand quotas, register
# count, cadence, rule pack, utility pile + handler pack, personas) is
# byte-identical to the qwen27 combined overlay so within-model contrasts stay
# comparable across models.  Neither existing overlay nor either arena contract
# is modified — ``foundry_60`` and ``foundry_60_asym_v1`` stay byte-frozen so
# historical replays remain valid.  Ledger paths are isolated under a NEW state
# directory so this combined deepseek battery does not collide with any other lane.
#
# The ``secret_resolver`` is ``none`` (not ``injected``): the sole provider is
# the keyless deepseek endpoint (``secret_ref: null``), so this overlay launches
# directly from the CLI without a resolver capability:
#
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_v1_deepseek.yaml \
#          --loadout-a contracts_data/loadouts/deepseek/berserker_scout.yaml \
#          --loadout-b contracts_data/loadouts/deepseek/sniper_ironclad.yaml --seed 5001
#
# and the O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file> \
#      --red-loadout contracts_data/loadouts/deepseek/berserker_scout.yaml \
#      --blue-loadout contracts_data/loadouts/deepseek/sniper_ironclad.yaml``.
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_deepseek/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_deepseek/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_deepseek/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_deepseek/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_deepseek/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_deepseek/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_deepseek
  arena_id: foundry_60_asym_v1
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.deepseek_berserker
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.deepseek_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  # Phase 2 — utility resolution handlers selected by this typed overlay
  # (design §6 Handlers row).  The full pack is named explicitly so the
  # runner's fail-closed ``select`` is driven by the overlay, not a hardcoded
  # default.  Narrowing this list (e.g. dropping ``utility.flares.v1``) would
  # make that kind fail closed at resolution time.
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: deepseek
      endpoint_url: http://stickybeatz-studio.tail75df5e.ts.net:8101/v1/chat/completions
      model: deepseek-v4-flash
      secret_ref: null
      timeout_seconds: 600.0
      max_tokens: 16384
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.deepseek
      display_name: DeepSeek-V4-Flash (M2 Ultra)
      provider_binding_id: deepseek
  personas_dir: ../pilots/personas
  secret_resolver:
    # Keyless: the only provider carries ``secret_ref: null``, so no resolver
    # capability is required.  ``none`` lets ``so run --overlay`` and the O-GATE
    # battery driver launch this overlay directly (``injected`` would raise
    # "requires a resolver capability" on the keyless CLI path).
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
