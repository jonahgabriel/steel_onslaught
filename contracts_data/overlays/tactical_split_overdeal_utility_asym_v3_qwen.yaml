# Covered-advance battery overlay (session 2026-07-24, SO-SEEKCOVER). NEW,
# additive overlay -- the v2 overlay
# (``tactical_split_overdeal_utility_asym_v2_qwen.yaml``) is untouched.
#
# Forensics finding driving this arm: the movement-card vocabulary was
# relative-direction only (toward_enemy/away_from_enemy/left/right) -- no
# cell-targeted or LOS-aware primitive existed, so arena cover was unusable
# by construction (red pilot mentioned terrain in 0/209 plan rationales;
# well-placed cover moved nothing; 0/30 red wins on the v2 brawler recut,
# ``docs/evidence/2026-07-24-brawler-recut-v2-battery.md``).
#
# This overlay is the SAME U-GATE + O-GATE combined shape as the v2 overlay
# (arena ``foundry_60_asym_v2`` + the third split-deck utility pile,
# over-deal 10 / program 5, no balance knob touched), with exactly ONE
# additional rebinding on top:
#   - red's ``movement_deck_id`` moves from ``deck.movement.v1`` to the NEW
#     ``deck.movement.v2`` (``contracts_data/decks/movement_v2.yaml``),
#     which adds ``card.movement.covered_advance`` (NEW card,
#     ``contracts_data/cards/movement_covered_advance.yaml``) to red's
#     movement pool at 6/20 copies -- expected deal rate ~79.3% on a
#     4-card movement hand (see the deck file's own math comment).
#   - blue's ``movement_deck_id`` stays ``deck.movement.v1`` -- UNCHANGED.
#   - both loadouts stay exactly the v2 pairing: red =
#     ``loadout.llm.qwen35_berserker_v2``, blue =
#     ``loadout.llm.qwen35_sniper_ironclad`` -- neither loadout contract
#     carries card-pool information (that lives in this overlay's
#     ``card_catalog.deck_policy``), so no new loadout file is needed for
#     this arm; bound at launch exactly as v2 is bound, via
#     ``--loadout-a``/``--loadout-b`` or
#     ``--red-loadout``/``--blue-loadout``.
#
# The empirical question this arm answers: does giving the brawler a
# deterministic, LOS-aware movement primitive that automatically routes
# through the sniper's blind spots (instead of only relative-direction
# advance/flank/reposition) let red actually use the arena's cover corridors
# on approach, and does that move the needle off the v2 recut's 0/30?
#
# Neither the v2 overlay, the v2 arena, nor either v2 loadout contract is
# modified -- ``foundry_60_asym_v2``, ``llm_qwen35_berserker_v2.yaml``, and
# ``qwen35/sniper_ironclad.yaml`` all stay byte-frozen so historical replays
# remain valid. ``deck.movement.v1`` also stays byte-frozen (blue and every
# other overlay keep using it). Ledger paths are isolated under a NEW state
# directory so this arm's battery does not collide with any other lane.
#
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_v3_qwen.yaml \
#          --loadout-a contracts_data/loadouts/llm_qwen35_berserker_v2.yaml \
#          --loadout-b contracts_data/loadouts/qwen35/sniper_ironclad.yaml --seed 5001
#
# and the O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file>
# --expected-arena foundry_60_asym_v2 --red-loadout
# contracts_data/loadouts/llm_qwen35_berserker_v2.yaml
# --state-root .onex_state/steel_onslaught/covered_advance_battery`` (blue
# loadout stays the driver default,
# ``contracts_data/loadouts/qwen35/sniper_ironclad.yaml``).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v3_qwen/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v3_qwen/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v3_qwen/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v3_qwen/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v3_qwen/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v3_qwen/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60_asym_v2
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v2
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 -- utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 -- utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  # Phase 2 -- utility resolution handlers selected by this typed overlay
  # (design §6 Handlers row).  The full pack is named explicitly so the
  # runner's fail-closed ``select`` is driven by the overlay, not a hardcoded
  # default.  Narrowing this list (e.g. dropping ``utility.flares.v1``) would
  # make that kind fail closed at resolution time.
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    # Keyless: the only provider carries ``secret_ref: null``, so no resolver
    # capability is required.  ``none`` lets ``so run --overlay`` and the O-GATE
    # battery driver launch this overlay directly (``injected`` would raise
    # "requires a resolver capability" on the keyless CLI path).
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
