  evaluation_root: ../../.onex_state/steel_onslaught/composition_r1_only_dmg16/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/composition_r1_only_dmg16/lineage
  experiment_root: ../../.onex_state/steel_onslaught/composition_r1_only_dmg16/experiments
evaluation_storage:
