  path: ../../.onex_state/steel_onslaught/composition_r1_only_dmg16/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
