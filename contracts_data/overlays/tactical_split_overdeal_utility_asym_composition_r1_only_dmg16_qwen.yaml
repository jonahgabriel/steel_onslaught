# Decomposition arm SO-COMP-R1 (spatial R1 representation ALONE at red-dmg
# x16, session 2026-07-25). NEW, additive overlay -- the P6 dose-alone
# overlay, both composition overlays (x8 and x16), and every other
# pair-sweep / R1 / covered_advance overlay are all untouched.
#
# WHY THIS ARM (lever decomposition): the two composition arms
# (``..._composition_p4dmg8_covadv_r1_qwen.yaml`` and
# ``..._composition_p6dmg16_covadv_r1_qwen.yaml``) stack TWO levers at once
# -- red ``movement_deck_id`` v1 -> v2 (adds ``card.movement.covered_advance``)
# AND both seats' card programmers moved to the spatial R1 pilot specs. Two
# NEGATIVE signals replicated UNCHANGED across both composition arms:
# out-of-range fire fraction stayed near the pre-representation baseline
# (x8 417/565 = 0.7381, x16 436/570 = 0.7649, vs R1-alone's own 238/502 =
# 0.4740) and match length roughly doubled the dose-alone baseline (x16
# composition median 40.0 vs P6's 23.0). NOBODY HAS ISOLATED WHICH LEVER
# CAUSES THEM. This arm holds the dose fixed at x16 and applies ONLY the
# spatial R1 lever; the sibling arm SO-COMP-CA applies ONLY the
# covered_advance lever. Together the two arms attribute the negative
# signals to one lever, the other, or only their interaction.
#
# THE ONE CHANGE vs the P6 dose-alone overlay
# (``tactical_split_overdeal_utility_asym_pair_p6_dmg16_qwen.yaml``), which
# this file is otherwise a byte-copy of apart from the isolated ledger
# paths and this header:
#   - both seats' card-programmer ``pilot_spec_id`` move from
#     ``pilot.llm.qwen35`` / ``pilot.llm.qwen35_sniper`` to the EXISTING,
#     UNMODIFIED R1 pilot specs ``pilot.llm.qwen35_berserker_spatial_r1`` /
#     ``pilot.llm.qwen35_sniper_spatial_r1``
#     (``contracts_data/pilots/fire_dense_qwen/llm_qwen35_{berserker,sniper}
#     _spatial_r1.yaml``, PR #167) -- ASCII grid + resolver-backed
#     consequence previews + in-range flags, representation ONLY
#     (``spatial_representation: grid``, NOT R2's ``grid_scaffold``).
#     Symmetric on both seats, matching R1's own fairness design.
#
# EXPLICITLY UNCHANGED (each is the OTHER arm's lever or a held constant):
#   - BOTH seats' ``movement_deck_id`` stay ``deck.movement.v1``. Red is NOT
#     rebound to ``deck.movement.v2`` -- ``card.movement.covered_advance``
#     is absent from this arm entirely. That is SO-COMP-CA's lever.
#   - arena ``foundry_60_asym_v1`` -- UNCHANGED.
#   - red loadout ``loadout.llm.qwen35_berserker_dmg16`` -- UNCHANGED, the
#     P6 lethality dose (machine_gun 8->128, shrapnel_thrower 12->192).
#     Bound via ``--red-loadout`` at launch, not referenced in this file.
#   - blue loadout ``loadout.llm.qwen35_sniper_ironclad_mortar_r30`` --
#     UNCHANGED, held constant across P1-P7 and both composition arms.
#     Bound via ``--blue-loadout`` at launch, not referenced in this file.
#   - U-GATE + O-GATE shape (asym objective arena + third split-deck utility
#     pile, over-deal 10 / program 5) -- UNCHANGED, no balance knob touched.
#
# PRE-REGISTERED COMPARISON TARGETS (written BEFORE this battery ran; the
# overlay commit precedes the first ``match_started`` event and the gap is
# reported in the evidence doc):
#   - FLOOR: P6, x16 dose alone, same arena + same blue loadout --
#     out-of-range fire fraction NOT measured for P6 (no figure exists);
#     median match length 23.0 ticks; decided red win rate 17/30 = 0.5667.
#   - CEILING: the two stacked composition arms -- pooled out-of-range
#     fraction mean (0.7381 + 0.7649) / 2 = 0.7515; x16 composition median
#     match length 40.0 ticks.
#   - LOW ANCHOR for out-of-range: R1-alone on the v2 arena, zero dose,
#     238/502 = 0.4740 (CROSS-ARENA -- flagged as such wherever compared).
#
# ONE FORMAL, ARITHMETIC-VERIFIED CRITERION (no accompanying illustrative
# band -- the two thresholds below are the whole criterion). Because THIS
# arm carries R1's in-range flags, out-of-range fire is directly
# informative here, so it is a PRIMARY endpoint alongside match length:
#
#   Threshold A (out-of-range fire fraction, red seat):
#     0.60. Derivation: arithmetic midpoint between R1-alone's own
#     suppression result (0.4740) and the composition arms' pooled ceiling
#     (0.7515) is (0.4740 + 0.7515) / 2 = 0.61275, rounded DOWN
#     conservatively to 0.60 (a lower bar makes ISOLATED-CAUSE easier to
#     reach, i.e. it does not flatter the "not the cause" reading).
#   Threshold B (median match length, valid matches):
#     31.5 ticks. Derivation: arithmetic midpoint between the P6 dose-alone
#     floor (23.0) and the x16 composition ceiling (40.0) is
#     (23.0 + 40.0) / 2 = 31.5 exactly.
#
#   - ISOLATED-CAUSE (R1 alone reproduces the composition's negative
#     signals): BOTH endpoints cross -- out-of-range fraction >= 0.60 AND
#     median match length >= 31.5 ticks.
#   - NOT-THE-CAUSE (R1 alone is not sufficient; covered_advance or the
#     two-lever interaction is implicated instead): NEITHER endpoint
#     crosses -- out-of-range fraction < 0.60 AND median match length
#     < 31.5 ticks.
#   - PARTIAL ATTRIBUTION (mixed / indeterminate): exactly one endpoint
#     crosses. This is a fully legitimate terminal outcome and is NOT to be
#     forced into a binary call.
#
#   SECONDARY (reported, never used to decide the criterion above): decided
#   red win rate vs P6's 17/30 = 0.5667, with Wilson 95% CI and a
#   two-proportion z-test. Adjacent-arm z-tests at n=30 have essentially
#   never reached significance in this program -- a point estimate is not
#   to be over-read.
#
# Neither the P6 overlay, the P1-P7 overlays, either composition overlay,
# the arena contract, the dmg16 loadout/weapons, the mortar_r30 loadout,
# ``deck.movement.v1``, ``deck.movement.v2``, nor either spatial R1 pilot
# spec is modified -- every one of those files stays byte-frozen so
# historical replays remain valid. This arm adds exactly ONE new file (this
# overlay); no test-file edit is needed (the dmg16 loadout is pinned in
# ``tests/contracts/test_pilot_registry.py`` under PR #191, mortar_r30
# under PR #159/#170, both R1 pilot specs under PR #167). Ledger paths are
# isolated under a NEW state directory so this arm's battery does not
# collide with any other lane.
#
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_composition_r1_only_dmg16_qwen.yaml \
#          --loadout-a contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml \
#          --loadout-b contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml --seed 5001
#
# and the O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file>
# --red-loadout contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml
# --blue-loadout contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml
# --state-root .onex_state/steel_onslaught/composition_r1_only_dmg16``
# (--expected-arena stays the driver default, foundry_60_asym_v1).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/composition_r1_only_dmg16/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
