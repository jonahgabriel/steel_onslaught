# U-GATE utility battery on the SYMMETRIC arena — the scenario-axis control
# (design 2026-07-22 §5; scenario variation evidence 2026-07-23).
#
# This overlay is the symmetric-arena twin of
# ``tactical_split_overdeal_utility_asym_v1_qwen.yaml``.  It holds EVERYTHING the
# match runtime consumes identical to that overlay — provider + retry block,
# split-deck over-deal policy, utility handler pack — and swaps exactly one free
# variable, the arena binding:
#   - THIS file binds ``foundry_60`` (symmetric, NO objective cells, no
#     ``vp_threshold``), so every match ends by elimination; whereas
#   - the asym overlay binds ``foundry_60_asym_v1`` (asymmetric cover corridors +
#     3 objective cells + vp_threshold 15), where a match can also end on VP.
# It keeps the THIRD split-deck pile of ``tactical_split_overdeal_utility_v1_qwen.yaml``
# (each seat dealt an extra ``utility`` quota of smoke/chaff/flares counterplay
# cards + the ``utility_handler_pack``).
#
# The empirical question it answers (design §5; measured in
# ``docs/evidence/2026-07-23-scenario-variation-qwen35-symmetric.md``): is the
# sub-chance utility deprioritization established on the ASYM arena
# scenario-robust, or is it an artifact of that arena's objectives and geometry?
# Because the arena is the only difference, any change in the utility keep-rate
# is attributable to the arena axis and nothing else.  Over-deal stays the
# mechanism: the deal grows to 10 (4 movement + 4 weapon + 2 utility) while the
# program stays 5, so utility competes for the SAME 5 registers as movement and
# attack.  No balance knob is touched (U-GATE requirement): the utility effect is
# expressed only through LOS/lock/targeting consults in the fold, never a
# damage/evasion/range number.
#
# Neither existing overlay nor either arena contract is modified — ``foundry_60``
# and ``foundry_60_asym_v1`` stay byte-frozen so historical replays remain valid.
# Ledger paths are isolated under this overlay's OWN state lane,
# ``.onex_state/steel_onslaught/tactical_split_overdeal_utility_sym_v1_qwen/``,
# which no other overlay declares — so a ``so run`` of this file cannot write the
# asym-only or utility-only lanes.  That property is asserted for the whole
# overlay corpus by ``tests/contracts/test_overlay_state_lane_identity.py``, not
# merely claimed here.  (OMN-15601: these seven state leaves previously named the
# ``..._asym_v1_qwen`` lane verbatim, and this header previously described the
# asym arena and named a different file in the example command below.  The lane
# was never materialized and the 30-match battery ran under a driver-supplied
# ``--state-root``, so no recorded evidence was contaminated and none was
# migrated by the fix; the new lane starts empty.)
#
# The ``secret_resolver`` is ``none`` (not ``injected``): the sole provider is the
# keyless local Qwen endpoint (``secret_ref: null``), so this overlay launches
# directly from the CLI without a resolver capability:
#
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_sym_v1_qwen.yaml \
#          --loadout-a contracts_data/loadouts/llm_qwen35_berserker.yaml \
#          --loadout-b contracts_data/loadouts/qwen35/sniper_ironclad.yaml --seed 5001
#
# and the O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file>
# --expected-arena foundry_60`` — the ``--expected-arena`` flag is REQUIRED here
# because that driver defaults to ``foundry_60_asym_v1`` and asserts the arena on
# every MATCH_STARTED, so omitting it fails the battery closed rather than
# silently running the wrong arena.  Battery runs also pass their own
# ``--state-root``, which overrides the ledger paths above.
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_sym_v1_qwen/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_sym_v1_qwen/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_sym_v1_qwen/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_sym_v1_qwen/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_sym_v1_qwen/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_sym_v1_qwen/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  # Phase 2 — utility resolution handlers selected by this typed overlay
  # (design §6 Handlers row).  The full pack is named explicitly so the
  # runner's fail-closed ``select`` is driven by the overlay, not a hardcoded
  # default.  Narrowing this list (e.g. dropping ``utility.flares.v1``) would
  # make that kind fail closed at resolution time.
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    # Keyless: the only provider carries ``secret_ref: null``, so no resolver
    # capability is required.  ``none`` lets ``so run --overlay`` and the O-GATE
    # battery driver launch this overlay directly (``injected`` would raise
    # "requires a resolver capability" on the keyless CLI path).
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
