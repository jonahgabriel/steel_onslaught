schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_v1_gemini/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_v1_gemini/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tactical_v1_gemini/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tactical_v1_gemini/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tactical_v1_gemini/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/tactical_v1_gemini/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/tactical_gemini
  arena_id: foundry
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_id: deck.tactical.v1
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.gemini.sniper
        failure_policy: fallback
      - side: blue
        pilot_spec_id: pilot.gemini.opportunist
        failure_policy: fallback
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
llm:
  providers:
    - kind: openai_compatible
      provider_id: gemini
      endpoint_url: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      model: gemini-2.5-flash
      secret_ref:
        kind: opaque
        ref: secret://llm/gemini
      timeout_seconds: 90.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.gemini
      display_name: Gemini 2.5 Flash
      provider_binding_id: gemini
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: injected
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
