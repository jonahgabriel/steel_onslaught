# Pair-sweep arm P7 (mortar_r30 x red-dmg-x24, session 2026-07-25) battery
# overlay. NEW, additive overlay -- the v1 combined overlay, the standalone
# arm-1 overlay, and the P1/P2/P3/P4/P5/P6 arm overlays are all untouched.
#
# This overlay is the SAME U-GATE + O-GATE combined shape as the v1 overlay
# (design 2026-07-22 §5: asym objective arena + the third split-deck utility
# pile, over-deal 10 / program 5, no balance knob touched here in the
# overlay itself). This arm PAIRS two levers, exactly two, no more -- and is
# byte-identical to the P6 overlay except for the red loadout id, the
# dose-curve comment block, and the isolated ledger paths, so the ONLY
# experimental delta against P6 is the lethality dose (x16 -> x24):
#   - arena: ``foundry_60_asym_v1`` -- UNCHANGED, otherwise-stock (this arm
#     does not touch the arena).
#   - blue loadout: ``loadout.llm.qwen35_sniper_ironclad_mortar_r30``
#     (``contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml``) --
#     the shared approach-fix lever, HELD CONSTANT across
#     P1/P2/P3/P4/P5/P6/P7: swaps ONLY ``weapon.siege.artillery_mortar`` ->
#     ``weapon.siege.artillery_mortar_r30`` (range 50 -> 30, every other
#     weapon field identical). Bound via ``--blue-loadout`` at launch, not
#     referenced inside this overlay file.
#   - red loadout: ``loadout.llm.qwen35_berserker_dmg24``
#     (``contracts_data/loadouts/llm_qwen35_berserker_dmg24.yaml``) -- the
#     lethality-dose lever: swaps both of the berserker's weapons for
#     damage-x24 variants (machine_gun 8->192, shrapnel_thrower 12->288),
#     every other weapon field identical. Bound via ``--red-loadout`` at
#     launch, not referenced inside this overlay file.
#
# Dose-curve position and PRE-REGISTERED, FALSIFIABLE prediction (written
# BEFORE this battery ran): the P6 doc
# (docs/evidence/2026-07-24-pair_p6_dmg16-battery.md) found x16 scored
# 17/30 = 56.7%, decided-match, with a marginal rate of only 2.67pp/unit
# (down sharply from x11's 5.25pp/unit -- deceleration, not continued
# acceleration) and match length essentially flat against x11 (median 23.0
# both arms). P6 vs P5 was NOT statistically significant (z=1.03, p=0.302).
# P6's own hits-to-kill data showed red's kill speed (mean 2.18 hits) had
# already overtaken blue's (mean 2.62 hits) at x16, yet win rate only rose
# 13.3pp -- consistent with an unidentified capping mechanism beyond raw
# hit-count parity (approach/exposure time or blue's range advantage,
# per P6 §"the deeper cause as an open question"). This arm (x24, +8
# dose-units over x16) is built to further discriminate two competing
# readings of that plateau:
#
#   H1 (ceiling continues to erode toward re-acceleration or the
#   deceleration trend itself was noise): win rate re-accelerates past
#   the 2.67pp/unit rate observed at x16, or match length starts dropping
#   again after the x11->x16 plateau. Either signal would mean the
#   "residual capping mechanism" P6 flagged as unexplained is NOT the
#   whole story -- raw lethality still has room to buy wins.
#
#   H2 (kill-speed-parity ceiling, confirmed and holding): win rate
#   continues to decelerate at or below the 2.67pp/unit marginal rate set
#   at x16 (i.e. lands at roughly 56.7-63% or lower), AND match length
#   stays flat (~23 ticks) rather than dropping. This would further
#   support the ceiling hypothesis and argue the residual, unexplained
#   capping mechanism (not raw damage) is the binding constraint on win
#   rate at this point in the curve.
#
# x24 is chosen as the next dose step past x16 (continuing the escalating
# x1/x3/x5.5/x8/x11/x16/x24 spacing already used in this program) -- it is
# NOT a scan; this single point is pre-declared and held. This arm does
# NOT pre-favor either hypothesis -- report whichever is better supported,
# or report that n=30 cannot distinguish them (a fully acceptable answer).
#
# Neither the v1 overlay, the arm-1 overlay, the P1/P2/P3/P4/P5/P6
# overlays, the arena contract, nor any baseline loadout is modified --
# ``foundry_60_asym_v1``, ``llm_qwen35_berserker.yaml``,
# ``qwen35/sniper_ironclad.yaml``, and ``qwen35/sniper_ironclad_mortar_r30
# .yaml`` all stay byte-frozen so historical replays remain valid. Ledger
# paths are isolated under a NEW state directory so this arm's battery does
# not collide with any other lane.
#
# Pre-declared method (matched to P5/P6): n=30, seed-base 5000 (seeds
# 5001-5030, identical seed-base to every prior pair-sweep arm in this
# family), model pin qwen35 (Qwen3.6-35B-A3B, same provider block as
# P1-P6, unchanged below), --fresh on first launch only.
#
# The O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file>
# --red-loadout contracts_data/loadouts/llm_qwen35_berserker_dmg24.yaml
# --blue-loadout contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml
# --n 30 --seed-base 5000 --fresh
# --state-root .onex_state/steel_onslaught/pair_p7_dmg24``
# (--expected-arena stays the driver default, foundry_60_asym_v1).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/pair_p7_dmg24/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/pair_p7_dmg24/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/pair_p7_dmg24/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/pair_p7_dmg24/lineage
  experiment_root: ../../.onex_state/steel_onslaught/pair_p7_dmg24/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/pair_p7_dmg24/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60_asym_v1
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
