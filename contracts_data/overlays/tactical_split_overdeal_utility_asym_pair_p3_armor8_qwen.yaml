# Pair-sweep arm P3 (mortar_r30 x blue-armor-8, session 2026-07-24) battery
# overlay. NEW, additive overlay -- the v1 combined overlay
# (``tactical_split_overdeal_utility_asym_v1_qwen.yaml``) and the standalone
# arm-1 overlay (``tactical_split_overdeal_utility_asym_v1_qwen_mortar_r30.yaml``)
# are both untouched.
#
# This overlay is the SAME U-GATE + O-GATE combined shape as the v1 overlay
# (design 2026-07-22 §5: asym objective arena + the third split-deck utility
# pile, over-deal 10 / program 5, no balance knob touched here in the
# overlay itself). This arm PAIRS two levers, exactly two, no more:
#   - arena: ``foundry_60_asym_v1`` -- UNCHANGED, otherwise-stock (this arm
#     does not touch the arena).
#   - blue loadout: ``loadout.llm.qwen35_sniper_ironclad_mortar_r30_armor8``
#     (``contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30_armor8.yaml``)
#     -- BOTH levers live on the blue seat here: the shared mortar-range
#     lever (``weapon.siege.artillery_mortar`` -> ``...mortar_r30``, range
#     50 -> 30) PLUS the lethality-dose lever (chassis
#     ``chassis.heavy.ironclad_mk1`` -> ``...ironclad_mk1_armor8``,
#     base_armor 16 -> 8), every other loadout/chassis field identical.
#     CORRECTION (OMN-15119): the mortar-range half of this pair is a
#     partial approach fix only -- ``harpoon_gun`` stays at range 30,
#     uncapped, through P1-P7. Blue's engagement envelope was never closed.
#     Bound via ``--blue-loadout`` at launch, not referenced inside this
#     overlay file.
#   - red loadout: ``loadout.llm.qwen35_berserker``
#     (``contracts_data/loadouts/llm_qwen35_berserker.yaml``) -- fully
#     STOCK, zero red-side buffs. Bound via ``--red-loadout`` at launch
#     (the driver default already resolves to this file).
#
# Neither the v1 overlay, the arm-1 overlay, the arena contract, nor any
# baseline loadout/chassis is modified -- ``foundry_60_asym_v1``,
# ``llm_qwen35_berserker.yaml``, ``qwen35/sniper_ironclad.yaml``,
# ``qwen35/sniper_ironclad_mortar_r30.yaml``, and
# ``chassis/heavy_ironclad_mk1.yaml`` all stay byte-frozen so historical
# replays remain valid. Ledger paths are isolated under a NEW state
# directory so this arm's battery does not collide with any other lane.
#
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_pair_p3_armor8_qwen.yaml \
#          --loadout-a contracts_data/loadouts/llm_qwen35_berserker.yaml \
#          --loadout-b contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30_armor8.yaml --seed 5001
#
# and the O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file>
# --blue-loadout contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30_armor8.yaml
# --state-root .onex_state/steel_onslaught/pair_p3_armor8``
# (--red-loadout and --expected-arena stay the driver defaults --
# ``llm_qwen35_berserker.yaml`` and ``foundry_60_asym_v1``).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/pair_p3_armor8/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/pair_p3_armor8/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/pair_p3_armor8/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/pair_p3_armor8/lineage
  experiment_root: ../../.onex_state/steel_onslaught/pair_p3_armor8/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/pair_p3_armor8/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60_asym_v1
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
