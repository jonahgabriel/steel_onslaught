  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  # A DEDICATED registry directory, for the reason the red overlay's own
  # header records empirically: _validate_llm_pilot_bindings validates EVERY
  # spec in a registry directory unconditionally, so a spec declaring a
  # provider that a SIBLING overlay does not declare breaks that sibling at
  # composition. This directory holds only leg (a)'s two sniper specs.
  pilot_registry_dir: ../pilots/tactical_split_overdeal_v1_delegation_learning_blue
  # Held byte-constant with the red overlay (prereg §2.1: arena is not a delta).
  arena_id: foundry_60
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        # FD2: archetype flips berserker -> sniper on BOTH seats, preserving
        # the mirror. hand_quota / register_count / deck ids are held
        # BYTE-IDENTICAL to the red overlay's (a balanced 4/4 over-deal,
        # register_count 5, deck.movement.v1 / deck.weapon.v1 on both sides),
        # so FD2 changes the persona and the chassis, NOT the card partition
        # or the size of the decision space -- prereg §2.2 FD2.
        - side: red
          # The MIRROR opponent on leg (a). The declared archetype label must
          # equal the resolved card-programmer persona
          # (validate_seat_programmer_identity's deck_policy check).
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          hand_quota:
            movement: 4
            weapon: 4
          register_count: 5
        - side: blue
          # THE LEARNING SEAT on leg (a) (prereg §2.1 FD1: --seat blue).
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          hand_quota:
            movement: 4
            weapon: 4
          register_count: 5
    # LOAD-BEARING, PRE-REGISTERED (prereg §2.1, §2.3, §9.3). The OMN-15591
    # disposition for leg (a) is cadence-CONDITIONAL: every CARDS_DISCARDED
    # terminal-close call site in src/steel_onslaught/match/runner.py is gated
    # on card_cadence == "paced", and the defect lives on the atomic path.
    # A leg (a) run on atomic cadence is NOT authorized by this
    # pre-registration and voids §9 entirely.
    card_cadence: paced
    programmers:
      - side: red
        # pilot.llm.qwen35_sniper_mirror_red is a distinct-provider-id,
        # identical-persona sibling of the learning seat's spec -- an
        # ANNOUNCED mirror. validate_seat_programmer_identity unconditionally
        # rejects two live card seats resolving to the same
        # (provider, persona) identity, so a literal reuse of
        # pilot.llm.qwen35_sniper on both sides raises SeatIdentityError.
        # The red battery hit exactly this and solved it the same way;
        # prereg §2.3 item 2 pre-records the trap and the solution.
        pilot_spec_id: pilot.llm.qwen35_sniper_mirror_red
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
llm:
  providers:
    - kind: onex_delegation
      # The LEARNING seat's provider on leg (a) (player.blue). Held
      # byte-constant with the red overlay's learning-seat provider on every
      # dispatched field -- prereg §2.1 declares the provider binding and the
      # served model NOT a delta.
      provider_id: qwen35
      backend_id: local-coder-mlx
      task_type: agent_delegation
      source: external-client
      model: mlx-community/Qwen3.6-35B-A3B-8bit
      max_tokens: 2048
      timeout_seconds: 180.0
      omnibase_infra_path: ../omnibase_infra
      state_root: .onex_state/steel_onslaught/tactical_split_overdeal_v1_delegation_learning_blue/delegation_state/qwen35
    - kind: onex_delegation
      # Announced mirror of the provider above: identical backend_id / model /
      # task_type / timeout_seconds (the SAME served model on the same
      # endpoint), a DIFFERENT provider_id label only -- required so the red
      # mirror seat resolves a distinct (provider, persona) identity from
      # blue's.
      provider_id: qwen35_sniper_mirror_red
      backend_id: local-coder-mlx
      task_type: agent_delegation
      source: external-client
      model: mlx-community/Qwen3.6-35B-A3B-8bit
      max_tokens: 2048
      timeout_seconds: 180.0
      omnibase_infra_path: ../omnibase_infra
      state_root: .onex_state/steel_onslaught/tactical_split_overdeal_v1_delegation_learning_blue/delegation_state/qwen35_sniper_mirror_red
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35_delegation_learning_blue
      display_name: "Qwen3.6-35B-A3B-8bit (stickybeatz-studio MLX, blue/learning seat)"
      provider_binding_id: qwen35
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35_sniper_mirror_red
      display_name: "Qwen3.6-35B-A3B-8bit (stickybeatz-studio MLX, red mirror seat)"
      provider_binding_id: qwen35_sniper_mirror_red
  personas_dir: ../pilots/personas
  secret_resolver:
    # kind: injected, NOT kind: none. The driver this overlay runs under
    # (scripts/run_lgate2_adaptation_battery.py's _measure_match)
    # unconditionally passes secret_resolver=NoSecretResolver() into
    # assemble_match_live, and `kind: none` unconditionally REJECTS an
    # injected resolver -- the red battery's first canary attempt died at
    # composition on exactly that, before any LLM call was made.
    kind: injected
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
