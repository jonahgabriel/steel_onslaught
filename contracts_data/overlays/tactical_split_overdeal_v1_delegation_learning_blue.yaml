# ## 7. Pre-declared interpretation map
#
# ### 7.1 Within leg (a) — scored bands → reading
#
# | primary | vent | reading at this cell |
# |---|---|---|
# | SUPPORTED | any | dose-responsiveness at regime contrast **on the blue/sniper seat**; the L-GATE-2 behavioral half PASSES at this operating point; step-size sensitivity becomes the follow-up. |
# | NOT-SUPPORTED | CONFIRMED | the guidance block IS causally consumed but the declared **semantics** are the defect (#128 revisit item (a): wording), not the learning chain; the paradoxical channel is proven **on the seat where it was twice observed**. |
# | NOT-SUPPORTED | NOT-CONFIRMED | H_POLICY_INERT holds at the mechanism's most favorable operating point **on this seat too**. Combined with the red leg this is a **symmetric null** — see §7.2, and note that ruling 25 makes it publishable and non-terminal. |
# | any | DIRECTIONAL-ONLY | reported as **unresolved**; no terminal/non-terminal call is made from an unresolved band. |
# | DIRECTIONAL-ONLY | any | same — unresolved. |
#
# ### 7.2 Across the matrix — what leg (a) adds, cell by cell
#
# - **Leg (a) NOT-SUPPORTED + red leg NOT-SUPPORTED** → the primary is null on **both** seats at the
#   endpoint contrast. This is the symmetric null ruling 25 names as publishable in its own right. It is
#   the strongest available evidence for H_POLICY_INERT and it is a **real result, not a failed run.**
# - **Leg (a) SUPPORTED + red leg NOT-SUPPORTED** → dose-responsiveness is **persona-specific**: the
#   mechanism works on the sniper and not the berserker. §5.1's confound resolves in favor of
#   seat/persona, not step size, and the "bigger step didn't help" reading of the red leg is retired.
# - **Leg (a) vent CONFIRMED + red leg vent DIRECTIONAL-ONLY** → the paradoxical channel is real and
#   **sniper/blue-specific** rather than a general aggression-guidance effect. This is live reading (b) of
#   the red scoring document's §5.1 and it becomes the favored one.
# - **Leg (a) vent NOT-CONFIRMED** → the twice-replicated signal fails its first same-seat pre-registered
#   test at the largest available contrast. #126/#128's replication would then be best read as
#   step-size-specific or as an artifact of the HTTP binding, and the post-hoc Fisher `p ≈ 0.003` that
#   motivated promoting vent to a pre-registered endpoint would be substantially undercut.
#
# ### 7.3 What leg (a) **cannot** conclude — read this before quoting any result
#
# 1. **Leg (a) is NOT terminal for the prompt-guidance mechanism, whatever it finds.** Ruling 25 is
#    explicit: leg (b) (the non-prompt consumer probe) runs **regardless of (a)'s result**, and neither
#    leg is treated as terminal until both report. **A null on leg (a) does not license the TERMINAL
#    call**, and a positive on leg (a) does not cancel leg (b). This supersedes, for the series, the red
#    overlay's own standalone clause that a third null would be "pre-declared TERMINAL for the
#    mechanism."
# 2. **It is not a clean step-size test against #126/#128.** That comparison additionally crosses genesis
#    (1.0 → 0.5) and binding (HTTP `OpenAICompatibleClient` → `onex_delegation`/MLX). Absolute levels are
#    not comparable across bindings at all (`LlmBusDelegationClient` does not forward `temperature`,
#    collapses the system/user split into one flat prompt, and encodes `json_mode` as prompt text). Only
#    within-battery contrasts are scored, and the cross-battery statement leg (a) licenses is a
#    **direction** claim, not a magnitude claim.
# 3. **The clean contrast it does license is persona, against OMN-15488** — same genesis, step, binding,
#    overlay shape, pairing structure, phase/seed/cap structure, driver, and instruments.
# 4. **Win rate says nothing about the hypothesis.** The mirror pairing makes it uninformative by
#    construction.
# 5. **No claim generalizes** beyond `local-coder-mlx` / Qwen3.6-35B-A3B-8bit, this arena/loadout pairing,
#    this seed set, this binding, card mode only, one model, one endpoint process.
# 6. **Phases are sequential, not interleaved**, on one MLX endpoint process. Endpoint-side drift between
#    the baseline and post windows (restart, KV-cache/batching state, thermal/load) could shift both
#    phases' absolute levels invisibly. Leg (a) has no interleaved-phase control and none is proposed.
# ===== END VERBATIM EMBED: prereg §2-§7 =====
#
# AMENDMENT 1 (2026-07-31, landed with this file, BEFORE any match of this
# battery exists). Numbered and appended per prereg §12 clause 2. It does NOT
# edit the embed above, which is why the embed is still byte-verbatim and the
# drift test still passes.
#
# TITLE: §7.1 INTERPRETATION-MAP ROW PRECEDENCE -- restoring a disambiguation
# clause the red pre-registration carried and the §7.1 table dropped.
#
# THE DEFECT. §7.1 above is a five-row table whose rows OVERLAP, and the table
# states no rule for which row governs when two match. Concretely, a run with
# primary SUPPORTED and vent DIRECTIONAL-ONLY matches BOTH row 1
# (`SUPPORTED | any`) and row 4 (`any | DIRECTIONAL-ONLY`), and those two rows
# give opposite readings: row 1 says the L-GATE-2 behavioral half PASSES at
# this operating point, row 4 says the result is unresolved and that no
# terminal/non-terminal call may be made from it. Left as written, the scoring
# session picks one after seeing the data. That is exactly the discretion a
# pre-registration exists to remove, and it is the one criterion-region defect
# the wave-2 verifier found in this document.
#
# WHY IT IS A RESTORATION, NOT A NEW RULE. The red battery's pre-registration
# (contracts_data/overlays/tactical_split_overdeal_v1_delegation_learning.yaml,
# quoted verbatim in docs/evidence/2026-07-31-lgate2-decisive-battery-scoring.md
# §"PRE-DECLARED INTERPRETATION MAP") did not have this ambiguity, because it
# was not written as a table. It was written as THREE NAMED ROWS followed by a
# CLOSING clause:
#
#   `DIRECTIONAL-ONLY outcomes -> reported as unresolved; the terminal/
#    non-terminal call is NOT made from an unresolved band.`
#
# and the red scoring document applied precisely that structure to score its
# own NOT-SUPPORTED / DIRECTIONAL-ONLY result: "none of the three named rows
# apply and the closing clause governs." Named rows first; the DIRECTIONAL-ONLY
# clause as the residual. Reformatting that into a flat table for leg (a)
# silently discarded the ordering that made it decidable.
#
# THE CLAUSE, RESTORED. Read §7.1's rows IN TABLE ORDER; the FIRST row whose
# bands both match the scored result governs, and no later row is consulted.
# Rows 4 and 5 are therefore residual clauses, exactly as the red
# pre-registration's closing clause was.
#
# PROOF THAT THIS IS THE RED PRE-REGISTRATION'S SEMANTICS AND NOT A NEW CHOICE
# -- all nine cells of {primary} x {vent}, resolved under the restored clause,
# each matching what the red structure yields:
#
#   primary SUPPORTED        + vent CONFIRMED        -> row 1  (behavioral half PASSES)
#   primary SUPPORTED        + vent DIRECTIONAL-ONLY -> row 1  (behavioral half PASSES)
#   primary SUPPORTED        + vent NOT-CONFIRMED    -> row 1  (behavioral half PASSES)
#   primary NOT-SUPPORTED    + vent CONFIRMED        -> row 2  (semantics are the defect)
#   primary NOT-SUPPORTED    + vent NOT-CONFIRMED    -> row 3  (H_POLICY_INERT; symmetric null)
#   primary NOT-SUPPORTED    + vent DIRECTIONAL-ONLY -> row 4  (unresolved)
#   primary DIRECTIONAL-ONLY + vent CONFIRMED        -> row 5  (unresolved)
#   primary DIRECTIONAL-ONLY + vent DIRECTIONAL-ONLY -> row 4  (unresolved)
#   primary DIRECTIONAL-ONLY + vent NOT-CONFIRMED    -> row 5  (unresolved)
#
# Row 1 covering all three vent bands is not an accident of ordering: it is
# what `SUPPORTED | any` already says in the table, and it matches the red
# pre-registration's own first row, "primary SUPPORTED (any vent outcome)".
# The red leg's actual scored cell (NOT-SUPPORTED / DIRECTIONAL-ONLY) resolves
# to row 4 = unresolved here, which is verbatim the call its scoring document
# made. The restored clause changes no band, no endpoint, no direction, no
# alpha, no escape, and no reading of any cell; it only removes the discretion
# to pick between two rows after seeing which one is more convenient.
#
# ALSO RECORDED IN THE DOCUMENT. The same amendment is appended to
# docs/evidence/2026-07-31-lgate2-legA-blue-seat-endpoint-contrast-prereg.md as
# its §7.1 amendment, so the two surfaces agree rather than differing by a
# clause -- §12 makes a header/document disagreement a reportable defect, and
# a scorer reading only the document would otherwise still face the ambiguous
# table.
#
# AMENDMENT 2 (2026-07-31, landed with this file, BEFORE any match exists).
# Numbered and appended per prereg §12 clause 2. Execution-infrastructure
# only: no hypothesis, endpoint, band, escape, or interpretation-map row is
# touched.
#
# TITLE: the executing command, completed -- the two driver capabilities
# §2.5/§3 pre-register but the driver did not have.
#
# 1. SEED BLOCKS 6xxx WERE UNREACHABLE. §2.1 FD3 and §3 pre-register seeds
#    6001-6030 / 6101-6115 / 6201-6230, and AC2 asserts them exactly. Before
#    this file, scripts/run_lgate2_adaptation_battery.py wrote the base as the
#    literal 4000 three times inline (`4000 + index` / `4100 + index` /
#    `4200 + index`) with no flag to move it, so the pre-registered seed lane
#    could not be flown at all and every battery on this driver shared one
#    lane. The driver now takes `--seed-base` (default 4000, byte-identical to
#    every prior invocation); leg (a) passes `--seed-base 6000`, which yields
#    exactly the three pre-registered blocks. The executed base is published
#    into battery_summary.json as `seed_base` so it is falsifiable from the
#    artifact rather than inferred from the seeds that happen to appear.
#
# 2. `--expected-rows 61` WOULD HAVE BEEN WRONG FOR ALMOST EVERY CLEAN RUN.
#    §10.1 pins `--expected-rows 61`, copied from the red battery, which
#    promoted on its FIRST promote attempt (30 + 1 + 30 = 61). The promote
#    phase stops at the first promotion, so a clean leg-(a) run writes
#    30 + k + 30 rows for an unknown k in 1..15 -- 61 through 75 -- and the
#    watchdog compared with a strict `!=` (`rows != self.expected_rows`,
#    src/steel_onslaught/battery/watchdog.py). A k>1 run, which is 14 of the
#    15 possible clean outcomes, would therefore have been reported
#    INCOMPLETE and would have had its --on-complete-exec chain withheld
#    while being a perfectly clean battery. `so battery-watch` now takes
#    `--expected-rows-max`, making the contract an inclusive range; leg (a)
#    launches with `--expected-rows 61 --expected-rows-max 75`, derived
#    mechanically by `expected_row_bounds(n=30, promote_attempts=15)` in the
#    driver rather than restated as a literal. Simply dropping
#    `--expected-rows` was the other available answer and is strictly worse:
#    it also disarms the short-clean-exit check (OMN-15588's whole point), so
#    a battery that wrote 27 rows and exited 0 would read COMPLETED.
#
#    NOTE, so it is not mistaken for a weakened gate: the §6.1 NO-PROMOTION
#    escape does NOT hide inside this range. A no-promotion run exits NONZERO
#    (the driver returns 1 with its "L-GATE-2 not exercised" FINDING), so the
#    watchdog reports CRASHED, never a short COMPLETED, regardless of the row
#    contract.
#
# 3. THE CANARY (§6.3) IS GATED BY A SCRIPT, NOT BY READING. §6.3's three
#    clauses -- replay_validity == 1 for both seats on both rows, providers
#    observed within the overlay's declared set, and AT LEAST ONE of the two
#    matches terminating DECISIVELY -- are now checked by
#    scripts/check_canary_decisiveness.py, which exits nonzero if any clause
#    fails or if the evidence needed to check it is missing. Clause 3 in
#    particular had no mechanical check anywhere, and it is the clause that
#    bounds the never-flown sniper-mirror stalemate risk from ~5.5 hours to
#    ~20 minutes. The canary flies `--seed-base 9100 --n 2`, which is exactly
#    the pre-registered canary seeds 9101 and 9102.
#
# THE EXECUTING COMMAND, PINNED IN FULL. §2.5 leaves the two loadout paths as
# placeholders and omits the seed base; run verbatim it would fly the wrong
# seed lane. The full launch procedure -- snapshot build, canary, gate, then
# the supervised battery -- is
# docs/runbooks/2026-07-31-lgate2-legA-blue-seat-launch.md, and the driver
# invocation it pins is:
#
#   uv run python scripts/run_lgate2_adaptation_battery.py \
#     --mode battery --seat blue --genesis 0.5 --step 2.0 --n 30 \
#     --promote-attempts 15 --seed-base 6000 \
#     --overlay contracts_data/overlays/tactical_split_overdeal_v1_delegation_learning_blue.yaml \
#     --blue-loadout contracts_data/loadouts/qwen35/sniper_ironclad_lega_blue.yaml \
#     --red-loadout contracts_data/loadouts/qwen35/sniper_ironclad_lega_mirror_red.yaml \
#     --state-root <hermetic-snapshot>/battery_state/omn15488_legA_blue --fresh
#
# wrapped in `so battery-watch` per §10.1, run from the hermetic snapshot's
# steel_onslaught root with OMNI_HOME set to the snapshot per §10.2. LANDING
# THIS FILE AUTHORIZES NO RUN: leg (a) starts only when an operator says so,
# in a session that does the launch as its own named, visible act.
#
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_v1_delegation_learning_blue/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_v1_delegation_learning_blue/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_v1_delegation_learning_blue/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_v1_delegation_learning_blue/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_v1_delegation_learning_blue/experiments
