  evaluation_root: ../../.onex_state/steel_onslaught/composition_p6dmg16_covadv_r1/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/composition_p6dmg16_covadv_r1/lineage
  experiment_root: ../../.onex_state/steel_onslaught/composition_p6dmg16_covadv_r1/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/composition_p6dmg16_covadv_r1/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
