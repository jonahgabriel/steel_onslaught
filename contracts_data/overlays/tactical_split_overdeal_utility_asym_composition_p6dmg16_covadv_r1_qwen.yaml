# Composition arm at x16 (session 2026-07-24, SO-COMP-P5 continuation):
# retest the composition question now that red actually wins the kill race.
# NEW, additive overlay -- the x8 composition overlay
# (``tactical_split_overdeal_utility_asym_composition_p4dmg8_covadv_r1_qwen
# .yaml``) and every pair-sweep/R1/covered_advance overlay are all
# untouched.
#
# WHY THIS ARM (approach-exposure hypothesis, pre-registered before running):
# every geometry/approach lever (``covered_advance``, spatial R1, cover
# rects, cadence) was tested when red COULD NOT KILL (0% win regimes, P1-P4
# composition at x8: 5/30 = 16.7%, BELOW the x8-dose-alone baseline of
# 27.6% -- see ``docs/evidence/2026-07-24-composition-p4dmg8-covadv-r1
# -battery.md``). P6 (x16 dose alone, PR #191) showed red's kill speed has
# now OVERTAKEN blue's (2.18 vs blue's 2.62 mean hits-to-kill,
# per-kill-sequence method) at 17/30 = 56.67% win rate -- the residual
# ceiling now looks like approach exposure (blue lands hits it can't
# finish -- 34.6% of blue's hits occur in matches blue ultimately loses,
# vs only 14.0% for red, per the P6 doc's follow-up recompute), which is
# exactly what the geometry/approach levers target. Those levers may only
# be able to pay off in a regime where red survives the approach with
# lethality to spare -- which x16 alone already demonstrates, and x8 did
# not.
#
# PRE-REGISTERED COMPARISON TARGET (before reading results): P6's own
# 56.67% (17/30, dose alone, this exact arena/blue-loadout pairing) -- NOT
# the x8 composition arm's 16.67%, which tested a fundamentally different
# regime (red losing the kill race) and is not the relevant baseline here.
#
# PRE-REGISTERED ADDITIVITY VS INTERFERENCE CRITERIA (before reading
# results, so the read is not post-hoc):
#   - ADDITIVITY: decided win rate materially ABOVE 56.67% (P6 alone), with
#     covered_advance retaining its established ~94-96% programming rate
#     and spatial vocabulary holding near R1-alone's 22-28% range.
#   - INTERFERENCE: decided win rate AT OR BELOW 56.67%, especially if
#     paired with degraded card/vocabulary metrics (as the x8 composition
#     arm showed: covered_advance held but out-of-range fire got WORSE,
#     73.8% vs R1-alone's 47.4%, and match length nearly doubled the
#     dose-alone baseline).
#   - INDETERMINATE: win rate within noise of 56.67% (Wilson-CI-overlapping,
#     as most adjacent arms in this program have been) with card/vocabulary
#     metrics unchanged -- report as "cannot distinguish," a fully
#     legitimate outcome, not a manufactured verdict either way.
#
# This overlay is the SAME U-GATE + O-GATE combined shape as the P1-P6
# overlays (asym objective arena + the third split-deck utility pile,
# over-deal 10 / program 5, no balance knob touched here). It is
# byte-identical to the P6 overlay except for THREE additive rebindings,
# stacked on top of the P6 arena/loadout pairing, plus isolated ledger
# paths -- mirroring exactly how the x8 composition overlay stacked on P4:
#
#   - arena: ``foundry_60_asym_v1`` -- UNCHANGED (same arena as every
#     pair-sweep arm; mortar_r30 is the approach-fix designed for v1 and
#     stays held constant).
#   - blue loadout: ``loadout.llm.qwen35_sniper_ironclad_mortar_r30`` --
#     UNCHANGED. Bound via ``--blue-loadout`` at launch, not referenced
#     inside this overlay file.
#   - red loadout: ``loadout.llm.qwen35_berserker_dmg16`` -- UNCHANGED, the
#     P6 lethality-dose lever (machine_gun 8->128, shrapnel_thrower
#     12->192). REUSED VERBATIM from P6 -- this arm does not re-create or
#     modify it. Bound via ``--red-loadout`` at launch, not referenced
#     inside this overlay file.
#   - red ``movement_deck_id``: ``deck.movement.v1`` -> ``deck.movement.v2``
#     (``contracts_data/decks/movement_v2.yaml``, PR #165) -- adds
#     ``card.movement.covered_advance`` to red's movement pool at 6/20
#     copies (~79.3% deal rate on a 4-card movement hand). Blue's
#     ``movement_deck_id`` stays ``deck.movement.v1`` -- UNCHANGED, same
#     asymmetric placement as every prior covered_advance arm.
#   - both seats' card-programmer ``pilot_spec_id`` move from
#     ``pilot.llm.qwen35`` / ``pilot.llm.qwen35_sniper`` to the EXISTING,
#     UNMODIFIED R1 pilot specs ``pilot.llm.qwen35_berserker_spatial_r1`` /
#     ``pilot.llm.qwen35_sniper_spatial_r1``
#     (``contracts_data/pilots/fire_dense_qwen/llm_qwen35_{berserker,sniper}
#     _spatial_r1.yaml``, PR #167) -- ASCII grid + resolver-backed
#     consequence previews + in-range flags, representation ONLY
#     (``spatial_representation: grid``, not ``grid_scaffold`` -- R1 is the
#     keeper design, R2's forced ``spatial_read`` field added nothing
#     measurable over R1 and is deliberately NOT used here). Symmetric on
#     both seats, matching R1's own fairness design.
#
# Seam note (same as the x8 composition arm, re-verified applicable here):
# in card mode the CARD PROGRAMMER -- not the loadout's declared
# ``pilot_id`` field -- is the seat's decision-maker
# (``validate_seat_programmer_identity`` checks only that the resolved
# programmer's ``persona`` equals the seat's declared ``archetype``, never
# the loadout's ``pilot_id``). Pairing the dmg16 loadout (declared
# ``pilot_id: pilot.llm.qwen35``) with the spatial_r1 programmer
# (persona=berserker, matching archetype=berserker) is the identical,
# already-proven-legal seam the x8 composition arm used.
#
# Neither the P6 overlay, the P1-P5 overlays, the arena contract, the
# dmg16 loadout/weapons, the mortar_r30 loadout, ``deck.movement.v1``,
# ``deck.movement.v2``, nor either spatial_r1 pilot spec is modified --
# every one of those files stays byte-frozen so historical replays remain
# valid. Ledger paths are isolated under a NEW state directory so this
# arm's battery does not collide with any other lane. No new loadout file
# is created (the dmg16 loadout's provenance is already pinned in
# ``tests/contracts/test_pilot_registry.py`` from PR #191).
#
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_composition_p6dmg16_covadv_r1_qwen.yaml \
#          --loadout-a contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml \
#          --loadout-b contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml --seed 5001
#
# and the O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file>
# --red-loadout contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml
# --blue-loadout contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml
# --state-root .onex_state/steel_onslaught/composition_p6dmg16_covadv_r1``
# (--expected-arena stays the driver default, foundry_60_asym_v1).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/composition_p6dmg16_covadv_r1/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/composition_p6dmg16_covadv_r1/leaderboard.sqlite3
  journal_mode: WAL
