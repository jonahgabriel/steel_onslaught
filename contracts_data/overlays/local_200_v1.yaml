# OMN-15160: tracked provider-reference overlay for local_200 (MLX server on
# stickybeatz-studio, port 8401) -- migrates the untracked top-level
# ``pilots/llm_local_200.yaml`` scratch config into the tracked contracts_data
# provider-reference pattern (endpoint_url/model carried on the overlay's
# llm.providers[] entry, exactly like standard_v1_qwen.yaml carries
# provider_id qwen35).
#
# Deliberately NOT card mode (contracts.card_catalog omitted -- optional per
# ModelSOContractBindings, same choice the vision_foundry_60_asym_v2_* text/img
# overlays make): this overlay's job is to prove the local_200 provider binds
# and resolves, not to stand up a playable battery lane. contracts.arena_id
# reuses the shared foundry_60 arena already used by the qwen35/qwen27/openrouter
# lanes; no new arena content is introduced.
#
# MIGRATED to the delegation-backed provider shape (OMN-15174 batch 1,
# 2026-07-30). The provider binding moved from ``kind: openai_compatible``
# (direct HTTP to stickybeatz-studio:8401 via OpenAICompatibleClient) to
# ``kind: onex_delegation`` (routed through the platform's
# node_delegate_skill_orchestrator via LlmBusDelegationClient), pinning
# ``backend_id: local-coder-mlx``.
#
# WHY THIS OVERLAY AND NO OTHER. Migrating openai_compatible ->
# onex_delegation is NOT behaviour-preserving: LlmBusDelegationClient does
# not forward ``temperature`` (OpenAICompatibleClient does --
# src/steel_onslaught/llm/client_http.py), collapses the system/user message
# split into one flat ``prompt`` string, expresses ``json_mode`` as an
# appended prompt sentence rather than a wire parameter, rejects
# ``image_attachment`` outright, and has no ``retry`` field at all. Any
# overlay whose battery numbers are published under docs/evidence/ would
# therefore have those numbers silently confounded by migration -- the exact
# provider-confound the display-salience PROMINENT overlay's ALTERNATIVE
# READINGS section names and rejects, and a violation of this repo's
# "byte-frozen so historical replays remain valid" convention.
#
# local_200_v1 is the ONE overlay in the corpus where migration is provably
# identity-preserving:
#   * its ``model`` string matches local-coder-mlx's ``model_name`` VERBATIM
#     (mlx-community/Qwen3.6-35B-A3B-8bit), and that backend resolves to the
#     same stickybeatz-studio:8401 endpoint this overlay already named -- so
#     the served model and host are unchanged, not merely "similar";
#   * it has ZERO docs/evidence/ references -- no battery result exists to
#     invalidate;
#   * it is a binding-proof overlay, not a playable battery lane (see the
#     "NOT card mode" note above), so the prompt-shape/temperature deltas
#     change no measured statistic.
# Every other openai_compatible overlay is blocked on at least one of those
# three counts; the corpus census in
# tests/contracts/test_overlay_delegation_migration_omn15174.py pins each
# one's blocking reason and the remaining denominator.
#
# ``timeout_seconds`` is raised 45.0 -> 180.0 (matching the proven-live
# delegation lanes foundry_60_asym_v1_salience_*_delegation.yaml): the
# delegation path spawns an ``onex node`` subprocess in front of the same
# MLX server, so the direct-HTTP budget no longer bounds the same work.
# This is a deliberate, recorded config change, not an oversight.
#
# ``endpoint_url``/``secret_ref``/``retry`` are GONE from this binding --
# ModelSODelegationProviderBinding does not carry them (the endpoint is
# resolved platform-side from backend_id, secrets are resolved by the
# delegation node, retries are the node's). The former bare-base-URL
# regression guard that lived on this overlay's test is replaced by a
# backend_id/model identity assertion, which is the equivalent guard on the
# delegation shape.
#
# ``omnibase_infra_path``/``state_root`` are explicit overlay config, not
# env-derived: this codebase's DI-confinement gate (tests/test_di_enforcement
# .py) permits zero os.environ reads anywhere. Both are used verbatim as
# given, relative to the process CWD -- same values the proven-live
# display-salience delegation lanes carry.
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/local_200_v1/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/local_200_v1/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/local_200_v1/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/local_200_v1/lineage
  experiment_root: ../../.onex_state/steel_onslaught/local_200_v1/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/local_200_v1/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/local_200
  arena_id: foundry_60
llm:
  providers:
    - kind: onex_delegation
      provider_id: local_200
      backend_id: local-coder-mlx
      task_type: agent_delegation
      source: external-client
      model: mlx-community/Qwen3.6-35B-A3B-8bit
      max_tokens: 2048
      timeout_seconds: 180.0
      omnibase_infra_path: ../omnibase_infra
      state_root: .onex_state/steel_onslaught/local_200_v1/delegation_state
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.local_200
      display_name: "Qwen3.6-35B-A3B-8bit (stickybeatz-studio MLX)"
      provider_binding_id: local_200
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
