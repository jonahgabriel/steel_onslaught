# Round-4 "Range Band + Moderate Evasion" A/B — COMPOSED TREATMENT arm.
#
# This is the composed round-4 change: the round-3 moves-scaled evasion set to a
# MODERATE 0.14 / cap 0.42 (the survivability half) COMPOSED with the round-4
# close-range accuracy falloff on the sniper's long weapons plus a sustainable
# close-in carbine (the kill-conversion half). Round 3 proved evasion ALONE
# plateaus at ~9% brawler win-rate even at 0.20/cap0.55: it fixes BEING HIT, not
# KILL CONVERSION. Round 4 adds the missing half — when the brawler survives the
# approach and closes, the sniper's mortar/harpoon lose accuracy up close so the
# time-on-field the evasion buys finally converts into kills, while the carbine
# keeps the sniper from being helpless (a CONTEST, not a walkover).
#
# The gameplay/behavioural differences from the round-2/c11 baseline
# (contracts_data/overlays/tactical_split_c11_qwen.yaml) are EXACTLY:
#   1. contracts.moves_scaled_evasion  = 0.14 / cap 0.42 (moderate survivability).
#   2. contracts.close_range_falloff   = long-weapon close-range accuracy falloff.
#   3. blue seat weapon_deck_id        = deck.weapon.sniper_v1 (adds the carbine
#                                        card so the sniper can fire hardpoint 2).
# Everything else — the c11 overpressure_cooldown handler, the round-2 5.5x
# brawler weapon damage, the raised LLM budget, decks, personas, arena — is
# identical. The carbine hardpoint is supplied by launching the sniper with the
# loadout qwen35/sniper_ironclad_carbine.yaml (see the launch note below); the
# baseline launches qwen35/sniper_ironclad.yaml.
#
# Range-band arithmetic (min_weapon_range 20, band_distance 20, floor 0.30):
#   the mortar's curve accuracy is scaled by a gradient that is 1.0 at d>=20 and
#   0.30 at d=0. mortar hit at d=12 (scout MG range): 0.80 * 0.72 = 0.58 (was
#   0.80); at d=5: 0.80 * 0.475 = 0.38; at d=0: 0.80 * 0.30 = 0.24. The sniper
#   keeps a real point-blank lottery (~24% for ~34-38 dmg) but can no longer
#   reliably 2-shot the brawler in the close band. The carbine (range 14 < 20) is
#   exempt and sustainable (see contracts_data/weapons/defense_carbine.yaml for
#   the per-tick pressure/heat arithmetic against the Bessemer-90 caps).
#
# Launch either arm headless (in-process, sudden-death convergence, exactly the
# `so play-live` default) via steel_onslaught.match.composition.run_composed_match
# / assemble_match_live, red=llm_qwen35_berserker.yaml:
#   COMPOSED  overlay=contracts_data/overlays/tactical_split_range_band_evasion_qwen.yaml
#             blue=contracts_data/loadouts/qwen35/sniper_ironclad_carbine.yaml
#   BASELINE  overlay=contracts_data/overlays/tactical_split_c11_qwen.yaml
#             blue=contracts_data/loadouts/qwen35/sniper_ironclad.yaml
# then compare the two namespaced ledgers (WEAPON_FIRED hit_probability +
# close_range_mult on the sniper at d<20, blue/red DMG-OUT, ticks-survived,
# MATCH_ENDED win side).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_range_band_evasion_qwen/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_range_band_evasion_qwen/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tactical_split_range_band_evasion_qwen/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tactical_split_range_band_evasion_qwen/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tactical_split_range_band_evasion_qwen/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/tactical_split_range_band_evasion_qwen/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          hand_quota:
            movement: 3
            weapon: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          # Round-4: the sniper draws from the carbine-bearing deck so it can fire
          # hardpoint 2. The brawler keeps deck.weapon.v1 (no carbine card).
          weapon_deck_id: deck.weapon.sniper_v1
          hand_quota:
            movement: 2
            weapon: 3
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: ["overpressure_cooldown"]
  # Round-4 survivability half: MODERATE moves-scaled evasion (the round-3 sweep's
  # recommended 0.14 / cap 0.42 — a full-sprint scout (3 moves) dodges up to 42%
  # of aimed shots this round, decaying to 0 on a round it stops to shoot).
  moves_scaled_evasion:
    kind: moves_scaled_evasion
    evasion_per_move: 0.14
    cap: 0.42
  # Round-4 kill-conversion half: close-range accuracy falloff on the sniper's
  # long weapons (range >= 20: mortar 50, harpoon 30). Gradient (not a hard
  # min-range, which leaves a ledge): full accuracy at d>=20, scaled down to 30%
  # at point-blank. The carbine (range 14) is exempt.
  close_range_falloff:
    kind: close_range_accuracy_falloff
    min_weapon_range: 20
    band_distance: 20
    point_blank_multiplier: 0.30
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 90.0
      max_tokens: 4096
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: injected
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
