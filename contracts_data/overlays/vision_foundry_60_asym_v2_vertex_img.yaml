# ARM V-IMG of the 2026-07-24 vision-representation experiment, Vertex AI
# rerun. Byte-identical to ``vision_foundry_60_asym_v2_vertex_text.yaml``
# (same model, same arena/loadouts/personas, same provider timeout/retry/
# max_tokens) except for the ONE added block below:
# ``llm.providers[0].image_attachment``. That binding makes
# ``LLMPilot.decide`` (pilot.py) render + attach a deterministic per-tick
# PNG (``render_observation_png``, llm/render.py) alongside the SAME text
# prompt V-TEXT sends, plus one neutral sentence noting the image is
# attached (no strategy). Both seats render symmetrically -- neither side
# gets an information advantage the other lacks.
#
# See the V-TEXT twin overlay's header comment for the full Vertex-provider
# rationale and the live evidence backing the endpoint/model/billing choice
# (ON_DEMAND traffic_type confirmed live; image content-part accepted and
# billed in a live smoke-test call this session).
#
# Platform non-negotiables this binding relies on (unchanged from the
# gemini_img / openrouter_img design):
#   - the render is a PURE deterministic function of match state (same state
#     -> byte-identical PNG; tests/llm/test_render_determinism.py);
#   - the sha256 is recorded in the ``LLM_COMPLETION_REQUESTED`` ledger event
#     (events/payloads.py::ModelSOLlmCompletionRequestedPayload.image_sha256);
#   - the PNG itself is persisted under ``render_output_dir`` below, keyed by
#     match_id/tick, so the ledger's sha256 is joinable to a durable artifact;
#   - replay validity is unaffected -- LLM completion telemetry (image or
#     text) was never part of the canonical fold.
#
# Battery (per-seed isolated invocation, matched seeds against the V-TEXT
# twin and the OpenRouter pair's seeds 5001-5030):
#   VERTEX_ACCESS_TOKEN="$(gcloud auth application-default print-access-token)" \
#   uv run python scripts/run_ogate_objectives_battery.py \
#       --overlay contracts_data/overlays/vision_foundry_60_asym_v2_vertex_img.yaml \
#       --red-loadout contracts_data/loadouts/vision_vertex/berserker_scout_v2.yaml \
#       --blue-loadout contracts_data/loadouts/vision_vertex/sniper_ironclad.yaml \
#       --expected-arena foundry_60_asym_v2 \
#       --n 1 --seed-base <seed-1> \
#       --state-root .onex_state/steel_onslaught/vl_vertex_img_battery
# with gcloud on PATH and valid ADC credentials.
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_vertex_img/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_vertex_img/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_vertex_img/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_vertex_img/lineage
  experiment_root: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_vertex_img/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_vertex_img/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/vision_vertex
  arena_id: foundry_60_asym_v2
llm:
  providers:
    - kind: openai_compatible
      provider_id: vertex_vl
      endpoint_url: https://us-central1-aiplatform.googleapis.com/v1beta1/projects/omnibase-465418/locations/us-central1/endpoints/openapi/chat/completions
      model: google/gemini-2.5-flash-lite
      secret_ref:
        kind: opaque
        ref: secret://llm/vertex
      timeout_seconds: 120.0
      max_tokens: 3072
      retry:
        max_attempts: 4
        initial_backoff_seconds: 2.0
        backoff_multiplier: 2.0
      # V-IMG arm: the ONLY field that differs from the V-TEXT twin overlay.
      # arena_size is config-declared to match foundry_60_asym_v2's own
      # ``size: 60`` (contracts_data/arenas/foundry_60_asym_v2.yaml) -- static
      # per this overlay, never resolved dynamically from the live arena spec.
      image_attachment:
        enabled: true
        arena_size: 60
        render_output_dir: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_vertex_img/renders
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.vertex_vl_img
      display_name: Gemini 2.5 Flash-Lite (V-IMG arm, Vertex AI)
      provider_binding_id: vertex_vl
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: injected
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
