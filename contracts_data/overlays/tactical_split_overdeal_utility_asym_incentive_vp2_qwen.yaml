# SO-UTIL-REWARD arm overlay — the structural in-register utility incentive.
#
# PRE-REGISTERED. The mechanism shipped unlaunched in the SO-UTIL-MECH PR
# (#201, merged c6d0d9c). This commit adds the pre-registration below and is
# the LAST commit before the first ``match_started`` event is emitted against
# this overlay. n = 30, seeds 5001-5030.
#
# WHAT IS DIFFERENT FROM THE BASELINE. This overlay is the U-GATE + O-GATE
# combined shape (``tactical_split_overdeal_utility_asym_v1_qwen.yaml``:
# ``foundry_60_asym_v1``, over-deal 10 / program 5, the third utility pile,
# the full utility handler pack) with EXACTLY ONE addition — the
# ``utility_incentive`` binding below — plus isolated ledger paths. No arena,
# loadout, deck, persona, prompt, or handler is touched.
#
# WHY THIS ARM EXISTS. Utility deprioritization is the program's most
# replicated negative result: the aggressive seat programs utility far below
# the 0.50 chance floor in all four tested lineages (qwen35, deepseek, gemma,
# glm), it survived the surfacing fix (#139), it survived the arena swap
# (#147/#148), and L-GATE-2 established that prompt-level steering does not
# move this model's drafting. Every lever tried so far has been prompt- or
# balance-shaped. This one is neither: the reward is a victory-point bounty
# the ENGINE pays on each resolved utility deploy, surfaced to the pilot as a
# number on the card row (``legal_hand[].deploy_vp_bounty``) and a top-level
# ``incentives`` block — no instruction sentence anywhere. The question the
# battery can then answer is whether the drafting bias is a preference the
# model will trade against a stated in-game price, or a prior it holds
# regardless of price.
#
# READ BEFORE CHOOSING vp_per_deploy. The bounty counts toward this arena's
# ``vp_threshold`` (15). At ``vp_per_deploy: 2`` a seat that programs utility
# in every register of every round could reach the line on bounties alone, so
# the rate is a live confound on WIN RATE and must not be read as a balance
# result. The primary outcome measure for this arm is the utility KEEP-RATE
# against the 0.50 floor — the same measure every prior arm in this family
# reported. State the rate's interaction with the win condition explicitly in
# the arm's limitations section.
#
# The blue standoff configuration this family inherits (the P1-P7 harpoon
# framing error, OMN-15119) applies here unchanged and must be stated in the
# arm's limitations.
#
# ============================== PRE-REGISTRATION ==============================
#
# CONFIGURATION UNDER TEST (everything except the incentive is the U-GATE
# baseline, stated explicitly so no reader has to infer it):
#   * Red DOSE: UNSCALED BASELINE. Red carries the stock berserker loadout
#     ``loadout.llm.qwen35_berserker`` -> ``weapon.light.machine_gun``
#     (damage 8, range 12) and ``weapon.light.shrapnel_thrower`` (damage 12,
#     range 8). This is NOT any P1-P7 dose-ladder variant: no ``_dmg3``,
#     ``_dmg8``, ``_dmg11``, ``_dmg16``, ``_dmg24``, ``_dmg55`` or ``_armor8``
#     file is referenced anywhere in this arm.
#   * Blue RANGE: UNCUT BASELINE. Blue carries the stock sniper loadout
#     ``loadout.llm.qwen35_sniper_ironclad`` -> ``weapon.siege.artillery_mortar``
#     (range 50, damage 45) and ``weapon.heavy.harpoon_gun`` (range 30,
#     damage 28). This is NOT the SO-RANGECAP / SO-STANDOFF ladder: no
#     ``_r30`` / ``_r15`` weapon or loadout variant is referenced.
#   * Arena ``foundry_60_asym_v1``, ``vp_threshold: 15``; over-deal 10
#     (4 movement + 4 weapon + 2 utility), program 5; utility handler pack
#     ``utility.resolution.v1`` complete. Both seats live Qwen3.6-35B-A3B.
#   The dose/range ladders are deliberately NOT applied because the scored
#   quantity here is KEEP-RATE, and the only prior arms with a published,
#   independently recomputed keep-rate on this exact overlay shape are the
#   un-laddered ones. Holding dose and range at baseline keeps this arm
#   EXACTLY ONE lever away from the U-GATE baseline arm.
#
# CHANCE-LEVEL KEEP-RATE BASELINE (recomputed from prior utility_asym arm
# artifacts, NOT eyeballed). Keep-rate is defined exactly as the U-GATE arm
# defined it: for each seat, pair every ``hand_dealt`` with the
# ``plan_committed`` that follows it for the same (match_id, seat) in ledger
# order; keep-rate = (cards of the category appearing in
# ``plan_committed.registers[].card_id``) / (cards of that category appearing
# in ``hand_dealt.card_ids``). Unpaired hands are excluded from BOTH sides.
#   * STRUCTURAL chance floor p0 = register_count / hand_size = 5 / 10 = 0.5000.
#   * EMPIRICAL confirmation, recomputed over the 16 clean n=30 utility_asym
#     qwen35 arm ledgers held under the sibling SO-* worktrees: pooled
#     all-card keep-rate = 31,640 / 63,280 = 0.500000 EXACTLY. Pilots keep
#     cards at chance in aggregate; they dump UTILITY specifically.
#   * OBSERVED prior utility keep-rate over those same 16 arms (context only,
#     not the criterion): pooled 1,037 / 12,656 = 0.081937.
#   * DIRECT baseline arm (this overlay minus the incentive,
#     ``ugate_asym_utility_battery``): pooled 30 / 812 = 0.036946;
#     red 7 / 406 = 0.017241, blue 23 / 406 = 0.056650.
#
# HYPOTHESES:
#   H_PRICED — the drafting bias is a PREFERENCE the model will trade against
#     a stated in-game price. Paying victory points per resolved utility
#     deploy, surfaced as game state rather than as instruction text, lifts
#     utility keep-rate above the chance floor.
#   H_PRIOR — the drafting bias is a PRIOR the model holds regardless of
#     price. The structural incentive fails to lift keep-rate above chance,
#     exactly as prompt-level steering failed in L-GATE-2. A fully real,
#     publishable, first-class negative result per house rule, and the
#     prior-favoured outcome given the 0.0819 pooled baseline.
#
# FORMAL CRITERION — the ONLY criterion this arm is scored against.
#   Quantity: POOLED (red + blue) utility keep-rate, n = 30, seeds 5001-5030,
#   computed by the paired hand_dealt/plan_committed method above.
#   ARITHMETIC (independently verified before this commit):
#     p0    = 5 / 10 = 0.500000            (chance floor, confirmed empirically
#                                           at 0.500000 exact, 31,640/63,280)
#     N_min = 620                          (smallest pooled utility-dealt count
#                                           observed in any of the 16 clean
#                                           n=30 arms — pair_p4_dmg8)
#     SE    = sqrt(p0 * (1 - p0) / N_min)
#           = sqrt(0.25 / 620) = sqrt(0.00040322580645) = 0.02008048
#     z     = 1.645                        (one-sided, alpha = 0.05)
#     delta = z * SE = 1.645 * 0.02008048 = 0.03303239
#     bar   = p0 + delta = 0.500000 + 0.03303239 = 0.53303239
#           -> rounded UP to 4 dp = 0.5331 (rounding up is conservative: it
#              makes H_PRICED harder, never easier, to support)
#   DECISION: pooled utility keep-rate >= 0.5331 supports H_PRICED.
#             pooled utility keep-rate <  0.5331 supports H_PRIOR.
#   N_min is used rather than this arm's own (unknown-in-advance) N so the bar
#   is a fixed rate a reader can check before the battery runs. If this arm's
#   realised N exceeds 620 the fixed bar is conservative, never permissive.
#
# SECONDARY OBSERVABLES — PRE-DECLARED HERE, REPORTED, NEVER SCORED. Declaring
# them in advance is what stops a large-but-sub-chance move from being written
# up post hoc as a rescue: per-seat utility keep-rate; red (brawler) win rate
# and terminal-class mix; match length; ``utility_deployed`` counts by kind and
# by seat; VP composition (bounty VP vs objective VP) and whether any match
# terminates on ``vp_threshold``; completion health. A move from 0.0819 to,
# say, 0.30 would score H_PRIOR under the criterion above while still being a
# large effect — it will be reported as exactly that, an unscored secondary,
# with no claim that the criterion was met.
#
# WIN RATE IS A KNOWN CONFOUND IN THIS ARM AND IS NOT A BALANCE RESULT. At
# ``vp_per_deploy: 2`` against ``vp_threshold: 15``, eight resolved deploys
# win outright, so win rate here measures the bounty as much as it measures
# the seats. It is a secondary observable only.
#
# "n=30 CANNOT DISTINGUISH THEM" IS AN ACCEPTABLE ANSWER. This arm does not
# pre-favour either hypothesis in its analysis, and no re-run to chase a
# different number is permitted: the battery reports the 30 seeds it ran.
# ==============================================================================
#
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/util_incentive_vp2/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/util_incentive_vp2/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/util_incentive_vp2/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/util_incentive_vp2/lineage
  experiment_root: ../../.onex_state/steel_onslaught/util_incentive_vp2/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/util_incentive_vp2/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60_asym_v1
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  # Phase 2 — utility resolution handlers selected by this typed overlay
  # (design §6 Handlers row).  The full pack is named explicitly so the
  # runner's fail-closed ``select`` is driven by the overlay, not a hardcoded
  # default.  Narrowing this list (e.g. dropping ``utility.flares.v1``) would
  # make that kind fail closed at resolution time.
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
  # THE ONLY EXPERIMENTAL DELTA IN THIS FILE (SO-UTIL-MECH).  Each resolved
  # UTILITY_DEPLOYED credits the deploying player 2 victory points, folded
  # into the same ``vp_totals`` objective control scores into and settled
  # against the same ``vp_threshold: 15``.  Absent this block the whole
  # mechanism is off and every byte downstream -- prompt, MATCH_STARTED
  # payload, VP derivation -- is identical to the baseline overlay.
  utility_incentive:
    kind: utility_deploy_vp_bounty
    vp_per_deploy: 2
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    # Keyless: the only provider carries ``secret_ref: null``, so no resolver
    # capability is required.  ``none`` lets ``so run --overlay`` and the O-GATE
    # battery driver launch this overlay directly (``injected`` would raise
    # "requires a resolver capability" on the keyless CLI path).
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
