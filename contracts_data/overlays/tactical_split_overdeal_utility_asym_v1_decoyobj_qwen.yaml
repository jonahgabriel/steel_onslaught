# SO-OBJ-DECOY isolating arm: objectives PRESENT in the observation space,
# NON-SCORING in the fold.
#
# This overlay is byte-identical to
# contracts_data/overlays/tactical_split_overdeal_utility_asym_v1_qwen.yaml
# except for (a) contracts.arena_id, which points at the decoy-scoring copy
# foundry_60_asym_v1_decoyobj, and (b) the .onex_state path stems, which are
# renamed for hygiene only (the battery driver's _lane_overlay() rewrites every
# durable path from --state-root at runtime, so those strings are cosmetic, not
# functional).  Loadouts, dose, deck policy, over-deal quotas,
# utility_handler_pack, provider, retry and timeout are all unchanged and
# unmodified.  tests/contracts/test_objdecoy_overlay.py asserts that
# field-by-field, so the single free variable across the lanes is the arena
# binding.
#
# ----------------------------------------------------------------------------
# PRE-REGISTERED HYPOTHESIS AND DECISION CRITERION
# Committed BEFORE the first match_started event of this arm's battery.
# ----------------------------------------------------------------------------
#
# QUESTION.  docs/evidence/2026-07-25-scenobj-asym-noobj-battery.md §6a recorded
# a result its own arms could not explain: ASYM_OBJ produced only 2
# objective_scored events across 30 matches and ZERO VP terminals - objectives
# were declared and essentially never captured - yet REMOVING them was the
# larger of the two measured effects on utility keep-rate, and the only
# comparison in that battery clearing significance on both seats.  Something
# about objectives moved card selection without objectives ever being scored.
# Two rival mechanisms survive that observation:
#
#   H_GOALCTX (goal context).  Objectives act through the STATED GOAL in the
#     pilot's decision context - the cells, distances, control flags and the
#     "first to vp_threshold wins" rule line the prompt carries.  A mech with
#     somewhere to go programs approach-enabling utility (smoke/chaff); a mech
#     whose only available goal is to shoot does not.  Realized capture is
#     irrelevant because it barely happened.
#   H_CAPTURE (capture reward).  Objectives act through the LIVE PAYOUT - VP
#     actually accruing, the scoreboard actually moving, a VP victory actually
#     being reachable.  The 2 capture events and the ever-present possibility
#     of more are what moved selection.
#
# THE ISOLATING MANIPULATION.  Arena foundry_60_asym_v1_decoyobj is
# foundry_60_asym_v1 with ONE field changed: objective_scoring: decoy.  The
# three objective cells, their vp_per_round, and vp_threshold: 15 are all still
# declared and still rendered into the observation and the programming prompt -
# the serialized prompt is byte-identical to an ASYM_OBJ prompt at the same
# match state (proven in CI, not asserted in prose:
# tests/contracts/test_objdecoy_overlay.py::
# test_decoy_pilot_prompt_stream_is_byte_identical_to_scoring_arena).  What is
# suppressed is only the payout: no VP award, no OBJECTIVE_SCORED event, no VP
# victory.  H_GOALCTX is therefore untouched by this arm and H_CAPTURE is
# removed entirely.
#
# FIXED REFERENCE CONSTANTS.  Both corners are already measured, on the same
# model (Qwen3.6-35B-A3B, both seats), the same n=30 seeds 5001-5030, the same
# stock loadouts, and the same keep-rate method (dealt = utility-partition card
# count summed over each seat's hand_dealt events; programmed = plan_committed
# register slots whose card_id matches card.utility.*).  Quoted from
# docs/evidence/2026-07-25-scenobj-asym-noobj-battery.md §4:
#
#   ASYM_OBJ    (ledger ugate_surfacing_fix_battery, arena foundry_60_asym_v1):
#       red  = 20/362 = 0.055249      blue = 60/362 = 0.165746
#   ASYM_NOOBJ  (ledger ugate_scenobj_asym_noobj_battery_r3,
#                arena foundry_60_asym_v1_noobj):
#       red  =  7/398 = 0.017588      blue = 35/398 = 0.087940
#
#   d_obj_red   = 0.055249 - 0.017588 = 0.037661
#   d_obj_blue  = 0.165746 - 0.087940 = 0.077806
#   d_obj_pooled = 0.037661 + 0.077806 = 0.115467
#
# d_obj_pooled is the WHOLE objectives effect, measured with geometry held
# byte-identical.  This arm asks what fraction of it survives when the capture
# reward is removed and only the goal context remains.
#
# MEASURED QUANTITIES.  From this arm's own n=30 ledger, identical method:
#   DECOY_red  = programmed_red  / dealt_red
#   DECOY_blue = programmed_blue / dealt_blue
#
# PRIMARY STATISTIC (one number, pooled over seats the same way SO-SCEN-OBJ
# pooled - numerator and denominator summed, not seat fractions averaged):
#
#   g_pooled = [(DECOY_red - 0.017588) + (DECOY_blue - 0.087940)] / 0.115467
#
# WHY THIS ARITHMETIC SEPARATES THE TWO HYPOTHESES CLEANLY.  It places the arm
# on the interval between the two already-measured corners and normalises by the
# full objectives effect, so each rival hypothesis predicts an exact endpoint:
#
#   If H_GOALCTX is right and goal context carries the whole effect, the decoy
#   arm reproduces ASYM_OBJ:
#     numerator = (0.055249-0.017588) + (0.165746-0.087940) = 0.115467
#     g_pooled  = 0.115467 / 0.115467 = 1.0000
#   If H_CAPTURE is right and the payout carried the effect, the decoy arm
#   collapses to ASYM_NOOBJ:
#     numerator = (0.017588-0.017588) + (0.087940-0.087940) = 0.000000
#     g_pooled  = 0.000000 / 0.115467 = 0.0000
#
# The statistic is therefore 1 under one hypothesis and 0 under the other, with
# no free parameters and no rescaling - the whole content of the arm is where
# between those two poles the measurement lands.
#
# DECISION (disjunctive, exactly one criterion, no illustrative bands):
#   g_pooled >= 0.65          => GOAL-CONTEXT-ATTRIBUTABLE
#                                (>=65% of the measured objectives effect
#                                 survives with the payout removed; realized
#                                 capture accounts for <=35%)
#   g_pooled <= 0.35          => CAPTURE-ATTRIBUTABLE
#                                (goal context alone reproduces <=35%; the
#                                 payout accounts for >=65%)
#   0.35 < g_pooled < 0.65    => BOTH-CONTRIBUTE; report both components and do
#                                NOT force a single-cause verdict.
#
# OUT-OF-INTERVAL ESCAPE (written because SO-SCEN-OBJ's pre-registration failed
# exactly here - it did not contemplate a component carrying the opposite sign,
# and had to concede the point after the fact in its §0a).  g_pooled is NOT
# bounded to [0,1] by anything except the hypothesis space, and both excursions
# are live possibilities with distinct readings:
#   g_pooled < 0   (DECOY pooled keep-rate BELOW ASYM_NOOBJ)  => SUB-NOOBJ.
#   g_pooled > 1   (DECOY pooled keep-rate ABOVE ASYM_OBJ)    => SUPER-OBJ.
# Either is reported QUALITATIVELY, with the raw per-seat rates, and is NOT
# clamped or folded into the 0-1 scale.  Both would mean the decoy arena is a
# THIRD condition rather than an interpolation between the two corners - the
# most plausible mechanism being that a displayed-but-unreachable goal is not
# the same stimulus as either a live goal or no goal at all.  That reading would
# itself need a further arm and must not be asserted from this one.
#
# SEAT SPLIT (reported, not a second criterion).  Per-seat fractions
#   g_red  = (DECOY_red  - 0.017588) / 0.037661
#   g_blue = (DECOY_blue - 0.087940) / 0.077806
# are always reported alongside g_pooled.  If they straddle the decision
# boundaries (one >= 0.65 while the other <= 0.35), the arm is reported
# SEAT-SPLIT and the pooled verdict is stated as not supported by both seats.
# The formal criterion remains g_pooled; this clause governs how honestly it is
# narrated, not what it decides.
#
# MANIPULATION-LANDED GATE (must pass before any scoring; this is what makes
# the arm a decoy rather than a rename).  From this arm's own ledger:
#   - objective_scored event count == 0
#   - vp_threshold terminal count == 0
#   - every match_started row carries arena_id foundry_60_asym_v1_decoyobj and
#     the arena_contract_hash recomputed from that contract
# and, from the arm's own prompts, the objectives block IS present (the decoy
# must be visible, or this arm is just a slower ASYM_NOOBJ).
#
# CONTAMINATION GATE.  The ledger must show EXACTLY 30 match_started rows, 30
# distinct match_ids, and seeds 5001-5030 each exactly once.  Anything else
# means the arm is contaminated and must be re-run in a fresh --state-root
# before any scoring.
#
# STATISTICAL HONESTY.  Adjacent-arm two-proportion z-tests at n=30 rarely reach
# significance in this program, and card-level proportions are CLUSTERED WITHIN
# MATCHES (~6-12 rounds x 2 utility cards per seat per match), so any p-value
# computed on the nominal denominator is anti-conservative - read as a rank
# ordering of effect strength, never as calibrated evidence.  A non-significant
# comparison here is the expected shape and must not be over-read in either
# direction.  n=30 does not support a claim stronger than the pre-registered
# verdict label.
#
# UNCONTROLLED STANDOFF (OMN-15119 disclosure class).  Blue's stock loadout
# qwen35/sniper_ironclad.yaml carries weapon.siege.artillery_mortar (range 50)
# and weapon.heavy.harpoon_gun (range 30); red's llm_qwen35_berserker.yaml
# carries weapon.light.machine_gun (range 12) and weapon.light.shrapnel_thrower
# (range 8).  Blue therefore holds an uncontrolled ~18-38 cell range advantage,
# and in the ASYM_NOOBJ arm blue won 29/29 decided matches.  This arm inherits
# that asymmetry UNCHANGED and deliberately - all three corners it is compared
# against carry the identical loadout pairing, so the standoff is constant and
# cannot generate the difference being measured.  It is disclosed here so no
# reader assumes it was controlled.
#
# KNOWN RESIDUAL DIFFERENCE FROM ASYM_OBJ (stated against the arm's own claim).
# The prompt is byte-identical to ASYM_OBJ's at equal match state, but ASYM_OBJ
# recorded 2 objective_scored events in 30 matches, so in that battery the VP
# scoreboard moved off 0-0 in at most 2 matches and this arm's never will.  The
# arm therefore does not hold the prompt stream identical in the strictest
# sense; it holds it identical everywhere except that <=2-event tail.  Terminal
# sets already matched empirically (ASYM_OBJ recorded zero VP terminals).
#
# BATTERY STATUS AT MERGE: DEFERRED.  This overlay ships pre-registered and
# UNLAUNCHED - the shared vLLM endpoint is owned by another battery.  No match
# has been run against this arena.  Launch when the endpoint frees:
#   uv run python scripts/run_ogate_objectives_battery.py \
#     --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_v1_decoyobj_qwen.yaml \
#     --expected-arena foundry_60_asym_v1_decoyobj \
#     --state-root .onex_state/steel_onslaught/ugate_objdecoy_battery \
#     --n 30 --seed-base 5000 --fresh
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_decoyobj_qwen/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_decoyobj_qwen/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_decoyobj_qwen/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_decoyobj_qwen/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_decoyobj_qwen/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v1_decoyobj_qwen/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60_asym_v1_decoyobj
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  # Phase 2 — utility resolution handlers selected by this typed overlay
  # (design §6 Handlers row).  The full pack is named explicitly so the
  # runner's fail-closed ``select`` is driven by the overlay, not a hardcoded
  # default.  Narrowing this list (e.g. dropping ``utility.flares.v1``) would
  # make that kind fail closed at resolution time.
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    # Keyless: the only provider carries ``secret_ref: null``, so no resolver
    # capability is required.  ``none`` lets ``so run --overlay`` and the O-GATE
    # battery driver launch this overlay directly (``injected`` would raise
    # "requires a resolver capability" on the keyless CLI path).
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
