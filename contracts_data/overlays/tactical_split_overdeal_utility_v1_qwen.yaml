# U-GATE utility battery overlay (Phase 2: "smoke/chaff/flares counterplay").
#
# This overlay forks ``tactical_split_overdeal_v1_qwen.yaml`` (the over-deal
# control) and adds the THIRD split-deck pile: each seat is dealt an extra
# ``utility`` quota of counterplay cards (smoke/chaff/flares) that compete for
# the SAME 5 registers.  Over-deal stays the mechanism — the deal grows to 10
# cards (4 movement + 4 weapon + 2 utility) while the program stays 5, so the
# pilot must decide whether to spend a register on counterplay instead of
# movement/attack.  No balance knob is touched (U-GATE requirement): the utility
# effect is expressed only through LOS/lock/targeting consults in the fold, not
# through any damage/evasion/range number.
#
# Ledger paths are isolated under a NEW state directory so the U-GATE battery
# does not collide with the over-deal control battery.  Existing overlays are
# untouched: the ``utility`` quota field defaults to 0, so every prior overlay
# stays byte-valid.
#
# Launch (U-GATE utility battery):
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_v1_qwen.yaml \
#          --loadout-a <red.yaml> --loadout-b <blue.yaml> --seed <n>
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_v1_qwen/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_v1_qwen/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_v1_qwen/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_v1_qwen/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_v1_qwen/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_v1_qwen/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  # Phase 2 — utility resolution handlers selected by this typed overlay
  # (design §6 Handlers row).  The full pack is named explicitly so the
  # runner's fail-closed ``select`` is driven by the overlay, not a hardcoded
  # default.  Narrowing this list (e.g. dropping ``utility.flares.v1``) would
  # make that kind fail closed at resolution time.
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: injected
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
