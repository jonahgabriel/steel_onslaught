# Tournament arm 11 (corridor_spawn, session 2026-07-24) battery overlay.
# NEW, additive overlay -- the v1 combined overlay
# (``tactical_split_overdeal_utility_asym_v1_qwen.yaml``) is untouched.
#
# This overlay is the SAME U-GATE + O-GATE combined shape as the v1 overlay
# (design 2026-07-22 §5: asym objective arena + the third split-deck utility
# pile, over-deal 10 / program 5, no balance knob touched), rebound to the
# corridor-spawn arena:
#   - arena ``foundry_60_asym_v1_corridor_spawn`` (``contracts_data/arenas/
#     foundry_60_asym_v1_corridor_spawn.yaml``) -- foundry_60_asym_v1's
#     asymmetric cover corridors + 3 objective cells + vp_threshold 15, with
#     spawn_a relocated from the open mid-lane sightline (4,30) into the
#     mouth of the north approach corridor (10,22), so the brawler starts
#     the match already inside covered ground.
#   - red loadout: ``loadout.llm.qwen35_berserker`` -- UNCHANGED.
#   - blue loadout: ``loadout.llm.qwen35_sniper_ironclad`` -- UNCHANGED.
#   Loadouts are not referenced inside this overlay file itself -- they are
#   bound at launch via ``--loadout-a``/``--loadout-b`` (``so run``) or the
#   driver defaults (``scripts/run_ogate_objectives_battery.py``), exactly
#   as the v1 overlay is launched.
#
# The empirical question this arm answers: does starting the brawler inside
# the covered corridor -- instead of making it cross open sightline ground
# to reach cover -- move it off the qwen35 asym v1 anchor's 0/30 win rate on
# ``foundry_60_asym_v1_corridor_spawn``?
#
# Neither the v1 overlay, arena, nor either loadout contract is modified --
# ``foundry_60_asym_v1``, ``llm_qwen35_berserker.yaml``, and
# ``qwen35/sniper_ironclad.yaml`` all stay byte-frozen so historical replays
# remain valid. Ledger paths are isolated under a NEW state directory so
# this arm's battery does not collide with any other lane.
#
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_v1_qwen_corridor_spawn.yaml \
#          --loadout-a contracts_data/loadouts/llm_qwen35_berserker.yaml \
#          --loadout-b contracts_data/loadouts/qwen35/sniper_ironclad.yaml --seed 5001
#
# and the O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file>
# --expected-arena foundry_60_asym_v1_corridor_spawn`` (red/blue loadout
# both stay the driver defaults).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tourn_arm11_corridor_spawn/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tourn_arm11_corridor_spawn/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tourn_arm11_corridor_spawn/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tourn_arm11_corridor_spawn/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tourn_arm11_corridor_spawn/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/tourn_arm11_corridor_spawn/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60_asym_v1_corridor_spawn
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
