# ARM V-TEXT of the 2026-07-24 vision-representation experiment RERUN over
# OpenRouter ("show don't tell"): does giving the pilot an actual IMAGE of
# the arena change outcomes, holding the model fixed?
#
# This is the OpenRouter unblock of the ORIGINAL gemini_text/gemini_img pair
# (contracts_data/overlays/vision_foundry_60_asym_v2_gemini_{text,img}.yaml,
# PR #171), which never produced trustworthy data: both arms hit
# `GenerateRequestsPerDayPerProjectPerModel-FreeTier` (20 requests/day) on
# Google's direct API, because `GOOGLE_API_KEY` and `GEMINI_API_KEY` turned
# out to be the SAME free-tier secret (proven by sha256 match --
# docs/evidence/2026-07-24-vl_rerun-credential-gate-blocked.md, PR #185) and
# no Vertex AI service-account path exists on this machine. This overlay
# routes the IDENTICAL model (google/gemini-2.5-flash-lite) through
# OpenRouter's PAID pass-through billing instead -- the model is unchanged,
# only the provider/billing route differs, so this is the closest possible
# rerun of the original experiment design, not a new one.
#
# Within-model design (unchanged from the original): ONE vision-language
# model runs two arms on the IDENTICAL v2 config (arena
# foundry_60_asym_v2 + PR #157 loadout v2). This is that model's own
# text-only baseline: the plain per-tick ``LLMPilot.decide`` prompt path
# (pilot.py::_serialize_observation), no image_attachment binding on the
# provider. Its twin, ``vision_foundry_60_asym_v2_openrouter_img.yaml``, is
# byte-identical to this file except for one added
# ``llm.providers[0].image_attachment`` block -- every other surface (arena,
# loadouts, personas, provider model/timeout/retry, state-root basename
# minus the arm suffix) is shared so the V-TEXT/V-IMG delta isolates exactly
# what the image buys.
#
# Deliberately NOT card mode -- see the original gemini_text overlay's header
# comment for the full rationale (image_attachment is wired into
# LLMPilot.decide, which the card-mode ProgrammingPilot never calls; omitting
# contracts.card_catalog routes both seats through the plain archetype: llm
# pilot-factory path). Pilot registry: contracts_data/pilots/vision_openrouter/.
#
# Provider deltas vs the blocked gemini_text/gemini_img pair:
# * provider binding: authenticated OpenAI-compatible OpenRouter endpoint at
#   https://openrouter.ai/api/v1/chat/completions, model pinned EXACTLY to
#   ``google/gemini-2.5-flash-lite`` (the PAID slug -- no ``:free`` suffix,
#   confirmed via a live GET https://openrouter.ai/api/v1/models on this
#   session: input_modalities include "image", pricing $0.10/M prompt tokens
#   / $0.40/M completion tokens, non-zero). This is the SAME model id used in
#   the original blocked experiment's direct-Google overlay, so the within-
#   model comparison this experiment depends on is preserved exactly; only
#   the transport/billing route changed.
# * ``secret_ref: secret://llm/openrouter`` with ``secret_resolver.kind:
#   injected``: resolved at the battery-driver edge from
#   ``OPEN_ROUTER_API_KEY`` (env or ~/.omnibase/.env) -- the real key never
#   appears in this file, argv, or any log. Account credit + billing
#   confirmed live this session via GET https://openrouter.ai/api/v1/credits
#   (paid balance present, not a free/zero-balance account).
# * ``max_tokens: 3072``: bumped up from the original blocked overlay's 2048
#   as a deliberate safety margin against CoT-budget truncation
#   (finish_reason=length before the decision JSON closes). This overlay is
#   NEW (never run to completion), so this is a proactive choice, not a
#   reaction to an observed truncation. A live smoke-test call against this
#   exact model/endpoint returned ``reasoning_tokens: 0`` (flash-lite does
#   not consume hidden thinking-token budget on OpenRouter by default), so
#   3072 is expected to be generous headroom for a single decide() action +
#   rationale, not a tight fit.
# * ``timeout_seconds: 120``: wider margin than the original 90s, matching
#   the ``tactical_split_overdeal_utility_asym_v1_gemma.yaml`` precedent for
#   an OpenRouter-routed provider.
# * ``retry: {max_attempts: 4, initial_backoff_seconds: 2.0,
#   backoff_multiplier: 2.0}``: same bounded exponential-backoff pattern as
#   the gemma OpenRouter overlay, copied because OpenRouter's pool can return
#   intermittent HTTP 429s; the SO OpenAI-compatible client already maps 429
#   to a RETRYABLE transport error and honors ``retry.max_attempts`` on this
#   UNSELECTED battery-driver composition path.
#
# Battery (per-seed isolated invocation, matched seeds across the V-TEXT/
# V-IMG twins for a paired within-model comparison):
#   uv run python scripts/run_ogate_objectives_battery.py \
#       --overlay contracts_data/overlays/vision_foundry_60_asym_v2_openrouter_text.yaml \
#       --red-loadout contracts_data/loadouts/vision_openrouter/berserker_scout_v2.yaml \
#       --blue-loadout contracts_data/loadouts/vision_openrouter/sniper_ironclad.yaml \
#       --expected-arena foundry_60_asym_v2 \
#       --n 1 --seed-base <seed-1> \
#       --state-root .onex_state/steel_onslaught/vl_or_text_battery
# with OPEN_ROUTER_API_KEY available in the environment or ~/.omnibase/.env.
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_openrouter_text/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_openrouter_text/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_openrouter_text/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_openrouter_text/lineage
  experiment_root: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_openrouter_text/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/vision_foundry_60_asym_v2_openrouter_text/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/vision_openrouter
  arena_id: foundry_60_asym_v2
llm:
  providers:
    - kind: openai_compatible
      provider_id: openrouter_vl
      endpoint_url: https://openrouter.ai/api/v1/chat/completions
      model: google/gemini-2.5-flash-lite
      secret_ref:
        kind: opaque
        ref: secret://llm/openrouter
      timeout_seconds: 120.0
      max_tokens: 3072
      retry:
        max_attempts: 4
        initial_backoff_seconds: 2.0
        backoff_multiplier: 2.0
      # V-TEXT arm: no image_attachment. This is the ONLY field that differs
      # from the V-IMG twin overlay's provider binding.
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.openrouter_vl_text
      display_name: Gemini 2.5 Flash-Lite (V-TEXT arm, OpenRouter)
      provider_binding_id: openrouter_vl
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: injected
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
