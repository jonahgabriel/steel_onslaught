# Brawler-recut v2 battery overlay (session 2026-07-24, combined declarative
# re-cut). NEW, additive overlay — the v1 overlay
# (``tactical_split_overdeal_utility_asym_v1_qwen.yaml``) is untouched.
#
# This overlay is the SAME U-GATE + O-GATE combined shape as the v1 overlay
# (design 2026-07-22 §5: asym objective arena + the third split-deck utility
# pile, over-deal 10 / program 5, no balance knob touched), rebound to the
# brawler-recut v2 pair:
#   - arena ``foundry_60_asym_v2`` (``contracts_data/arenas/
#     foundry_60_asym_v2.yaml``) — foundry_60_asym_v1's asymmetric cover
#     corridors + 3 objective cells + vp_threshold 15, PLUS two new mid-lane
#     cover blocks that break the sniper's previously unbroken end-to-end
#     sightline into three shorter segments; AND
#   - loadout pairing intended for this overlay: red =
#     ``loadout.llm.qwen35_berserker_v2`` (machine_gun + heat_lance swap,
#     see that file's budget-arithmetic comment block) vs blue =
#     ``loadout.llm.qwen35_sniper_ironclad`` (UNCHANGED — the sniper loadout
#     is not touched by this recut; only the arena and the brawler loadout
#     move). Loadouts are not referenced inside this overlay file itself —
#     they are bound at launch via ``--loadout-a``/``--loadout-b`` (``so
#     run``) or ``--red-loadout``/``--blue-loadout``
#     (``scripts/run_ogate_objectives_battery.py``), exactly as the v1
#     overlay is launched.
#
# The empirical question this rebinding lets the O-GATE battery answer: does
# breaking the sniper's sightline (arena v2) plus giving the brawler an
# armor-piercing medium-range answer (loadout v2) let red survive the
# approach AND win the post-arrival damage math against the sniper on
# ``foundry_60_asym_v2`` — where the v1 pairing lost ~all 30/30 matches to
# blue in the ugate_surfacing_fix_battery anchor run (2026-07-23)?
#
# Neither existing overlay, arena, nor loadout contract is modified —
# ``foundry_60``, ``foundry_60_asym_v1``, and
# ``loadout.llm.qwen35_berserker`` all stay byte-frozen so historical
# replays remain valid. Ledger paths are isolated under a NEW state
# directory so this recut battery does not collide with the asym-only,
# utility-only, or v1-combined lanes.
#
# The ``secret_resolver`` is ``none`` (not ``injected``): the sole provider is the
# keyless local Qwen endpoint (``secret_ref: null``), so this overlay launches
# directly from the CLI without a resolver capability:
#
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_v2_qwen.yaml \
#          --loadout-a contracts_data/loadouts/llm_qwen35_berserker_v2.yaml \
#          --loadout-b contracts_data/loadouts/qwen35/sniper_ironclad.yaml --seed 5001
#
# and the O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file>
# --expected-arena foundry_60_asym_v2 --red-loadout
# contracts_data/loadouts/llm_qwen35_berserker_v2.yaml`` (blue loadout stays
# the driver default, ``contracts_data/loadouts/qwen35/sniper_ironclad.yaml``).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v2_qwen/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v2_qwen/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v2_qwen/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v2_qwen/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v2_qwen/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_utility_asym_v2_qwen/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60_asym_v2
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  # Phase 2 — utility resolution handlers selected by this typed overlay
  # (design §6 Handlers row).  The full pack is named explicitly so the
  # runner's fail-closed ``select`` is driven by the overlay, not a hardcoded
  # default.  Narrowing this list (e.g. dropping ``utility.flares.v1``) would
  # make that kind fail closed at resolution time.
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    # Keyless: the only provider carries ``secret_ref: null``, so no resolver
    # capability is required.  ``none`` lets ``so run --overlay`` and the O-GATE
    # battery driver launch this overlay directly (``injected`` would raise
    # "requires a resolver capability" on the keyless CLI path).
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
