# Over-deal split-deck variant bound to qwen27 (Qwen3.6-27B-MTP, llama.cpp).
#
# Identical to ``tactical_split_overdeal_v1_qwen.yaml`` (the #128 battery
# overlay) EXCEPT the declared per-model deltas required by the qwen27
# endpoint — these are the cross-model design's B2 "differing ONLY in provider
# binding plus declared max_tokens/timeout deltas":
#
# * provider binding: llama.cpp endpoint on port 8001, model
#   Qwen3.6-27B-MTP-IQ4_XS.gguf, both seats (berserker red / sniper blue
#   personas, mirroring the #128 same-provider/different-persona shape).
# * ``max_tokens: 4096`` (vs 2048): llama.cpp routes chain-of-thought to
#   ``reasoning_content`` and only fills ``content`` after reasoning
#   completes; at 2048 the reasoning budget can starve the answer and return
#   an empty-but-"successful" completion. The battery's empty-content counter
#   is the tripwire for this failure mode.
# * ``timeout_seconds: 120`` (vs 45): reasoning tokens are generated before
#   any content appears (~93 tok/s observed on the 4090), so a 45 s timeout
#   would truncate legitimate completions.
#
# Every other surface (arena, decks, over-deal hand quotas, register count,
# cadence, rule pack, personas) is byte-identical to the qwen35 overlay so
# within-model contrasts stay comparable across models.
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_v1_qwen27/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_overdeal_v1_qwen27/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_v1_qwen27/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_v1_qwen27/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_v1_qwen27/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/tactical_split_overdeal_v1_qwen27/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen27
  arena_id: foundry_60
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          # Over-deal: deal 8 (4 movement + 4 weapon), program 5.
          hand_quota:
            movement: 4
            weapon: 4
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          # Over-deal: deal 8 (4 movement + 4 weapon), program 5.
          hand_quota:
            movement: 4
            weapon: 4
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen27_berserker
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen27_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen27
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8001/v1/chat/completions
      model: Qwen3.6-27B-MTP-IQ4_XS.gguf
      secret_ref: null
      timeout_seconds: 120.0
      max_tokens: 4096
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen27
      display_name: Qwen3.6-27B-MTP (AI PC 4090)
      provider_binding_id: qwen27
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: injected
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
