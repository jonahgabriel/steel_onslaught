# Pair-sweep arm P5 (mortar_r30 x red-dmg-x11, session 2026-07-24) battery
# overlay. NEW, additive overlay -- the v1 combined overlay, the standalone
# arm-1 overlay, and the P1/P2/P3/P4 arm overlays are all untouched.
#
# This overlay is the SAME U-GATE + O-GATE combined shape as the v1 overlay
# (design 2026-07-22 §5: asym objective arena + the third split-deck utility
# pile, over-deal 10 / program 5, no balance knob touched here in the
# overlay itself). This arm PAIRS two levers, exactly two, no more -- and is
# byte-identical to the P4 overlay except for the red loadout id, the
# dose-curve comment block, and the isolated ledger paths, so the ONLY
# experimental delta against P4 is the lethality dose (x8 -> x11):
#   - arena: ``foundry_60_asym_v1`` -- UNCHANGED, otherwise-stock (this arm
#     does not touch the arena).
#   - blue loadout: ``loadout.llm.qwen35_sniper_ironclad_mortar_r30``
#     (``contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml``) --
#     the shared mortar-range lever, HELD CONSTANT across P1/P2/P3/P4/P5:
#     swaps ONLY ``weapon.siege.artillery_mortar`` ->
#     ``weapon.siege.artillery_mortar_r30`` (range 50 -> 30, every other
#     weapon field identical). Bound via ``--blue-loadout`` at launch, not
#     referenced inside this overlay file.
#     CORRECTION (OMN-15119): this is a partial approach fix only --
#     ``harpoon_gun`` stays at range 30, uncapped, through P1-P7. Blue's
#     engagement envelope was never closed by this lever alone.
#   - red loadout: ``loadout.llm.qwen35_berserker_dmg11``
#     (``contracts_data/loadouts/llm_qwen35_berserker_dmg11.yaml``) -- the
#     lethality-dose lever: swaps both of the berserker's weapons for
#     damage-x11 variants (machine_gun 8->88, shrapnel_thrower 12->132),
#     every other weapon field identical. Bound via ``--red-loadout`` at
#     launch, not referenced inside this overlay file.
#
# Dose-curve position: this is the FIFTH point on the only axis that has
# moved outcome at all in the program, and it is a deliberate TEST of the P4
# doc's saturation hypothesis (docs/evidence/2026-07-24-pair_p4_dmg8-battery
# .md §0), not an attempt to reach COMPETITIVE. Confirmed prior points, all
# on this same overlay shape with mortar_r30 held constant: x1 (arm-1 alone)
# 0/30 = 0%; x3 (P1) 1/29 = 3.4% FAILED; x5.5 (P2) 5/29 = 17.2% DIRECTIONAL;
# x8 (P4) 8/29 = 27.6% DIRECTIONAL. The P4 doc's own engine-layer forensics
# showed blue's armor pool (armor_max=16) fully saturated (armor_after==0)
# on ALL 68/68 red-caused hits at x8 -- the leading hypothesis is that
# further raw-damage escalation on this axis buys diminishing marginal win
# rate because additional damage increasingly converts to overkill rather
# than shortening the kill sequence. This arm is pre-registered to test that
# prediction, not to chase a calibrated target: if x11 lands near or below
# x8's 27.6%, the hypothesis is supported; if it jumps substantially, the
# hypothesis is falsified and the damage axis still has room. Neither
# outcome is preferred.
#
# Neither the v1 overlay, the arm-1 overlay, the P1/P2/P3/P4 overlays, the
# arena contract, nor any baseline loadout is modified --
# ``foundry_60_asym_v1``, ``llm_qwen35_berserker.yaml``,
# ``qwen35/sniper_ironclad.yaml``, and ``qwen35/sniper_ironclad_mortar_r30
# .yaml`` all stay byte-frozen so historical replays remain valid. Ledger
# paths are isolated under a NEW state directory so this arm's battery does
# not collide with any other lane.
#
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_pair_p5_dmg11_qwen.yaml \
#          --loadout-a contracts_data/loadouts/llm_qwen35_berserker_dmg11.yaml \
#          --loadout-b contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml --seed 5001
#
# and the O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file>
# --red-loadout contracts_data/loadouts/llm_qwen35_berserker_dmg11.yaml
# --blue-loadout contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml
# --state-root .onex_state/steel_onslaught/pair_p5_dmg11``
# (--expected-arena stays the driver default, foundry_60_asym_v1).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/pair_p5_dmg11/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/pair_p5_dmg11/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/pair_p5_dmg11/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/pair_p5_dmg11/lineage
  experiment_root: ../../.onex_state/steel_onslaught/pair_p5_dmg11/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/pair_p5_dmg11/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60_asym_v1
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
