# Pair-sweep arm P6 (mortar_r30 x red-dmg-x16, session 2026-07-24) battery
# overlay. NEW, additive overlay -- the v1 combined overlay, the standalone
# arm-1 overlay, and the P1/P2/P3/P4/P5 arm overlays are all untouched.
#
# This overlay is the SAME U-GATE + O-GATE combined shape as the v1 overlay
# (design 2026-07-22 §5: asym objective arena + the third split-deck utility
# pile, over-deal 10 / program 5, no balance knob touched here in the
# overlay itself). This arm PAIRS two levers, exactly two, no more -- and is
# byte-identical to the P5 overlay except for the red loadout id, the
# dose-curve comment block, and the isolated ledger paths, so the ONLY
# experimental delta against P5 is the lethality dose (x11 -> x16):
#   - arena: ``foundry_60_asym_v1`` -- UNCHANGED, otherwise-stock (this arm
#     does not touch the arena).
#   - blue loadout: ``loadout.llm.qwen35_sniper_ironclad_mortar_r30``
#     (``contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml``) --
#     the shared mortar-range lever, HELD CONSTANT across P1/P2/P3/P4/P5/P6:
#     swaps ONLY ``weapon.siege.artillery_mortar`` ->
#     ``weapon.siege.artillery_mortar_r30`` (range 50 -> 30, every other
#     weapon field identical). Bound via ``--blue-loadout`` at launch, not
#     referenced inside this overlay file.
#     CORRECTION (OMN-15119): this is a partial approach fix only --
#     ``harpoon_gun`` stays at range 30, uncapped, through P1-P7. Blue's
#     engagement envelope was never closed by this lever alone.
#   - red loadout: ``loadout.llm.qwen35_berserker_dmg16``
#     (``contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml``) -- the
#     lethality-dose lever: swaps both of the berserker's weapons for
#     damage-x16 variants (machine_gun 8->128, shrapnel_thrower 12->192),
#     every other weapon field identical. Bound via ``--red-loadout`` at
#     launch, not referenced inside this overlay file.
#
# Dose-curve position and PRE-REGISTERED, FALSIFIABLE prediction (written
# BEFORE this battery ran, per operator instruction): the P5 doc
# (docs/evidence/2026-07-24-pair_p5_dmg11-battery.md) falsified the P4 doc's
# armor-saturation hypothesis -- x11 scored 13/30 = 43.3%, the first arm to
# cross the 0.35 COMPETITIVE band, and the corrected mechanism (fixed
# 16-point armor pool bounds absorption regardless of dose, so
# damage-after-armor tracks raw damage ~1:1 once the mitigation cap stops
# binding) predicts the damage axis is NOT spent. But a SEPARATE, different
# ceiling mechanism is now plausible and is what this arm is built to test:
# at x11, red's kill speed against blue hit EXACTLY 3 hits with ZERO
# variance across all 13 wins -- close to blue's own long-standing kill
# speed against red (~2-3 hits every arm in the program). Two competing,
# pre-registered predictions, in this operator's own words:
#
#   H1 (continued ~linear marginal rate): the five-point marginal-rate
#   series (1.72, 5.52, 4.14, 5.25 pp/unit across x1->x3->x5.5->x8->x11)
#   settles at roughly 4-5.5 pp/unit after the initial ramp. x16 is +5
#   dose-units over x11 (43.3%), so ~5pp/unit predicts roughly 65-70%.
#
#   H2 (kill-speed-parity ceiling): once both seats need a comparable
#   number of hits to kill, the match becomes a first-strike/initiative
#   race, and additional red lethality cannot buy much beyond winning that
#   race -- predicting an outcome asymptote near ~50%, not a continued
#   climb toward 65-70%.
#
# x16 is far enough past x11 to separate these two predictions. This arm
# does NOT pre-favor either -- report whichever is better supported, or
# report that n=30 cannot distinguish them (a fully acceptable answer).
#
# Neither the v1 overlay, the arm-1 overlay, the P1/P2/P3/P4/P5 overlays,
# the arena contract, nor any baseline loadout is modified --
# ``foundry_60_asym_v1``, ``llm_qwen35_berserker.yaml``,
# ``qwen35/sniper_ironclad.yaml``, and ``qwen35/sniper_ironclad_mortar_r30
# .yaml`` all stay byte-frozen so historical replays remain valid. Ledger
# paths are isolated under a NEW state directory so this arm's battery does
# not collide with any other lane.
#
#   so run --overlay contracts_data/overlays/tactical_split_overdeal_utility_asym_pair_p6_dmg16_qwen.yaml \
#          --loadout-a contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml \
#          --loadout-b contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml --seed 5001
#
# and the O-GATE battery driver selects it via
# ``scripts/run_ogate_objectives_battery.py --overlay <this file>
# --red-loadout contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml
# --blue-loadout contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml
# --state-root .onex_state/steel_onslaught/pair_p6_dmg16``
# (--expected-arena stays the driver default, foundry_60_asym_v1).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/pair_p6_dmg16/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/pair_p6_dmg16/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/pair_p6_dmg16/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/pair_p6_dmg16/lineage
  experiment_root: ../../.onex_state/steel_onslaught/pair_p6_dmg16/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/pair_p6_dmg16/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60_asym_v1
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          utility_deck_id: deck.utility.v1
          # Over-deal + utility: deal 10 (4 movement + 4 weapon + 2 utility),
          # program 5 — utility competes for the same registers.
          hand_quota:
            movement: 4
            weapon: 4
            utility: 2
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: []
  utility_handler_pack:
    kind: utility_resolution_handlers
    pack_id: utility.resolution.v1
    handler_ids:
      - utility.smoke.v1
      - utility.chaff.v1
      - utility.flares.v1
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      timeout_seconds: 45.0
      max_tokens: 2048
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    kind: none
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
