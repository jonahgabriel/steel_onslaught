# Round-3 "Moves-Scaled Evasion" A/B — TREATMENT arm (evasion ON).
#
# The ONLY gameplay/behavioural difference from the round-2 comparison arm
# (contracts_data/overlays/tactical_split_c11_qwen.yaml) is the single
# `contracts.moves_scaled_evasion` binding below: each MOVEMENT register a mech
# resolves in a card round raises its target_evasion for that round (harder to
# hit while a shooter is aiming), capped, decaying to 0 on a round it stops to
# shoot. Everything else — the c11 overpressure_cooldown handler, the round-2
# 5.5x brawler weapon damage, the raised LLM budget, decks, personas, arena — is
# identical, so this isolates EVASION as the one variable this round changes.
# (The ledger/leaderboard/learning paths are namespaced to
# tactical_split_moves_evasion_qwen so the two arms write separate sqlite
# ledgers, exactly as the c11 A/B arms differ — that is bookkeeping, not
# gameplay.)
# Launch either arm with the same command:
#   uv run so play --overlay contracts_data/overlays/<overlay>.yaml
# then compare the two ledgers (WEAPON_FIRED hit_probability on the moving
# brawler, blue/red DMG-OUT, shots-before-death, MATCH_ENDED win side).
schema_version: "1"
bus:
  kind: in_process
event_ledger:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_moves_evasion_qwen/events.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  event_schema: canonical_event_v1
leaderboard:
  kind: sqlite
  path: ../../.onex_state/steel_onslaught/tactical_split_moves_evasion_qwen/leaderboard.sqlite3
  journal_mode: WAL
  check_same_thread: false
  transaction_mode: autocommit
  storage_schema: leaderboard_v1
learning_artifacts:
  kind: filesystem_yaml
  evaluation_root: ../../.onex_state/steel_onslaught/tactical_split_moves_evasion_qwen/evaluations
  lineage_root: ../../.onex_state/steel_onslaught/tactical_split_moves_evasion_qwen/lineage
  experiment_root: ../../.onex_state/steel_onslaught/tactical_split_moves_evasion_qwen/experiments
evaluation_storage:
  kind: sqlite
  root: ../../.onex_state/steel_onslaught/tactical_split_moves_evasion_qwen/evaluation_storage
  journal_mode: WAL
  check_same_thread: true
  transaction_mode: autocommit
  event_schema: canonical_event_v1
  leaderboard_schema: leaderboard_v1
contracts:
  catalog_dir: ..
  pilot_registry_dir: ../pilots/fire_dense_qwen
  arena_id: foundry_60
  card_catalog:
    kind: filesystem_yaml
    cards_dir: ../cards
    decks_dir: ../decks
    card_mode_enabled: true
    deck_policy:
      schema_version: "0.1.0"
      kind: "steel_onslaught.card_deck_policy"
      seats:
        - side: red
          archetype: berserker
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          hand_quota:
            movement: 3
            weapon: 2
          register_count: 5
        - side: blue
          archetype: sniper
          movement_deck_id: deck.movement.v1
          weapon_deck_id: deck.weapon.v1
          hand_quota:
            movement: 2
            weapon: 3
          register_count: 5
    card_cadence: paced
    programmers:
      - side: red
        pilot_spec_id: pilot.llm.qwen35
        failure_policy: raise
      - side: blue
        pilot_spec_id: pilot.llm.qwen35_sniper
        failure_policy: raise
  balance_rule_pack:
    kind: card_programming_rules
    pack_id: rules.card_programming_v1
    handler_ids: ["overpressure_cooldown"]
  # Round-3 survivability knob (the ONLY gameplay difference vs the round-2 arm).
  # Conservative starting numbers (see PR body for the hit-chance arithmetic):
  # the brawler's hand quota is 3 movement/round, so a full-sprint approach round
  # caps at 3 x 0.08 = 0.24 evasion, shaving the mortar's ~0.70 mid-approach hit
  # chance to ~0.53 (~24% relative) while it is moving; a stationary brawler earns
  # 0 and stays as easy to hit as before. Start LOW — the live battery decides if
  # it needs to go up.
  moves_scaled_evasion:
    kind: moves_scaled_evasion
    evasion_per_move: 0.08
    cap: 0.24
llm:
  providers:
    - kind: openai_compatible
      provider_id: qwen35
      endpoint_url: http://omninode-pc.tail75df5e.ts.net:8000/v1/chat/completions
      model: Qwen3.6-35B-A3B
      secret_ref: null
      # Balance round 2 (abort-rate cut): round 1 lost ~40% of live-Qwen matches
      # to non-gameplay terminals — truncated JSON (finish_reason=length ->
      # aborted) or wall-clock timeout. Give keyless Qwen more room to emit one
      # complete, valid plan: a reasoning gateway can spend >2048 tokens before
      # the JSON object, and the larger budget needs proportionally more wall
      # time. (Paired with the +1 semantic reprompt in llm/programming.py.)
      timeout_seconds: 90.0
      max_tokens: 4096
      retry:
        max_attempts: 1
        initial_backoff_seconds: 0.0
        backoff_multiplier: 1.0
  model_identities:
    - schema_version: "1"
      kind: steel_onslaught.model_identity
      model_identity_id: model_identity.qwen35
      display_name: Qwen3.6-35B-A3B (AI PC 5090)
      provider_binding_id: qwen35
  personas_dir: ../pilots/personas
  secret_resolver:
    # The catalog launch path merges secret-bearing providers (for example the
    # GLM seats in contracts_data/model_catalogs/configured_v1.yaml) into this
    # overlay's provider set.  Declaring ``none`` refused to bind them and made
    # the default 60x60 split-deck board unlaunchable from the browser deck.
    kind: injected
clock:
  kind: system_utc
identity:
  kind: system
frontend_transport:
  kind: websocket
  contract: steel_onslaught.frontend_transport.v1
  websocket_url: ws://127.0.0.1:8765/events
  event_schema: canonical_event_v1
  milliseconds_per_tick: 500
