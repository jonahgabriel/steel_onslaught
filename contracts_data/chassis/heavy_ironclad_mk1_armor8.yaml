schema_version: "0.1.0"
kind: "steel_onslaught.chassis"
id: "chassis.heavy.ironclad_mk1_armor8"
display_name: "Heavy Ironclad Mk1 (Armor 8)"
# Pair-sweep arm P3 (mortar_r30 x blue-armor-8, session 2026-07-24):
# additive chassis variant of contracts_data/chassis/heavy_ironclad_mk1.yaml
# with EXACTLY ONE field changed -- constraints.base_armor 16 -> 8.
# runner.py::assemble_match_live seeds each mech's armor_value/armor_max
# directly from chassis.constraints.base_armor (see match/runner.py:1623-24),
# and reducers/damage.py::compute_armor_reduction caps per-hit absorption at
# min(armor_value, ceil(damage_raw * mitigation_cap)) -- so lowering
# base_armor is a genuine armor-side lethality lever, independent of any
# red-side damage buff. Every other field (max_mass, max_module_slots,
# max_boiler_volume, base_speed, base_turn_rate, base_signature,
# base_vent_rate, base_hp, base_armor_regen, compatibility, penalties) is
# byte-identical to the baseline heavy ironclad chassis.
# heavy_ironclad_mk1.yaml itself stays untouched -- this is a NEW chassis
# id, bound only via the P3 sniper loadout variant
# (contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30_armor8.yaml).
chassis_class: "heavy"
constraints:
  max_mass: 160
  max_module_slots: 8
  max_boiler_volume: 90
  base_speed: 2
  base_turn_rate: 2
  base_signature: 80
  base_vent_rate: 5
  base_hp: 160
  base_armor: 8
  base_armor_regen: 1
compatibility:
  weapon_classes:
    - "light"
    - "medium"
    - "heavy"
    - "siege"
  boiler_classes:
    - "industrial"
    - "volatile"
  mobility_classes:
    - "tracked"
    - "walker"
penalties:
  mode_switch_latency_modifier: 1.5
  sensor_lock_penalty: 1.0
  heat_weapon_vulnerability: 1.3
