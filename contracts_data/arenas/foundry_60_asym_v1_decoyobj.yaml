schema_version: "0.1.0"
kind: steel_onslaught.arena
display_name: The Foundry (Asymmetric, Decoy Objectives - SO-OBJ-DECOY)
arena_id: foundry_60_asym_v1_decoyobj
# SO-OBJ-DECOY isolating arm: objectives PRESENT in the observation space,
# NON-SCORING in the fold.
#
# WHAT THIS FILE IS: an exact copy of contracts_data/arenas/foundry_60_asym_v1.yaml
# with exactly ONE semantic change - `objective_scoring: decoy` - plus the
# arena_id/display_name identity change every sibling arena needs.  size,
# spawn_a, spawn_b, obstacles, every rect, both sudden-death parameters, ALL
# THREE objective cells, their vp_per_round, and vp_threshold: 15 are copied
# byte-for-byte from that file and MUST stay that way:
# tests/contracts/test_objdecoy_overlay.py asserts field-by-field equality
# INCLUDING the objectives tuple and the threshold, so an edit here that moves
# a rect or an objective cell fails CI.
#
# Note the contrast with the SCEN-OBJ control arena
# (contracts_data/arenas/foundry_60_asym_v1_noobj.yaml), which held geometry and
# REMOVED objectives.  This arena holds geometry AND objectives and removes only
# the payout.  The two arms together separate the two things "objectives" did.
#
# WHY IT EXISTS: docs/evidence/2026-07-25-scenobj-asym-noobj-battery.md §6a
# recorded that ASYM_OBJ produced only 2 objective_scored events in 30 matches
# and zero VP terminals - objectives were essentially NEVER CAPTURED - yet their
# removal was the larger of the two measured effects on utility keep-rate
# (red 0.055249 -> 0.017588, blue 0.165746 -> 0.087940).  That doc names the
# isolating arm it could not run: "objectives present in the observation space
# but non-scoring".  This is that arm.  If the objectives effect is carried by
# the STATED GOAL in the pilot's decision context, this arena reproduces the
# ASYM_OBJ keep-rate; if it is carried by REALIZED CAPTURE REWARD, it collapses
# to the ASYM_NOOBJ keep-rate.
#
# WHAT "decoy" DOES, precisely (src/steel_onslaught/contracts/arena.py,
# src/steel_onslaught/match/fold.py::MatchStateFold._score_objectives):
#   UNCHANGED - the pilot observation carries the three objective views (cell,
#     vp_per_round, viewer-relative control, own distance) and the VP scoreboard
#     (own_vp, enemy_vp, vp_threshold: 15); the programming prompt renders the
#     same `objectives` block with the same rule sentence, and the text pilot
#     renders the same OBJECTIVES section.  The serialized prompt is
#     byte-identical to a foundry_60_asym_v1 prompt at the same match state -
#     tests/contracts/test_objdecoy_overlay.py asserts exactly that.
#   SUPPRESSED - control of a cell awards no VP, no OBJECTIVE_SCORED event is
#     emitted, and no vp_threshold victory can be declared.  own_vp/enemy_vp
#     therefore read 0-0 for the whole match, and the terminal set is
#     elimination / sudden death / tick cap: the SAME terminal set the
#     ASYM_NOOBJ arm produced, and (empirically) the same set ASYM_OBJ produced,
#     which recorded zero VP terminals in 30 matches.
#
# FAIL-CLOSED INTERACTION: a `utility_incentive` (SO-UTIL-MECH) binding is
# REJECTED on this arena at composition and again at the MATCH_STARTED payload
# boundary - the bounty pays into vp_totals, and a decoy arena never settles
# vp_totals, so it would be a configured no-op.  Do not point an incentive
# overlay at this arena_id.
#
# Layout rationale, inherited verbatim from foundry_60_asym_v1.yaml.  Unlike the
# noobj control, every sentence below still describes a live part of this
# contract: the objective cells ARE here and ARE shown to the pilot.  Only the
# closing vp_threshold pacing sentence is counterfactual - with scoring
# suppressed no match ends by VP, so the tick-120 sudden-death backstop and the
# elimination path carry every terminal.
#   - Spawns face off on the horizontal mid-line: red brawler west (4,30),
#     blue sniper east (52,30), 48 Chebyshev apart.
#   - THE MID-LANE IS THE SIGHTLINE AXIS: row y=28..32 is kept obstacle-free
#     between x=8..48, so the sniper's mortar (0.80 acc <=20, 0.70 @35) and
#     harpoon (best <=10) genuinely defend at range along the east-west lane —
#     the 336-cell symmetric scatter of foundry_60 blocked 88% of shots and
#     helped nobody; here lanes are real.
#   - THE NORTH BAND IS THE APPROACH AXIS: a broken chain of 2-4 cell cover
#     clusters (x=8..34, y=17..25) gives the brawler a covered west-to-east
#     corridor with short exposed hops, closing toward the center objective
#     without living in the mortar lane.
#   - The south band is a second, thinner approach with wider gaps — faster
#     but riskier, flanking toward the east objective.
#   - Objectives ladder across the asymmetry: objective.west_yard (18,30)
#     sits IN the open lane near red (close for red, a long clean mortar lane
#     for blue — red can take it early but holds it under fire); .north_works
#     (30,22) anchors the covered corridor (contest decided up close, around
#     cover); .east_gate (42,36) sits in blue's harpoon defense band (deep
#     commitment for red).  Each objective has flanking cover within 3 cells
#     and at least one long clear lane, so both archetypes can play it.
#   - vp_threshold 15 at 1 VP/objective/round ends a controlled match in
#     ~8-15 scoring rounds — on gameplay, well before the tick-1000 failsafe
#     or the tick-120 sudden-death backstop.  COUNTERFACTUAL HERE: this arena
#     scores no rounds, so the threshold is a number the pilot READS and can
#     never reach.  That is the manipulation, stated plainly rather than hidden.
size: 60
spawn_a: {x: 4, y: 30}
spawn_b: {x: 52, y: 30}
obstacles: []
rects:
  # North approach corridor (west -> east cover chain)
  - {x0: 8, y0: 20, x1: 9, y1: 21}
  - {x0: 13, y0: 18, x1: 14, y1: 19}
  - {x0: 18, y0: 21, x1: 20, y1: 21}
  - {x0: 23, y0: 17, x1: 24, y1: 18}
  - {x0: 27, y0: 20, x1: 28, y1: 21}
  - {x0: 32, y0: 24, x1: 33, y1: 24}
  - {x0: 33, y0: 18, x1: 34, y1: 19}
  # Mid-lane flanking cover around objective.west_yard (18,30): the lane rows
  # y=28..32 stay clear; cover hugs the lane edges north and south.
  - {x0: 16, y0: 27, x1: 17, y1: 27}
  - {x0: 19, y0: 33, x1: 20, y1: 33}
  # East zone around objective.east_gate (42,36) — blue's defense band
  - {x0: 39, y0: 33, x1: 40, y1: 34}
  - {x0: 44, y0: 38, x1: 45, y1: 39}
  - {x0: 46, y0: 33, x1: 46, y1: 35}
  # South approach (sparser, wider hops)
  - {x0: 14, y0: 42, x1: 15, y1: 43}
  - {x0: 21, y0: 45, x1: 23, y1: 45}
  - {x0: 28, y0: 42, x1: 29, y1: 43}
  - {x0: 34, y0: 45, x1: 35, y1: 46}
  - {x0: 37, y0: 42, x1: 38, y1: 43}
  # West home-turf scatter (red side)
  - {x0: 10, y0: 25, x1: 11, y1: 25}
  - {x0: 9, y0: 35, x1: 10, y1: 36}
  # Blue-side scatter
  - {x0: 50, y0: 22, x1: 51, y1: 23}
  - {x0: 49, y0: 40, x1: 50, y1: 41}
  - {x0: 55, y0: 35, x1: 55, y1: 36}
objectives:
  - objective_id: objective.west_yard
    cell: {x: 18, y: 30}
    vp_per_round: 1
  - objective_id: objective.north_works
    cell: {x: 30, y: 22}
    vp_per_round: 1
  - objective_id: objective.east_gate
    cell: {x: 42, y: 36}
    vp_per_round: 1
vp_threshold: 15
# THE SINGLE SEMANTIC CHANGE vs foundry_60_asym_v1.yaml.  Everything above this
# line is byte-identical to that file except display_name/arena_id.
objective_scoring: decoy
sudden_death_start_tick: 120
sudden_death_damage_base: 8
