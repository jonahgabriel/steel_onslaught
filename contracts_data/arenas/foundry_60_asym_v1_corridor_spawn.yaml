schema_version: "0.1.0"
kind: steel_onslaught.arena
display_name: The Foundry (Asymmetric Objectives — Corridor Spawn)
arena_id: foundry_60_asym_v1_corridor_spawn
# Tournament arm 11 (corridor_spawn, session 2026-07-24): additive arena
# variant of contracts_data/arenas/foundry_60_asym_v1.yaml. foundry_60_asym_v1
# itself stays byte-untouched so historical replays remain valid; this is a
# NEW versioned arena id, bound only via this arm's own battery overlay
# (contracts_data/overlays/tactical_split_overdeal_utility_asym_v1_qwen_corridor_spawn.yaml).
#
# THE ONLY CHANGE: spawn_a moves from the open mid-lane sightline
# ((4,30), directly on the sniper's y=28..32 firing lane) into the mouth of
# the north approach corridor -- so the brawler starts its match already
# inside the covered corridor band (x=8..34, y=17..25) instead of having to
# cross open ground to reach it. Every other field (spawn_b, obstacles,
# rects, objectives, VP schedule, sudden-death timing) is byte-identical to
# foundry_60_asym_v1.
#
# DISPATCH COORDINATE CORRECTION (verified against every rect/objective in
# this file before landing, per the arm spec's explicit verification
# requirement): the dispatched spawn_a value {x: 8, y: 20} COLLIDES with the
# pre-existing obstacle rect {x0: 8, y0: 20, x1: 9, y1: 21} (cell (8,20) is
# a member of that rect) -- the arena contract's own layout validator
# rejects any spawn point that occupies an obstacle cell. CORRECTED to
# {x: 10, y: 22} -- the nearest clear cell inside the same corridor-mouth
# region (rects x=8..34, y=17..25) that:
#   - is not a member of any obstacle rect (checked against all 24 rects in
#     this file, including the 7 north-corridor rects that define the band
#     itself: {8,20,9,21}, {13,18,14,19}, {18,21,20,21}, {23,17,24,18},
#     {27,20,28,21}, {32,24,33,24}, {33,18,34,19});
#   - is not a member of the west home-turf scatter rect {10,25,11,25}
#     (y=25 vs the chosen y=22 -- no overlap, but checked explicitly since
#     it is the nearest scatter cover to the corridor mouth); and
#   - does not coincide with any objective cell (west_yard (18,30),
#     north_works (30,22), east_gate (42,36)) or with spawn_b (52,30).
# (10,22) sits two cells south-east of the first corridor cover cluster
# {8,20,9,21} and four cells west of the second cluster {13,18,14,19} --
# inside the covered band's footprint without occupying any of its cover
# cells.
size: 60
spawn_a: {x: 10, y: 22}
spawn_b: {x: 52, y: 30}
obstacles: []
