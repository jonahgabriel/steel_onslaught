schema_version: "0.1.0"
kind: steel_onslaught.arena
display_name: The Foundry (Asymmetric Objectives v1, SO-UTIL-THRESH vp_threshold=48)
arena_id: foundry_60_asym_v1_vpthresh48
# SO-UTIL-THRESH isolating arm: same arena as foundry_60_asym_v1, with ONLY
# vp_threshold raised 15 -> 48.
#
# WHAT THIS FILE IS: an exact copy of contracts_data/arenas/foundry_60_asym_v1.yaml
# with exactly ONE semantic change — vp_threshold 15 -> 48 — plus the
# arena_id/display_name identity change every sibling arena needs. size,
# spawn_a, spawn_b, obstacles, every rect, both sudden-death parameters, ALL
# THREE objective cells and their vp_per_round are copied byte-for-byte from
# that file and MUST stay that way.
#
# WHY THIS ARENA EXISTS — the vp-ladder payout-threshold confound
# (SO-UTIL-THRESH, docs/evidence/2026-07-25-util_incentive_vp6-battery.md
# §3/§7). The in-register VP bounty (`utility_incentive`,
# src/steel_onslaught/contracts/incentive.py, PR #201) pays victory points
# that COUNT TOWARD this arena's `vp_threshold: 15`. The dose ladder run
# against it — vp2 keep-rate 0.168129 (#205), vp4 0.211656 (#206),
# vp6 0.188017 (#209) — is an inverted-U: vp6 turned over below vp4.
# Undischarged confound: because bounty payouts count toward the win
# threshold, and `deploys-to-threshold = ceil(vp_threshold / vp_per_deploy)`
# shrinks as the price rises (vp2: ceil(15/2)=8, vp4: ceil(15/4)=4,
# vp6: ceil(15/6)=3), higher bounty levels can end matches on FEWER resolved
# deploys — mechanically truncating the drafting/keep opportunities the
# pooled keep-rate is measured over. The vp6 dip could be a
# payout-threshold-times-match-length artifact rather than a true interior
# optimum in incentive strength.
#
# THE MANIPULATION: hold `vp_per_deploy: 6` fixed (do not re-run the ladder;
# vary the OTHER term in the same formula) and raise `vp_threshold` so that
# `deploys-to-threshold` at vp6 matches the vp2 rung's own tier exactly:
# `ceil(48 / 6) = 8 = ceil(15 / 2)`. vp2 is the ladder's least-truncated,
# cleanest rung on this exact axis — it produced only 1 `vp_threshold`
# terminal in 30 matches (vs vp6's 12/30 at the baseline threshold) — so 48
# reproduces vp2's own structural relief condition at vp6's price, at the
# minimal threshold that does so (`ceil(T/6)=8` first holds at T=43; 48 is
# chosen as the clean multiple of 6 inside that band, `8 * 6 = 48`, so the
# tier boundary is exact and not a near-miss).
#
# WHAT IS UNCHANGED: vp_per_deploy stays 6 (the overlay
# tactical_split_overdeal_utility_asym_incentive_vp6_vpthresh48_qwen.yaml
# is otherwise byte-identical to the vp6 rung's own overlay below
# schema_version except this arena_id and the isolated ledger state root).
# Arena size, spawns, obstacles, rects, sudden-death parameters, objective
# cells and their vp_per_round are untouched — objective-VP contribution
# toward the threshold is therefore also unchanged, and the pre-registered
# per-match objective-VP-shortcut disclosure from the vp6 arm still applies
# unchanged at the higher threshold.
#
# PRE-REGISTRATION AND FORMAL CRITERION live in the overlay file (this
# arena carries no experimental logic of its own — vp_threshold is a plain
# int field, gt=0, no upper bound — src/steel_onslaught/contracts/arena.py).
#
# Layout rationale, inherited verbatim from foundry_60_asym_v1.yaml. The
# closing pacing sentence below is counterfactual here: at vp_threshold=48
# a controlled match needs up to 48 scoring rounds to end on VP, well past
# the ~8-15 rounds foundry_60_asym_v1 was tuned for — which is exactly the
# manipulation (raise deploys-to-threshold, not shorten the arena).
#
# Layout rationale (cover and objectives are ONE problem):
#   - Spawns face off on the horizontal mid-line: red brawler west (4,30),
#     blue sniper east (52,30), 48 Chebyshev apart.
#   - THE MID-LANE IS THE SIGHTLINE AXIS: row y=28..32 is kept obstacle-free
#     between x=8..48, so the sniper's mortar (0.80 acc <=20, 0.70 @35) and
#     harpoon (best <=10) genuinely defend at range along the east-west lane —
#     the 336-cell symmetric scatter of foundry_60 blocked 88% of shots and
#     helped nobody; here lanes are real.
#   - THE NORTH BAND IS THE APPROACH AXIS: a broken chain of 2-4 cell cover
#     clusters (x=8..34, y=17..25) gives the brawler a covered west-to-east
#     corridor with short exposed hops, closing toward the center objective
#     without living in the mortar lane.
#   - The south band is a second, thinner approach with wider gaps — faster
#     but riskier, flanking toward the east objective.
#   - Objectives ladder across the asymmetry: objective.west_yard (18,30)
#     sits IN the open lane near red (close for red, a long clean mortar lane
#     for blue — red can take it early but holds it under fire); .north_works
#     (30,22) anchors the covered corridor (contest decided up close, around
#     cover); .east_gate (42,36) sits in blue's harpoon defense band (deep
#     commitment for red).  Each objective has flanking cover within 3 cells
#     and at least one long clear lane, so both archetypes can play it.
#   - vp_threshold 15 at 1 VP/objective/round ends a controlled match in
#     ~8-15 scoring rounds — on gameplay, well before the tick-1000 failsafe
#     or the tick-120 sudden-death backstop.  COUNTERFACTUAL HERE: this
#     arena's vp_threshold is 48, not 15 (the single change this file makes).
