schema_version: "0.1.0"
kind: steel_onslaught.arena
display_name: The Foundry (Asymmetric, Masked Objectives - SO-OBJ-MASK)
arena_id: foundry_60_asym_v1_objmask
# SO-OBJ-MASK isolating arm: objectives genuinely SCORED by the engine
# (`objective_scoring` stays at its default "scoring"), but the
# objectives/victory_points VIEW is withheld from the pilot observation --
# `objective_display: masked`.
#
# WHAT THIS FILE IS: an exact copy of contracts_data/arenas/foundry_60_asym_v1.yaml
# with exactly ONE semantic change -- `objective_display: masked` -- plus the
# arena_id/display_name identity change every sibling arena needs.  size,
# spawn_a, spawn_b, obstacles, every rect, both sudden-death parameters, ALL
# THREE objective cells, their vp_per_round, and vp_threshold: 15 are copied
# byte-for-byte from that file and MUST stay that way:
# tests/contracts/test_objmask_overlay.py asserts field-by-field equality
# INCLUDING the objectives tuple and the threshold, so an edit here that moves
# a rect or an objective cell fails CI.
#
# WHY IT EXISTS: this is the live-stakes complement to SO-OBJ-DECOY
# (contracts_data/arenas/foundry_60_asym_v1_decoyobj.yaml, PR #210/#212).
# DECOY held the observation fixed and removed the payout (objectives shown,
# never paid; landed CAPTURE-ATTRIBUTABLE, g_pooled = 0.2115 --
# docs/evidence/2026-07-25-objdecoy-asym-battery.md).  This arena is the other
# half of the same 2x2: it holds the PAYOUT fixed -- the fold scores exactly
# as foundry_60_asym_v1 does, VP genuinely accrues, OBJECTIVE_SCORED and a VP
# victory are fully reachable -- and removes only what the pilot is TOLD.  If
# behaviour still tracks the (now invisible) real incentive, drafting on this
# arena should resemble the paying corner (foundry_60_asym_v1 /
# tactical_split_overdeal_utility_asym_v1_qwen.yaml); if visible feedback is
# the active ingredient independent of payout, it should collapse toward the
# no-objectives corner (foundry_60_asym_v1_noobj) -- the same pair of
# endpoints DECOY was scored against, approached from the opposite direction.
#
# WHAT "masked" DOES, precisely (src/steel_onslaught/contracts/arena.py,
# src/steel_onslaught/match/runner.py::MatchRunner.__init__):
#   UNCHANGED -- MatchStateFold._score_objectives never reads this field: a
#     mech holding an objective cell uncontested scores its vp_per_round every
#     round exactly as on foundry_60_asym_v1, OBJECTIVE_SCORED and (at
#     vp_threshold) VICTORY_DECLARED fire normally, and the match can end on
#     VP.
#   SUPPRESSED -- the runner passes `objectives=()`/`vp_threshold=None` into
#     every `build_pilot_observation`/`ReducerPilotTick` call instead of the
#     arena's real objectives/vp_threshold, so `ModelSOPilotObservation.
#     objectives` stays `()` and `.victory_points` stays `None` for the whole
#     match regardless of what the fold has actually scored.  Neither the
#     per-tick pilot prompt (`steel_onslaught.llm.pilot._serialize_
#     observation`) nor the whole-round programming prompt
#     (`steel_onslaught.llm.programming._serialize_programming_observation`)
#     ever renders an objectives/OBJECTIVES block, a VP scoreboard, an
#     objective cell, or a `vp_per_round`/`vp_threshold` number -- the
#     serialized prompt is byte-identical to an objective-free arena's prompt
#     at the same match state.
#
# FAIL-CLOSED, mirroring DECOY's own-field guard: `objective_display: masked`
# on an arena with no declared objectives is rejected at the contract
# boundary (masking a view that would already be empty is a no-op, not a
# mode) -- see `_validate_objectives` in `src/steel_onslaught/contracts/
# arena.py`.
#
# Layout rationale, inherited verbatim from foundry_60_asym_v1.yaml -- every
# sentence below still describes a live part of this contract, including the
# vp_threshold pacing paragraph: this arena scores exactly like the source
# arena, it simply never tells the pilot about it.
#   - Spawns face off on the horizontal mid-line: red brawler west (4,30),
#     blue sniper east (52,30), 48 Chebyshev apart.
#   - THE MID-LANE IS THE SIGHTLINE AXIS: row y=28..32 is kept obstacle-free
#     between x=8..48, so the sniper's mortar (0.80 acc <=20, 0.70 @35) and
#     harpoon (best <=10) genuinely defend at range along the east-west lane —
#     the 336-cell symmetric scatter of foundry_60 blocked 88% of shots and
#     helped nobody; here lanes are real.
#   - THE NORTH BAND IS THE APPROACH AXIS: a broken chain of 2-4 cell cover
#     clusters (x=8..34, y=17..25) gives the brawler a covered west-to-east
#     corridor with short exposed hops, closing toward the center objective
#     without living in the mortar lane.
#   - The south band is a second, thinner approach with wider gaps — faster
#     but riskier, flanking toward the east objective.
#   - Objectives ladder across the asymmetry: objective.west_yard (18,30)
#     sits IN the open lane near red (close for red, a long clean mortar lane
#     for blue — red can take it early but holds it under fire); .north_works
#     (30,22) anchors the covered corridor (contest decided up close, around
#     cover); .east_gate (42,36) sits in blue's harpoon defense band (deep
#     commitment for red).  Each objective has flanking cover within 3 cells
#     and at least one long clear lane, so both archetypes can play it.
#   - vp_threshold 15 at 1 VP/objective/round ends a controlled match in
#     ~8-15 scoring rounds — on gameplay, well before the tick-1000 failsafe
#     or the tick-120 sudden-death backstop.  This still applies exactly here:
#     a match on this arena reaches VP victory on the same schedule as
#     foundry_60_asym_v1; the pilot simply never sees the countdown.
size: 60
spawn_a: {x: 4, y: 30}
spawn_b: {x: 52, y: 30}
obstacles: []
rects:
  # North approach corridor (west -> east cover chain)
  - {x0: 8, y0: 20, x1: 9, y1: 21}
  - {x0: 13, y0: 18, x1: 14, y1: 19}
  - {x0: 18, y0: 21, x1: 20, y1: 21}
  - {x0: 23, y0: 17, x1: 24, y1: 18}
  - {x0: 27, y0: 20, x1: 28, y1: 21}
  - {x0: 32, y0: 24, x1: 33, y1: 24}
  - {x0: 33, y0: 18, x1: 34, y1: 19}
  # Mid-lane flanking cover around objective.west_yard (18,30): the lane rows
  # y=28..32 stay clear; cover hugs the lane edges north and south.
  - {x0: 16, y0: 27, x1: 17, y1: 27}
  - {x0: 19, y0: 33, x1: 20, y1: 33}
  # East zone around objective.east_gate (42,36) — blue's defense band
  - {x0: 39, y0: 33, x1: 40, y1: 34}
  - {x0: 44, y0: 38, x1: 45, y1: 39}
  - {x0: 46, y0: 33, x1: 46, y1: 35}
  # South approach (sparser, wider hops)
  - {x0: 14, y0: 42, x1: 15, y1: 43}
  - {x0: 21, y0: 45, x1: 23, y1: 45}
  - {x0: 28, y0: 42, x1: 29, y1: 43}
  - {x0: 34, y0: 45, x1: 35, y1: 46}
  - {x0: 37, y0: 42, x1: 38, y1: 43}
  # West home-turf scatter (red side)
  - {x0: 10, y0: 25, x1: 11, y1: 25}
  - {x0: 9, y0: 35, x1: 10, y1: 36}
  # Blue-side scatter
  - {x0: 50, y0: 22, x1: 51, y1: 23}
  - {x0: 49, y0: 40, x1: 50, y1: 41}
  - {x0: 55, y0: 35, x1: 55, y1: 36}
objectives:
  - objective_id: objective.west_yard
    cell: {x: 18, y: 30}
    vp_per_round: 1
  - objective_id: objective.north_works
    cell: {x: 30, y: 22}
    vp_per_round: 1
  - objective_id: objective.east_gate
    cell: {x: 42, y: 36}
    vp_per_round: 1
vp_threshold: 15
# THE SINGLE SEMANTIC CHANGE vs foundry_60_asym_v1.yaml.  Everything above
# this line is byte-identical to that file except display_name/arena_id.
# `objective_scoring` is deliberately left at its default ("scoring") --
# unlike DECOY, this arm keeps the engine paying VP.
objective_display: masked
sudden_death_start_tick: 120
sudden_death_damage_base: 8
