# 60x60 Foundry layout. Mechs start at opposite corners (4,4)/(55,55), so
# the line of engagement is the main diagonal and the spawn separation (51
# Chebyshev) creates a real approach phase.
#
# The sparse rects are authoritative terrain cells. Current movement and
# line-of-sight keep the existing wall/blocking semantics; cover penalties,
# clamber costs, and degraded sensor/weapon behavior remain a follow-up slice.
#
# The map is intentionally symmetric across the main diagonal and under 180
# degree rotation about the centre, with spawn pockets kept clear.
