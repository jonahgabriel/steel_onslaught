schema_version: "0.1.0"
kind: steel_onslaught.loadout
id: loadout.llm.qwen35_sniper_ironclad_mortar_cd9
# Tournament arm 3 (mortar_cd9, session 2026-07-24): additive loadout
# variant of qwen35/sniper_ironclad.yaml with EXACTLY ONE module swap --
# weapon.siege.artillery_mortar -> weapon.siege.artillery_mortar_cd9
# (cooldown_ticks 5 -> 9, every other weapon field identical -- see that
# file). Every other module and field (chassis, boiler, pilot, harpoon_gun,
# sensors, gizmos, budgets) is byte-identical to the baseline sniper
# loadout. qwen35/sniper_ironclad.yaml itself stays untouched.
#
# Budget note: weapon module contracts carry no mass field --
# match/runner.py::_module_budgets hardcodes mass=0 for every weapon, and
# cooldown_ticks does not feed the MASS/SLOTS/PRESSURE budget axes at all --
# so swapping to the slower-cooldown mortar variant changes zero budget
# arithmetic. Declared budgets below are therefore identical to the
# baseline sniper loadout.
chassis_id: chassis.heavy.ironclad_mk1
boiler_id: boiler.industrial.bessemer_90
pilot_id: pilot.llm.qwen35_sniper
modules:
  weapons:
    - weapon.siege.artillery_mortar_cd9
    - weapon.heavy.harpoon_gun
  sensors:
    - sensor.long_range_radar
    - sensor.short_range_scanner
  cooling: []
  armor: []
  gizmos:
    - gizmo.cooling.emergency_condenser
    - gizmo.efficiency.efficient_regulator
budgets:
  points_used: 96
  points_max: 100
  mass_used: 112
  mass_max: 160
  slots_used: 6
  slots_max: 8
  expected_heat_peak: 22
  expected_signature: 92
