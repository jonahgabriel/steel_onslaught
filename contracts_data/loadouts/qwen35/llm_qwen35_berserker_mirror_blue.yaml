# OMN-15488 -- mirror-pairing loadout, blue seat.
#
# Byte-identical to contracts_data/loadouts/llm_qwen35_berserker.yaml on every
# field EXCEPT ``id`` and ``pilot_id`` (chassis_id/boiler_id/modules/budgets
# unchanged) -- the L-GATE-2 decisive battery's mirror opponent (player.blue)
# flies the SAME berserker chassis as the learning seat (player.red). See
# contracts_data/pilots/fire_dense_qwen/llm_qwen35_berserker_mirror_blue.yaml
# for why ``pilot_id`` must point at a distinct (but functionally identical)
# pilot spec rather than reusing ``pilot.llm.qwen35`` verbatim.
#
# Lives in this ``qwen35/`` subdirectory (alongside ``sniper_ironclad.yaml``),
# NOT the top-level ``contracts_data/loadouts/`` dir: its ``pilot_id`` is
# registered only in ``contracts_data/pilots/fire_dense_qwen/`` (this
# overlay's own ``pilot_registry_dir``), not in the top-level
# ``contracts_data/pilots/`` registry that
# ``tests/contracts/test_pilot_registry.py``'s pinned census walks -- the
# same reason ``sniper_ironclad.yaml`` (``pilot.llm.qwen35_sniper``) lives
# here rather than at the top level.
schema_version: "0.1.0"
kind: steel_onslaught.loadout
id: loadout.llm.qwen35_berserker_mirror_blue
chassis_id: chassis.light.scout_mk1
boiler_id: boiler.compact.v1
pilot_id: pilot.llm.qwen35_berserker_mirror_blue
modules:
  weapons: [weapon.light.machine_gun, weapon.light.shrapnel_thrower]
  sensors: [sensor.short_range_scanner]
  cooling: []
  armor: []
  gizmos: []
budgets:
  points_used: 40
  points_max: 100
  mass_used: 30
  mass_max: 60
  slots_used: 3
  slots_max: 4
  expected_heat_peak: 30
  expected_signature: 35
