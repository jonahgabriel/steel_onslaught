schema_version: "0.1.0"
kind: steel_onslaught.loadout
id: loadout.llm.qwen35_sniper_ironclad_mortar_r15
# SO-RANGECAP arm (mortar_r15, session 2026-07-25): additive loadout
# variant of contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml
# with EXACTLY ONE module swap -- weapon.siege.artillery_mortar_r30 ->
# weapon.siege.artillery_mortar_r15 (range 30 -> 15, every other weapon
# field identical -- see that file). Every other module and field
# (chassis, boiler, pilot, harpoon_gun, sensors, gizmos, budgets) is
# byte-identical to both qwen35/sniper_ironclad.yaml and
# qwen35/sniper_ironclad_mortar_r30.yaml. Neither of those files, nor
# artillery_mortar.yaml nor artillery_mortar_r30.yaml, is modified by
# this one.
#
# Budget note: weapon module contracts carry no mass field --
# match/runner.py::_module_budgets hardcodes mass=0 for every weapon, and
# range/cooldown/accuracy do not feed the MASS/SLOTS/PRESSURE budget axes
# at all -- so swapping to the further-range-capped mortar variant changes
# zero budget arithmetic. Declared budgets below are therefore identical
# to the baseline sniper loadout and to the mortar_r30 loadout.
chassis_id: chassis.heavy.ironclad_mk1
boiler_id: boiler.industrial.bessemer_90
pilot_id: pilot.llm.qwen35_sniper
modules:
  weapons:
    - weapon.siege.artillery_mortar_r15
    - weapon.heavy.harpoon_gun
  sensors:
    - sensor.long_range_radar
    - sensor.short_range_scanner
  cooling: []
  armor: []
  gizmos:
    - gizmo.cooling.emergency_condenser
    - gizmo.efficiency.efficient_regulator
budgets:
  points_used: 96
  points_max: 100
  mass_used: 112
  mass_max: 160
  slots_used: 6
  slots_max: 8
  expected_heat_peak: 22
  expected_signature: 92
