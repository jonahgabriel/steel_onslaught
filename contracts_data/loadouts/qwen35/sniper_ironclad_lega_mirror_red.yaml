# OMN-15488 leg (a) -- MIRROR loadout (player.red).
#
# Byte-identical to sniper_ironclad_lega_blue.yaml on every field EXCEPT
# ``id`` and ``pilot_id`` -- prereg §2.3 item 3, and the red battery's own
# mirror-loadout precedent. The mirror opponent flies the SAME sniper-ironclad
# chassis, boiler, weapons, sensors, gizmos, and budgets as the learning seat;
# only the pilot spec differs, and only in its ``provider`` label
# (``qwen35_sniper_mirror_red``), which is what
# ``validate_seat_programmer_identity`` requires to admit an ANNOUNCED mirror.
#
# This is what makes §4.7's "win rate says nothing about the hypothesis"
# structurally true: with both seats on identical chassis and persona, the
# only asymmetry in the match is side identity, spawn, initiative tie-break,
# and -- in the post phase -- the learning seat's promoted policy.
schema_version: "0.1.0"
kind: steel_onslaught.loadout
id: loadout.llm.qwen35_sniper_ironclad_lega_mirror_red
chassis_id: chassis.heavy.ironclad_mk1
boiler_id: boiler.industrial.bessemer_90
pilot_id: pilot.llm.qwen35_sniper_mirror_red
modules:
  weapons:
    - weapon.siege.artillery_mortar
    - weapon.heavy.harpoon_gun
  sensors:
    - sensor.long_range_radar
    - sensor.short_range_scanner
  cooling: []
  armor: []
  gizmos:
    - gizmo.cooling.emergency_condenser
    - gizmo.efficiency.efficient_regulator
budgets:
  points_used: 96
  points_max: 100
  mass_used: 112
  mass_max: 160
  slots_used: 6
  slots_max: 8
  expected_heat_peak: 22
  expected_signature: 92
