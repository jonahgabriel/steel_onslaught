schema_version: "0.1.0"
kind: steel_onslaught.loadout
id: loadout.llm.qwen35_sniper_ironclad_mortar_r30_armor8
# Pair-sweep arm P3 (mortar_r30 x blue-armor-8, session 2026-07-24):
# additive loadout variant of
# contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml (itself the
# approach-fix loadout: weapon.siege.artillery_mortar ->
# weapon.siege.artillery_mortar_r30, range 50 -> 30) with EXACTLY ONE
# further field changed -- chassis_id chassis.heavy.ironclad_mk1 ->
# chassis.heavy.ironclad_mk1_armor8 (base_armor 16 -> 8, every other
# chassis field identical -- see that file). Weapons stay the mortar_r30
# approach-fix pair (weapon.siege.artillery_mortar_r30 +
# weapon.heavy.harpoon_gun); every other module and field (boiler, pilot,
# sensors, gizmos, budgets) is byte-identical to the mortar_r30 loadout.
# Neither qwen35/sniper_ironclad.yaml nor
# qwen35/sniper_ironclad_mortar_r30.yaml is modified.
#
# Budget note: chassis constraints (max_mass/max_module_slots/etc.) are
# byte-identical between chassis.heavy.ironclad_mk1 and
# chassis.heavy.ironclad_mk1_armor8 -- only base_armor changed, and
# base_armor does not feed the MASS/SLOTS/PRESSURE budget axes
# (validate_loadout_budgets checks module mass/slots/pressure/heat/signature
# against chassis+boiler capacity, not chassis.constraints.base_armor).
# Declared budgets below are therefore identical to the mortar_r30 loadout.
chassis_id: chassis.heavy.ironclad_mk1_armor8
boiler_id: boiler.industrial.bessemer_90
pilot_id: pilot.llm.qwen35_sniper
modules:
  weapons:
    - weapon.siege.artillery_mortar_r30
    - weapon.heavy.harpoon_gun
  sensors:
    - sensor.long_range_radar
    - sensor.short_range_scanner
  cooling: []
  armor: []
  gizmos:
    - gizmo.cooling.emergency_condenser
    - gizmo.efficiency.efficient_regulator
budgets:
  points_used: 96
  points_max: 100
  mass_used: 112
  mass_max: 160
  slots_used: 6
  slots_max: 8
  expected_heat_peak: 22
  expected_signature: 92
