schema_version: "0.1.0"
kind: steel_onslaught.loadout
id: loadout.llm.qwen35_berserker_dmg55
# Pair-sweep arm P2 (mortar_r30 x red-dmg-x5.5, session 2026-07-24):
# additive loadout variant of llm_qwen35_berserker.yaml with EXACTLY ONE
# module swap per weapon slot -- weapon.light.machine_gun ->
# weapon.light.machine_gun_dmg55 and weapon.light.shrapnel_thrower ->
# weapon.light.shrapnel_thrower_dmg55 (damage x5.5 on both, the historical
# single-lever dose that scored ~5% under the old lethal approach, now
# paired with the mortar_r30 approach fix -- every other weapon field
# identical, see those files). Every other module and field (chassis,
# boiler, pilot, sensors, cooling, armor, gizmos, budgets) is
# byte-identical to the baseline berserker loadout. llm_qwen35_berserker.yaml
# itself stays untouched.
#
# Budget note: weapon module contracts carry no mass field --
# match/runner.py::_module_budgets hardcodes mass=0 for every weapon, and
# damage does not feed the MASS/SLOTS/PRESSURE budget axes at all -- so
# swapping to the damage-x5.5 variants changes zero budget arithmetic.
# Declared budgets below are therefore identical to the baseline berserker
# loadout.
chassis_id: chassis.light.scout_mk1
boiler_id: boiler.compact.v1
pilot_id: pilot.llm.qwen35
modules:
  weapons: [weapon.light.machine_gun_dmg55, weapon.light.shrapnel_thrower_dmg55]
  sensors: [sensor.short_range_scanner]
  cooling: []
  armor: []
  gizmos: []
budgets:
  points_used: 40
  points_max: 100
  mass_used: 30
  mass_max: 60
  slots_used: 3
  slots_max: 4
  expected_heat_peak: 30
  expected_signature: 35
