# (contracts_data/loadouts/vision_gemini/sniper_ironclad.yaml), itself a
# mirror of the qwen35 sniper loadout -- v1 unchanged, since PR #157's re-cut
# only touched the brawler/red seat. Only ``id``/``pilot_id`` differ,
# pointing at the OpenRouter vision-experiment pilot registry.
chassis_id: chassis.heavy.ironclad_mk1
boiler_id: boiler.industrial.bessemer_90
pilot_id: pilot.llm.openrouter_vl_sniper
modules:
  weapons:
    - weapon.siege.artillery_mortar
    - weapon.heavy.harpoon_gun
  sensors:
    - sensor.long_range_radar
    - sensor.short_range_scanner
  cooling: []
  armor: []
  gizmos:
    - gizmo.cooling.emergency_condenser
    - gizmo.efficiency.efficient_regulator
budgets:
  points_used: 96
  points_max: 100
  mass_used: 112
  mass_max: 160
  slots_used: 6
  slots_max: 8
  expected_heat_peak: 22
  expected_signature: 92
