schema_version: "1"
kind: steel_onslaught.player_roster
roster_id: roster.tactical_v1_openrouter
options:
  - kind: human
    option_id: player_option.local_human_sniper
    display_name: Local human — Sniper seat
    human_identity_id: human_identity.local_operator
    pilot_spec_id: pilot.openrouter.sniper
    input_source: browser_command
  - kind: human
    option_id: player_option.local_human_opportunist
    display_name: Local human — Opportunist seat
    human_identity_id: human_identity.local_operator
    pilot_spec_id: pilot.openrouter.opportunist
    input_source: browser_command
  - kind: model
    option_id: player_option.openrouter_sniper
    display_name: OpenRouter Free — Sniper
    model_identity_id: model_identity.openrouter
    pilot_spec_id: pilot.openrouter.sniper
    persona_id: sniper
    input_source: llm_completion
  - kind: model
    option_id: player_option.openrouter_opportunist
    display_name: OpenRouter Free — Opportunist
    model_identity_id: model_identity.openrouter
    pilot_spec_id: pilot.openrouter.opportunist
    persona_id: opportunist
    input_source: llm_completion
seats:
  - side: red
    loadout_id: loadout.tactical.openrouter_sniper_ironclad
    default_option_id: player_option.openrouter_sniper
    allowed_option_ids:
      - player_option.local_human_sniper
      - player_option.openrouter_sniper
  - side: blue
    loadout_id: loadout.tactical.openrouter_opportunist_hunter
    default_option_id: player_option.openrouter_opportunist
    allowed_option_ids:
      - player_option.local_human_opportunist
      - player_option.openrouter_opportunist
