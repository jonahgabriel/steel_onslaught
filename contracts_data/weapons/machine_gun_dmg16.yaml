schema_version: "0.1.0"
kind: steel_onslaught.weapon
id: weapon.light.machine_gun_dmg16
display_name: "Steam Machine Gun (Damage x16)"
# Pair-sweep arm P6 (mortar_r30 x red-dmg-x16, session 2026-07-24):
# additive weapon variant of contracts_data/weapons/machine_gun.yaml with
# EXACTLY ONE field changed -- damage 8 -> 128 (x16, the next dose above the
# confirmed 0% (x1) -> 3.4% (x3) -> 17.2% (x5.5) -> 27.6% (x8) -> 43.3% (x11)
# curve; paired here with the mortar_r30 approach fix held constant, exactly
# as in P1/P2/P4/P5). Every other field (range, pressure_cost,
# heat_generated, cooldown_ticks, accuracy_curve, target_class_effectiveness,
# damage_type, compatibility) is byte-identical to the baseline machine gun.
# machine_gun.yaml itself stays untouched -- this is a NEW weapon id, bound
# only via the P6 berserker loadout variant
# (contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml).
#
# This arm pre-registers TWO competing hypotheses (see the overlay's own
# header comment for the full rationale) instead of a single point
# prediction: H1 (continued ~linear marginal rate, ~5pp/unit) predicts
# roughly 65-70%; H2 (kill-speed-parity ceiling -- red's kill speed already
# hit exactly 3 hits with zero variance at x11, close to blue's ~2-3)
# predicts an asymptote near ~50%. This dose is far enough past x11 to
# separate the two predictions.
#
# Engine-layer dose prediction (for the verifier to check against the
# reconstructed per-hit raw damage, per the P1/P2/P4/P5 method): blue is
# chassis_class=heavy, so target_class_effectiveness.heavy=0.7 applies and
# damage_raw = int(128 x 0.7) = 89, against the baseline int(8 x 0.7) = 5
# -> 17.8x observed ratio (int() truncation on the baseline side inflates
# the ratio above the nominal 16x, the same artifact documented in
# P1/P2/P4/P5).
weapon_class: light
range: 12
damage: 128
pressure_cost: 4
heat_generated: 3
cooldown_ticks: 1
accuracy_curve:
  - range: 0
    hit_probability: 0.95
  - range: 5
    hit_probability: 0.85
  - range: 10
    hit_probability: 0.65
  - range: 12
    hit_probability: 0.50
target_class_effectiveness:
  light: 1.2
  medium: 1.0
  heavy: 0.7
damage_type: standard
compatibility:
  compatible_chassis_classes:
    - light
    - medium
