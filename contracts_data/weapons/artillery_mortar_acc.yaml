schema_version: "0.1.0"
kind: steel_onslaught.weapon
id: weapon.siege.artillery_mortar_acc
display_name: "Artillery Mortar (Far-Band Accuracy Nerf)"
# Tournament arm 4 (mortar_acc, session 2026-07-24) -- CONDITIONAL ARM, only
# battery-run if arm 1 (mortar_r30) undershoots. Additive weapon variant of
# contracts_data/weapons/artillery_mortar.yaml with EXACTLY ONE field
# changed -- the far-band accuracy_curve entries (range 35/45/50) nerfed
# while the near-band point (range 20, hit_probability 0.80) stays
# identical. Every other field (range, damage, cooldown_ticks,
# heat_generated, pressure_cost, target_class_effectiveness, damage_type,
# compatibility) is byte-identical to the baseline mortar.
# artillery_mortar.yaml itself stays untouched -- this is a NEW weapon id,
# bound only via the arm's own sniper loadout variant
# (contracts_data/loadouts/qwen35/sniper_ironclad_mortar_acc.yaml).
#
# CAUSAL HYPOTHESIS: unlike arm 1 (hard range cap at 30), this lever leaves
# the mortar's max range at 50 but makes long-range shots progressively less
# reliable (0.70->0.35 @35, 0.55->0.25 @45, 0.40->0.15 @50) while the
# close-in shot (<=20, 0.80) is untouched -- a "soft" accuracy nerf rather
# than a hard range cutoff, isolating whether hit-probability degradation
# alone (independent of whether the weapon can fire at all) changes the
# outcome.
weapon_class: siege
range: 50
damage: 45
pressure_cost: 20
heat_generated: 15
cooldown_ticks: 5
accuracy_curve:
  - range: 20
    hit_probability: 0.80
  - range: 35
    hit_probability: 0.35
  - range: 45
    hit_probability: 0.25
  - range: 50
    hit_probability: 0.15
target_class_effectiveness:
  light: 0.9
  medium: 1.0
  heavy: 1.3
damage_type: standard
compatibility:
  compatible_chassis_classes:
    - heavy
