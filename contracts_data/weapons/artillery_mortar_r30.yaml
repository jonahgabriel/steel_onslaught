schema_version: "0.1.0"
kind: steel_onslaught.weapon
id: weapon.siege.artillery_mortar_r30
display_name: "Artillery Mortar (Range 30)"
# Tournament arm 1 (mortar_r30, session 2026-07-24): additive weapon variant
# of contracts_data/weapons/artillery_mortar.yaml with EXACTLY ONE field
# changed -- range 50 -> 30. Every other field (damage, cooldown_ticks,
# heat_generated, pressure_cost, accuracy_curve, target_class_effectiveness,
# damage_type, compatibility) is byte-identical to the baseline mortar.
# artillery_mortar.yaml itself stays untouched -- this is a NEW weapon id,
# bound only via the arm's own sniper loadout variant
# (contracts_data/loadouts/qwen35/sniper_ironclad_mortar_r30.yaml).
#
# CAUSAL HYPOTHESIS: the sniper's mortar (range 50) out-ranges the brawler's
# entire kit and the arena's own sightline lane (x=8..48, 40 cells) end to
# end, so the brawler is under aimed mortar fire for effectively the whole
# approach regardless of arena cover. Capping mortar range to 30 -- inside
# the lane's own span -- forces the sniper to give up standoff range on part
# of the approach, without touching accuracy, damage, or cooldown (so any
# outcome shift is attributable to range alone, not a combined nerf).
weapon_class: siege
range: 30
damage: 45
pressure_cost: 20
heat_generated: 15
cooldown_ticks: 5
accuracy_curve:
  - range: 20
    hit_probability: 0.80
  - range: 35
    hit_probability: 0.70
  - range: 45
    hit_probability: 0.55
  - range: 50
    hit_probability: 0.40
target_class_effectiveness:
  light: 0.9
  medium: 1.0
  heavy: 1.3
damage_type: standard
compatibility:
  compatible_chassis_classes:
    - heavy
