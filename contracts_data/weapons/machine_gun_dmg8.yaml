schema_version: "0.1.0"
kind: steel_onslaught.weapon
id: weapon.light.machine_gun_dmg8
display_name: "Steam Machine Gun (Damage x8)"
# Pair-sweep arm P4 (mortar_r30 x red-dmg-x8, session 2026-07-24):
# additive weapon variant of contracts_data/weapons/machine_gun.yaml with
# EXACTLY ONE field changed -- damage 8 -> 64 (x8, the next dose above the
# confirmed 0% (x1) -> 3.4% (x3) -> 17.2% (x5.5) monotonic, accelerating
# curve; paired here with the mortar_r30 approach fix held constant, exactly
# as in P1/P2). Every other field (range, pressure_cost, heat_generated,
# cooldown_ticks, accuracy_curve, target_class_effectiveness, damage_type,
# compatibility) is byte-identical to the baseline machine gun.
# machine_gun.yaml itself stays untouched -- this is a NEW weapon id, bound
# only via the P4 berserker loadout variant
# (contracts_data/loadouts/llm_qwen35_berserker_dmg8.yaml).
#
# Engine-layer dose prediction (for the verifier to check against the
# reconstructed per-hit raw damage, per the P1/P2 method): blue is
# chassis_class=heavy, so target_class_effectiveness.heavy=0.7 applies and
# damage_raw = int(64 x 0.7) = 44, against the baseline int(8 x 0.7) = 5
# -> 8.80x observed ratio (int() truncation on the baseline side inflates
# the ratio above the nominal 8x, the same artifact documented in P1/P2).
weapon_class: light
range: 12
damage: 64
pressure_cost: 4
heat_generated: 3
cooldown_ticks: 1
accuracy_curve:
  - range: 0
    hit_probability: 0.95
  - range: 5
    hit_probability: 0.85
  - range: 10
    hit_probability: 0.65
  - range: 12
    hit_probability: 0.50
target_class_effectiveness:
  light: 1.2
  medium: 1.0
  heavy: 0.7
damage_type: standard
compatibility:
  compatible_chassis_classes:
    - light
    - medium
