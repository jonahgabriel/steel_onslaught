schema_version: "0.1.0"
kind: steel_onslaught.weapon
id: weapon.light.shrapnel_thrower
display_name: "Shrapnel Thrower"
weapon_class: light
range: 8
# Balance round 2 (brawler damage buff): 12 -> 66 (5.5x, matching machine_gun so
# attribution stays clean — only damage changed this round). Shrapnel is the
# short-range (8) finisher: the brawler must close into the mortar kill zone to
# use it, so it hits harder per shot than the machine gun. Arithmetic against the
# real degrading-armor model (heavy target_class_effectiveness 0.6, STANDARD cap
# 0.75, sniper armor 16 pool / regen 1/tick): damage_raw = int(66*0.6)=39; a
# fresh-armor hit nets 39-16=23, a steady-state hit nets ~36. So ~5-6 landed
# shrapnel hits kill the sniper — a real skill test (survive the approach AND
# land), never a one-shot (max single hit 39 << 160).
damage: 66
pressure_cost: 6
heat_generated: 5
cooldown_ticks: 2
accuracy_curve:
  - range: 0
    hit_probability: 0.90
  - range: 4
    hit_probability: 0.80
  - range: 6
    hit_probability: 0.65
  - range: 8
    hit_probability: 0.45
target_class_effectiveness:
  light: 1.4
  medium: 0.9
  heavy: 0.6
damage_type: standard
compatibility:
  compatible_chassis_classes:
    - light
    - medium
