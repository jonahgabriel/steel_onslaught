schema_version: "0.1.0"
kind: steel_onslaught.weapon
id: weapon.siege.artillery_mortar
display_name: "Artillery Mortar"
weapon_class: siege
range: 50
damage: 45
pressure_cost: 20
# c11 Overpressure Cooldown: heat_generated 15->20 so sustained artillery+harpoon
# fire accumulates heat toward the Bessemer-90 lockout ceiling (28) and forces a
# vent. Chosen by a measured 24-seed sweep (see PR body): at this level the
# overpressure handler holds peak sniper heat ~36 (below redline 80, no rupture)
# while the same economy WITHOUT the handler climbs to ~51 — the self-regulating
# duty cycle the panel wanted, not a self-immolation. This is the sniper rate-tax.
heat_generated: 20
cooldown_ticks: 5
accuracy_curve:
  - range: 20
    hit_probability: 0.80
  - range: 35
    hit_probability: 0.70
  - range: 45
    hit_probability: 0.55
  - range: 50
    hit_probability: 0.40
target_class_effectiveness:
  light: 0.9
  medium: 1.0
  heavy: 1.3
damage_type: standard
compatibility:
  compatible_chassis_classes:
    - heavy
