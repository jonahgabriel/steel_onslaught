schema_version: "0.1.0"
kind: steel_onslaught.weapon
id: weapon.siege.artillery_mortar_r15
display_name: "Artillery Mortar (Range 15)"
# SO-RANGECAP arm (mortar_r15 x red-dmg-x16, session 2026-07-25): additive
# weapon variant of contracts_data/weapons/artillery_mortar_r30.yaml with
# EXACTLY ONE field further changed -- range 30 -> 15 (a second, deeper cut
# on top of the range 50 -> 30 cut artillery_mortar_r30.yaml already made;
# this file's range is 15, HALF of r30's 30, and 3 cells above red's own
# longest-range weapon, weapon.light.machine_gun at range 12). Every other
# field (damage, cooldown_ticks, heat_generated, pressure_cost,
# accuracy_curve, target_class_effectiveness, damage_type, compatibility)
# is byte-identical to both artillery_mortar.yaml and artillery_mortar_r30
# .yaml -- neither of those files is modified by this one.
#
# CAUSAL HYPOTHESIS (residual-capping-mechanism isolation, SO-RANGECAP):
# P6/P7 (docs/evidence/2026-07-24-pair_p6_dmg16-battery.md,
# 2026-07-25-pair_p7_dmg24-battery.md) both found red's hits-to-kill had
# already overtaken or hard-floored against blue's, yet win rate rose only
# modestly at each further dose step -- an unexplained "residual capping
# mechanism," named as plausibly approach/exposure time or blue's range
# advantage. That range advantage was fixed at r30 across the ENTIRE
# P1-P7 dose sweep and never itself varied: mortar range 30 still
# outranges red's whole kit (machine_gun 12, shrapnel_thrower 8) by 18-22
# cells, and blue's second weapon (harpoon_gun, range 30) is untouched by
# the r30 fix, so blue's total engagement envelope was never meaningfully
# reduced. This file cuts the mortar's range a further 15 cells (30->15,
# exactly halving the r30 standoff distance) to bring it within 3 cells of
# red's own longest engagement range -- the accuracy_curve is untouched,
# so any outcome shift is attributable to standoff distance alone, not a
# combined accuracy/damage/cooldown nerf (the accuracy interpolation
# clamps to the first breakpoint, 0.80 @<=20, for any range below 20,
# per src/steel_onslaught/reducers/weapons.py::interpolate_accuracy --
# confirmed by reading that function before authoring this file, so a
# range value below the curve's first breakpoint does not change hit
# probability once in range, only whether the shot is possible at all).
weapon_class: siege
range: 15
damage: 45
pressure_cost: 20
heat_generated: 15
cooldown_ticks: 5
accuracy_curve:
  - range: 20
    hit_probability: 0.80
  - range: 35
    hit_probability: 0.70
  - range: 45
    hit_probability: 0.55
  - range: 50
    hit_probability: 0.40
target_class_effectiveness:
  light: 0.9
  medium: 1.0
  heavy: 1.3
damage_type: standard
compatibility:
  compatible_chassis_classes:
    - heavy
