schema_version: "0.1.0"
kind: steel_onslaught.weapon
id: weapon.light.shrapnel_thrower_dmg16
display_name: "Shrapnel Thrower (Damage x16)"
# Pair-sweep arm P6 (mortar_r30 x red-dmg-x16, session 2026-07-24):
# additive weapon variant of contracts_data/weapons/shrapnel_thrower.yaml
# with EXACTLY ONE field changed -- damage 12 -> 192 (x16, the next dose
# above the confirmed 0% (x1) -> 3.4% (x3) -> 17.2% (x5.5) -> 27.6% (x8) ->
# 43.3% (x11) curve; paired here with the mortar_r30 approach fix held
# constant, exactly as in P1/P2/P4/P5). Every other field (range,
# pressure_cost, heat_generated, cooldown_ticks, accuracy_curve,
# target_class_effectiveness, damage_type, compatibility) is byte-identical
# to the baseline shrapnel thrower. shrapnel_thrower.yaml itself stays
# untouched -- this is a NEW weapon id, bound only via the P6 berserker
# loadout variant (contracts_data/loadouts/llm_qwen35_berserker_dmg16.yaml).
#
# This arm pre-registers TWO competing hypotheses (see the overlay's own
# header comment): H1 (continued ~linear marginal rate) predicts ~65-70%;
# H2 (kill-speed-parity ceiling) predicts an asymptote near ~50%.
#
# Engine-layer dose prediction (for the verifier to check against the
# reconstructed per-hit raw damage, per the P1/P2/P4/P5 method): blue is
# chassis_class=heavy, so target_class_effectiveness.heavy=0.6 applies and
# damage_raw = int(192 x 0.6) = 115, against the baseline int(12 x 0.6) = 7
# -> 16.43x observed ratio (int() truncation on the baseline side inflates
# the ratio above the nominal 16x, the same artifact documented in
# P1/P2/P4/P5).
weapon_class: light
range: 8
damage: 192
pressure_cost: 6
heat_generated: 5
cooldown_ticks: 2
accuracy_curve:
  - range: 0
    hit_probability: 0.90
  - range: 4
    hit_probability: 0.80
  - range: 6
    hit_probability: 0.65
  - range: 8
    hit_probability: 0.45
target_class_effectiveness:
  light: 1.4
  medium: 0.9
  heavy: 0.6
damage_type: standard
compatibility:
  compatible_chassis_classes:
    - light
    - medium
