schema_version: "0.1.0"
kind: "steel_onslaught.deck"
id: "deck.tactical.v1"
display_name: "Tactical Fire-and-Cover Deck v1"
hand_size: 5
register_count: 5
cards:
  # Four deliberate runtime roles, all backed by existing canonical reducers:
  # precision fire (weapon slot 0), suppressive fire (weapon slot 1),
  # brace/guard (mode evasion), and disengage/cover (away-from-enemy move).
  - card_id: "card.attack.fire_primary"
    count: 6
  - card_id: "card.attack.fire_secondary"
    count: 6
  - card_id: "card.movement.advance"
    count: 5
  - card_id: "card.movement.flank_left"
    count: 2
  - card_id: "card.movement.flank_right"
    count: 2
  - card_id: "card.movement.reposition"
    count: 3
  - card_id: "card.vent.emergency_vent"
    count: 3
  - card_id: "card.special.mode_evasion"
    count: 2
  - card_id: "card.special.mode_recon"
    count: 1
