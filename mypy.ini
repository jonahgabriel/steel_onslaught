[mypy]
strict = True
python_version = 3.12
files = src/, tests/

# OMN-15171: confluent_kafka is the `live` extra (never installed by CI's
# `uv sync --extra dev`, see that extra's own docstring in pyproject.toml) --
# scripts/run_display_salience_battery.py imports it lazily inside a
# try/except ImportError, but mypy still statically resolves the import
# statement. Without this override, CI's dev-only environment fails with
# import-not-found while any environment with `--extra live` synced (this
# worktree, a developer running the live battery) would flag an inline
# `# type: ignore` as unused -- an unavoidable per-environment conflict for
# a single ignore comment. Scoping ignore_missing_imports to this one module
# is env-invariant: harmless when the package IS installed (mypy still
# type-checks it normally, real stubs and all), and suppresses only the
# "cannot find module" class of error when it is not.
[mypy-confluent_kafka.*]
ignore_missing_imports = True
