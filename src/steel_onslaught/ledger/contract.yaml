---
# ONEX Node Contract — append-only event ledger (effect node).
#
# Declares SQLiteLedger as an ONEX effect node: the sole write path for match
# events. append-only enforcement is duplicated at the database layer (triggers
# in 0001_events.sql). Canonical replay ordering is (tick, sequence_in_tick, event_id).
name: match_ledger_effect
contract_version: {major: 1, minor: 1, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Append-only SQLite event ledger — ONEX effect node. Every canonical event
  lands here first (subscriber order: ledger -> fold -> scoring -> leaderboard).
  The full ONEX ModelEnvelope is persisted as envelope_json and round-tripped
  verbatim, so causation chains survive persistence. No update/delete API.

handler:
  module: steel_onslaught.ledger.sqlite_ledger
  class: SQLiteLedger

handler_routing:
  default_handler: steel_onslaught.ledger.sqlite_ledger:SQLiteLedger

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: false  # appending N events creates N rows
  timeout_ms: 1000

event_bus:
  subscribe_topics:
    - onex.evt.steel-onslaught.match-started.v1
    - onex.evt.steel-onslaught.runtime-status-changed.v1
    - onex.evt.steel-onslaught.match-tick.v1
    - onex.evt.steel-onslaught.mech-spawned.v1
    - onex.evt.steel-onslaught.sensor-observation.v1
    - onex.evt.steel-onslaught.pilot-decision-made.v1
    - onex.evt.steel-onslaught.hand-dealt.v1
    - onex.evt.steel-onslaught.plan-committed.v1
    - onex.evt.steel-onslaught.register-resolved.v1
    - onex.evt.steel-onslaught.cards-discarded.v1
    - onex.evt.steel-onslaught.llm-completion-requested.v1
    - onex.evt.steel-onslaught.llm-completion-resolved.v1
    - onex.evt.steel-onslaught.llm-completion-failed.v1
    - onex.evt.steel-onslaught.move-intent.v1
    - onex.evt.steel-onslaught.weapon-fire-intent.v1
    - onex.evt.steel-onslaught.mode-switch-intent.v1
    - onex.evt.steel-onslaught.vent-intent.v1
    - onex.evt.steel-onslaught.movement-resolved.v1
    - onex.evt.steel-onslaught.boiler-updated.v1
    - onex.evt.steel-onslaught.heat-redline-entered.v1
    - onex.evt.steel-onslaught.heat-redline-exited.v1
    - onex.evt.steel-onslaught.boiler-overloaded.v1
    - onex.evt.steel-onslaught.boiler-ruptured.v1
    - onex.evt.steel-onslaught.weapon-fired.v1
    - onex.evt.steel-onslaught.mode-transition-started.v1
    - onex.evt.steel-onslaught.mode-transition-completed.v1
    - onex.evt.steel-onslaught.hit-resolved.v1
    - onex.evt.steel-onslaught.damage-applied.v1
    - onex.evt.steel-onslaught.armor-absorbed.v1
    - onex.evt.steel-onslaught.pilot-injured.v1
    - onex.evt.steel-onslaught.mech-destroyed.v1
    - onex.evt.steel-onslaught.pilot-killed.v1
    - onex.evt.steel-onslaught.victory-declared.v1
    - onex.evt.steel-onslaught.match-ended.v1
    - onex.evt.steel-onslaught.match-scored.v1
  publish_topics: []

db_io:
  db_tables:
    - name: events
      migration: "0001_events.sql"
      access: write
      database: match_ledger
      role: append_only

metadata:
  transport_type: in_process
