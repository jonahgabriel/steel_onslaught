---
# ONEX Node Contract — Defensive pilot archetype (compute node).
name: defensive_pilot_compute
contract_version: {major: 1, minor: 0, patch: 0}
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}

description: >
  Defensive combat archetype — ONEX compute node. Pure, deterministic
  decide(observation) -> decision. Prioritises survivability: heat vent ->
  break sensor lock via evasion -> fire only with high confidence + heat
  headroom -> disengage at low HP -> maintain range. Spec-driven thresholds.

handler:
  module: steel_onslaught.pilots.defensive
  class: DefensivePilot

handler_routing:
  default_handler: steel_onslaught.pilots.defensive:DefensivePilot

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 100

event_bus:
  subscribe_topics: []
  publish_topics: []

metadata:
  transport_type: in_process
