---
# ONEX Node Contract — LLM completion effect node.
name: llm_completion_effect
contract_version: {major: 1, minor: 0, patch: 0}
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}

description: >
  LLM completion effect node — the ONEX effect boundary for LLM calls. Wraps
  the ProtocolLlmClient seam so every request/response becomes evidence on the
  game bus (LLM_COMPLETION_REQUESTED / LLM_COMPLETION_RESOLVED), landing in the
  append-only ledger with causation chains. MatchStateFold ignores these events
  (telemetry slot), so state equality and replay-validity are untouched.
  Network I/O lives here, never in the pure fold or the pilot's decide().

handler:
  module: steel_onslaught.llm.effect
  class: LlmCompletionEffect

handler_routing:
  default_handler: steel_onslaught.llm.effect:LlmCompletionEffect

descriptor:
  node_archetype: effect
  purity: impure
  idempotent: false
  timeout_ms: 30000

event_bus:
  subscribe_topics: []
  publish_topics:
    - onex.evt.steel-onslaught.llm-completion-requested.v1
    - onex.evt.steel-onslaught.llm-completion-resolved.v1

metadata:
  transport_type: in_process
