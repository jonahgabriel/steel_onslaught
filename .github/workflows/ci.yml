name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Python lint + type-check + backend test suite.
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the learn e2e suite AND the evidence tamper-guard test
          # diff files against the merge base with origin/main, which a shallow
          # clone cannot resolve.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install
        run: uv sync --extra dev
      # The proof-of-life e2e (tests/integration/test_proof_of_life.py) spawns
      # the Vite dev server via `npm run dev`, so this backend job needs the
      # frontend deps installed too.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install Playwright chromium
        run: uv run playwright install --with-deps chromium
      - name: Lint
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/
      - name: Type check
        run: uv run mypy src/ tests/
      # OMN-15493: a DENYLIST, deliberately -- never an allowlist. The previous
      # `-m "unit or integration"` selected only marked tests, so forgetting a
      # marker silently deleted a test from CI: 13 tests were in that state,
      # passing locally and never once executed here. `not live` inverts the
      # default so an unmarked test runs, and the only thing skipped is the
      # real-infra opt-in category. Both halves of that contract are enforced
      # by tests/test_ci_marker_selection.py, which reads this very line.
      #
      # --strict-markers is the other half of the inversion: under a denylist a
      # misspelled `@pytest.mark.liv` no longer matches `live`, so it would be
      # SELECTED and point this runner at real Kafka + a real LLM endpoint.
      # Strict marking turns that typo into a collection error. It must stay on
      # this command line -- putting it in pyproject's addopts does NOT work on
      # the pinned pytest 9.0.3 (see the note in pyproject.toml).
      - name: Tests
        run: uv run pytest -m "not live" --strict-markers -v

  # Frontend (Vite + React) lint + test + build.
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      # Full typecheck (tsc --noEmit, root tsconfig): covers src/__tests__,
      # which tsconfig.build.json excludes from the build step. Without this,
      # test-file type drift recurs silently (the class of errors fixed in #127).
      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Frontend tests
        run: npm test
        working-directory: frontend
      - name: Frontend build
        run: npm run build
        working-directory: frontend

  # Public-repo leak gate: scans every tracked text file for absolute
  # developer-machine paths, private Tailscale/LAN IP literals, and embedded
  # ssh host recipes. Stdlib-only, so no project install is needed.
  sanitize-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitization gate
        run: python3 scripts/check_sanitization.py --all

  # Evidence-ticket schema gate: validates every evidence/SO-*.md against the
  # pinned schema (§3c of the evidence-tickets design). Needs the project's
  # pydantic + pyyaml, so it uses a light uv sync (core deps only).
  evidence-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install (core deps only)
        run: uv sync
      - name: Evidence schema gate
        run: uv run python scripts/check_evidence_schema.py
