# Hook revs are pinned to the same tool versions as the project venv (uv.lock)
# so hook results match `uv run ruff` / `uv run mypy` exactly.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # mypy runs in the PROJECT env, not an isolated hook env.
  #
  # `mirrors-mypy` with `additional_dependencies` cannot work here: this repo's
  # own package is never installed into the hook's venv, so every
  # `steel_onslaught.*` import resolved to `import-not-found` and the hook
  # failed on ANY staged Python file — including files it had not touched,
  # because `[tool.mypy] files = ["src/", "tests/"]` widens the run. A gate
  # that can only ever fail is a gate nobody can obey.
  #
  # This runs the exact command CI runs (`uv run mypy src/ tests/`), so hook
  # and CI cannot disagree.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project env, matches CI)
        entry: uv run mypy src/ tests/
        language: system
        types: [python]
        pass_filenames: false
